name: Energético iOS

on:
  push:
    branches:
      - main
      - feat/energetico-ios-chat
    paths:
      - "apps/energetico-mobile/**"
      - ".github/workflows/energetico-ios.yml"
  pull_request:
    paths:
      - "apps/energetico-mobile/**"
      - ".github/workflows/energetico-ios.yml"
  workflow_dispatch:
    inputs:
      distribute:
        description: "Enviar uma versão assinada ao TestFlight"
        required: true
        default: false
        type: boolean
      use_intel_runner:
        description: "Usar executor Intel quando os servidores ARM estiverem indisponíveis"
        required: true
        default: false
        type: boolean
      capture_review_screenshots:
        description: "Capturar telas reais da demonstração nos simuladores iPhone e iPad"
        required: true
        default: false
        type: boolean
      validate_app_store:
        description: "Validar requisitos da App Store sem alterar a Apple"
        required: true
        default: false
        type: boolean
      submit_app_store:
        description: "Enviar a versão e build indicados para revisão da App Store"
        required: true
        default: false
        type: boolean
      app_store_version:
        description: "Versão já enviada à Apple (exemplo: 1.0)"
        required: false
        type: string
      app_store_build:
        description: "Build já processado pela Apple (exemplo: 6)"
        required: false
        type: string
      attach_latest_testflight:
        description: "Associar a build processada ao grupo interno do TestFlight sem gerar nova build"
        required: true
        default: false
        type: boolean
      sync_testflight_testers:
        description: "Manter somente os e-mails indicados no grupo interno do TestFlight"
        required: true
        default: false
        type: boolean
      testflight_allowed_emails:
        description: "E-mails permitidos no grupo interno, separados por vírgula"
        required: false
        default: "bernardonotini@energeticabr.com"
        type: string

permissions:
  contents: read

concurrency:
  group: energetico-ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.validate_app_store || inputs.submit_app_store) && 'app-store' || 'build' }}
  # Finish the active main release; only the newest pending revision waits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && (inputs.validate_app_store || inputs.submit_app_store)) }}

jobs:
  app-store-review:
    name: Validar ou enviar para revisão App Store
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.validate_app_store == true || inputs.submit_app_store == true) }}
    runs-on: ubuntu-latest
    needs: web-tests
    environment: app-store-connect
    concurrency:
      group: energetico-app-store-review
      cancel-in-progress: false
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_APP_PRIVACY_VERIFIED_FOR: ${{ vars.APPLE_APP_PRIVACY_VERIFIED_FOR }}
      APP_STORE_VERSION: ${{ inputs.app_store_version }}
      APP_STORE_BUILD: ${{ inputs.app_store_build }}
      SUBMIT_APP_STORE: ${{ inputs.submit_app_store }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar requisitos e executar somente a ação solicitada
        working-directory: apps/energetico-mobile
        run: node scripts/app-store-submission.mjs

  web-tests:
    name: Testes e pacote web
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Verificar trava dos gestos da assinatura
        working-directory: apps/energetico-mobile
        env:
          SIGNATURE_GESTURE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
        run: |
          base_ref="$SIGNATURE_GESTURE_BASE_REF"
          if ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
            base_ref="${{ github.event.repository.default_branch }}"
          fi
          pnpm guard:signature-gestures -- --base-ref "$base_ref"
      - name: Instalar dependências fixadas
        working-directory: apps/energetico-mobile
        run: pnpm install --frozen-lockfile
      - name: Validar segredos ausentes
        working-directory: apps/energetico-mobile
        run: pnpm secrets:verify
      - name: Conferir layout da ordenação de tarefas
        working-directory: apps/energetico-mobile
        run: node --test tests/tasks-gallery-sort-browser.test.mjs
      - name: Executar testes
        working-directory: apps/energetico-mobile
        run: pnpm test
      - name: Gerar pacote web
        working-directory: apps/energetico-mobile
        run: pnpm build

  native-share-tests:
    name: Testes nativos do compartilhamento
    # Keep ARM by default; Intel is an explicit fallback for runner capacity.
    # Warm the runtime before the same Swift/HTTP and 18 UIKit assertions.
    runs-on: ${{ inputs.use_intel_runner == true && 'macos-26-intel' || 'macos-26' }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testar recebimento nativo e progresso real de arquivos
        working-directory: apps/energetico-mobile
        run: |
          xcrun swiftc ios/ShareExtension/SharedInboxStore.swift ios/ShareExtension/SharedUploadProgress.swift tests/native-share/progress.swift tests/native-share/main.swift -o "$RUNNER_TEMP/energetico-share-tests"
          node scripts/verify-native-share.mjs "$RUNNER_TEMP/energetico-share-tests"
      - name: Aquecer runtime do simulador no executor Intel
        if: ${{ inputs.use_intel_runner == true }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          read -r prewarm_runtime prewarm_phone < <(xcrun simctl list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); r=next(x for x in d["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS 26")); p=next((x for x in d["devicetypes"] if x["name"]=="iPhone 16"),next(x for x in d["devicetypes"] if x["name"].startswith("iPhone"))); print(r["identifier"],p["identifier"])')
          prewarm_id=$(xcrun simctl create ENERGETICO-Share-Prewarm "$prewarm_phone" "$prewarm_runtime")
          cleanup_prewarm() {
            xcrun simctl shutdown "$prewarm_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$prewarm_id"
          }
          trap cleanup_prewarm EXIT
          xcrun simctl boot "$prewarm_id"
          xcrun simctl bootstatus "$prewarm_id" -b
      - name: Verificar o cluster abaixo do mascote no UIKit
        working-directory: apps/energetico-mobile
        run: node scripts/verify-native-share-preview.mjs
      - name: Guardar verificações visuais nativas
        uses: actions/upload-artifact@v4
        with:
          name: energetico-native-share-progress
          path: apps/energetico-mobile/build/native-share-preview
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: Build iOS sem assinatura
    runs-on: ${{ inputs.use_intel_runner == true && 'macos-26-intel' || 'macos-26' }}
    needs: [web-tests, native-share-tests]
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Confirmar Xcode 26
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }' | cut -d. -f1)" = "26"
      - name: Testar ativação no menu Compartilhar
        working-directory: apps/energetico-mobile
        run: |
          xcrun swiftc tests/share-activation/main.swift -o "$RUNNER_TEMP/energetico-activation-tests"
          "$RUNNER_TEMP/energetico-activation-tests"
      - name: Instalar dependências fixadas
        working-directory: apps/energetico-mobile
        run: pnpm install --frozen-lockfile
      - name: Gerar e sincronizar o aplicativo
        working-directory: apps/energetico-mobile
        run: |
          pnpm assets:generate
          # Keep every test; run files serially on the constrained Intel fallback.
          pnpm exec node --test --test-concurrency=${{ inputs.use_intel_runner == true && '1' || '2' }} tests/*.test.mjs
          pnpm build
          pnpm cap:sync
          node scripts/configure-share-extension.mjs
          pnpm ios:verify
      - name: Resolver MSAL
        working-directory: apps/energetico-mobile
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Compilar aplicativo e extensão para o Simulator
        working-directory: apps/energetico-mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/ShareExtension.appex
          "$RUNNER_TEMP/energetico-activation-tests" build/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/ShareExtension.appex/Info.plist
      - name: Guardar build gratuito do Simulator
        uses: actions/upload-artifact@v4
        with:
          name: energetico-ios-simulator
          path: apps/energetico-mobile/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

  review-screenshots:
    name: Capturas reais para App Review
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_review_screenshots == true }}
    runs-on: ${{ inputs.use_intel_runner == true && 'macos-26-intel' || 'macos-26' }}
    needs: ios-simulator
    environment: app-store-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: energetico-ios-simulator
          path: apps/energetico-mobile/build/ReviewApp.app
      - name: Instalar ferramenta de teste fixada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-download"
          gh release download cli-2.10.0 -R mobile-dev-inc/maestro -p maestro.zip -p checksums_sha256.txt -D "$RUNNER_TEMP/maestro-download"
          cd "$RUNNER_TEMP/maestro-download"
          shasum -a 256 -c checksums_sha256.txt
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro"
      - name: Capturar somente telas após login de demonstração
        working-directory: apps/energetico-mobile
        env:
          MAESTRO_REVIEW_USER: ${{ secrets.ENERGETICO_REVIEW_USERNAME }}
          MAESTRO_REVIEW_PASSWORD: ${{ secrets.ENERGETICO_REVIEW_PASSWORD }}
          MAESTRO_BIN: ${{ runner.temp }}/maestro/maestro/bin/maestro
        run: |
          chmod +x build/ReviewApp.app/App
          node scripts/capture-review.mjs build/ReviewApp.app build/review-screenshots
      - name: Guardar apenas imagens públicas sem credenciais
        uses: actions/upload-artifact@v4
        with:
          name: energetico-review-screenshots
          path: apps/energetico-mobile/build/review-screenshots/*.jpg
          if-no-files-found: error
          retention-days: 7

  testflight:
    name: Distribuição TestFlight
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.distribute == true) }}
    # The distribution job does not boot a simulator; keep ARM capacity for its prerequisites.
    runs-on: macos-26-intel
    needs:
      - web-tests
      - ios-simulator
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_APP_PROFILE_B64: ${{ secrets.APPLE_APP_PROFILE_B64 }}
      APPLE_SHARE_PROFILE_B64: ${{ secrets.APPLE_SHARE_PROFILE_B64 }}
    steps:
      - name: Validar credenciais Apple preexistentes
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_B64 \
            APPLE_TEAM_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_APP_PROFILE_B64 \
            APPLE_SHARE_PROFILE_B64
          do
            test -n "${!name:-}" || { echo "Credencial Apple ausente: $name" >&2; exit 1; }
          done
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Instalar dependências e sincronizar
        working-directory: apps/energetico-mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm assets:generate
          pnpm build
          pnpm cap:sync
          node scripts/configure-share-extension.mjs
          pnpm ios:verify
      - name: Instalar certificado e chave da App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/energetico-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/energetico-signing.keychain-db"
          KEYCHAIN_UNLOCK_TOKEN="$(uuidgen)"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "ENERGETICO_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Preparar perfis exclusivos do aplicativo e extensão
        working-directory: apps/energetico-mobile
        run: |
          python3 scripts/install-distribution-profiles.py
          node scripts/distribution-signing.mjs "$RUNNER_TEMP/energetico-signing.json"
      - name: Arquivar e enviar ao TestFlight
        working-directory: apps/energetico-mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "Gerando build TestFlight ${GITHUB_RUN_NUMBER}."
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Energetico.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib

          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          with (temporary / 'ExportOptions.plist').open('rb') as source:
              options = plistlib.load(source)
          expected_bundles = {'br.com.energetica.energetico', 'br.com.energetica.energetico.share'}
          assert options.get('method') == 'app-store-connect', 'Unexpected export method'
          assert options.get('signingStyle') == 'manual', 'Manual signing is required'
          assert options.get('teamID') == os.environ['APPLE_TEAM_ID'], 'Unexpected signing team'
          assert options.get('signingCertificate') == 'Apple Distribution', 'Unexpected signing certificate'
          profiles = options.get('provisioningProfiles', {})
          assert set(profiles) == expected_bundles and all(profiles.values()), 'Both existing profiles are required'
          options['destination'] = 'export'
          options['manageAppVersionAndBuildNumber'] = False
          options['generateAppStoreInformation'] = False
          with (temporary / 'ExportOptions-offline.plist').open('wb') as output:
              plistlib.dump(options, output)
          PY
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions-offline.plist"
          xcodebuild \
            -exportArchive \
            -archivePath build/Energetico.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/TestFlight
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import re
          import shlex
          import zipfile

          packages = sorted(path for path in pathlib.Path('build/TestFlight').rglob('*.ipa') if path.is_file())
          assert len(packages) == 1, 'Expected exactly one exported IPA'
          ipa = packages[0].resolve()
          with zipfile.ZipFile(ipa) as package:
              root_infos = [name for name in package.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', name)]
              assert len(root_infos) == 1, 'Expected exactly one exported application Info.plist'
              info = plistlib.loads(package.read(root_infos[0]))
          bundle = info.get('CFBundleIdentifier')
          version = info.get('CFBundleShortVersionString')
          build = info.get('CFBundleVersion')
          assert bundle == 'br.com.energetica.energetico', 'Unexpected exported bundle identifier'
          assert isinstance(version, str) and re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,2}', version), 'Invalid exported marketing version'
          assert isinstance(build, str) and build == os.environ['GITHUB_RUN_NUMBER'], 'Exported build must equal the workflow run number'
          archived_infos = list(pathlib.Path('build/Energetico.xcarchive/Products/Applications').glob('*.app/Info.plist'))
          assert len(archived_infos) == 1, 'Expected exactly one archived application Info.plist'
          with archived_infos[0].open('rb') as archived_source:
              archived = plistlib.load(archived_source)
          for key in ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion'):
              assert info.get(key) == archived.get(key), 'Export changed archived application metadata'
          attach_source = pathlib.Path('scripts/attach-testflight-build.mjs').read_text(encoding='utf-8')
          app_id = re.search(r"const APP_ID = '([0-9]+)';", attach_source)
          assert app_id and app_id.group(1) == '6809887853', 'Unexpected App Store application identifier'
          values = {'IPA_PATH': str(ipa), 'BUNDLE_ID': bundle, 'MARKETING_VERSION': version, 'BUILD_NUMBER': build}
          metadata = pathlib.Path(os.environ['RUNNER_TEMP']) / 'energetico-ipa-metadata.env'
          metadata.write_text(''.join(f'{key}={shlex.quote(value)}\n' for key, value in values.items()), encoding='utf-8')
          metadata.chmod(0o600)
          PY
          source "$RUNNER_TEMP/energetico-ipa-metadata.env"
          xcrun --find altool >/dev/null
          test -r "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys" \
            xcrun altool --upload-package "$IPA_PATH" \
              --type ios \
              --apple-id 6809887853 \
              --bundle-id "$BUNDLE_ID" \
              --bundle-short-version-string "$MARKETING_VERSION" \
              --bundle-version "$BUILD_NUMBER" \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER_ID" \
              --output-format json
      - name: Associar build processada ao grupo interno do TestFlight
        working-directory: apps/energetico-mobile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
          APP_STORE_BUILD: ${{ github.run_number }}
          TESTFLIGHT_MAX_ATTEMPTS: 40
          TESTFLIGHT_POLL_MS: 30000
        run: node scripts/attach-testflight-build.mjs

  testflight-attach-existing:
    name: Associar build existente ao TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_latest_testflight == true }}
    runs-on: ubuntu-latest
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APP_STORE_BUILD: ${{ inputs.app_store_build }}
      TESTFLIGHT_MAX_ATTEMPTS: 40
      TESTFLIGHT_POLL_MS: 30000
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Associar última build processada
        working-directory: apps/energetico-mobile
        run: node scripts/attach-testflight-build.mjs

  testflight-testers:
    name: Ajustar testadores internos do TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_testflight_testers == true }}
    runs-on: ubuntu-latest
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      TESTFLIGHT_ALLOWED_EMAILS: ${{ inputs.testflight_allowed_emails }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sincronizar testadores internos
        working-directory: apps/energetico-mobile
        run: node scripts/manage-testflight-testers.mjs
