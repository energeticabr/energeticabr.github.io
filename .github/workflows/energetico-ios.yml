name: Energético iOS

on:
  push:
    branches:
      - main
      - feat/energetico-ios-chat
    paths:
      - "apps/energetico-mobile/**"
      - ".github/workflows/energetico-ios.yml"
  pull_request:
    paths:
      - "apps/energetico-mobile/**"
      - ".github/workflows/energetico-ios.yml"
  workflow_dispatch:
    inputs:
      distribute:
        description: "Enviar uma versão assinada ao TestFlight"
        required: true
        default: false
        type: boolean
      capture_review_screenshots:
        description: "Capturar telas reais da demonstração nos simuladores iPhone e iPad"
        required: true
        default: false
        type: boolean
      validate_app_store:
        description: "Validar requisitos da App Store sem alterar a Apple"
        required: true
        default: false
        type: boolean
      submit_app_store:
        description: "Enviar a versão e build indicados para revisão da App Store"
        required: true
        default: false
        type: boolean
      app_store_version:
        description: "Versão já enviada à Apple (exemplo: 1.0)"
        required: false
        type: string
      app_store_build:
        description: "Build já processado pela Apple (exemplo: 6)"
        required: false
        type: string
      attach_latest_testflight:
        description: "Associar a build processada ao grupo interno do TestFlight sem gerar nova build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: energetico-ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.validate_app_store || inputs.submit_app_store) && 'app-store' || 'build' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.validate_app_store || inputs.submit_app_store)) }}

jobs:
  app-store-review:
    name: Validar ou enviar para revisão App Store
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.validate_app_store == true || inputs.submit_app_store == true) }}
    runs-on: ubuntu-latest
    needs: web-tests
    environment: app-store-connect
    concurrency:
      group: energetico-app-store-review
      cancel-in-progress: false
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_APP_PRIVACY_VERIFIED_FOR: ${{ vars.APPLE_APP_PRIVACY_VERIFIED_FOR }}
      APP_STORE_VERSION: ${{ inputs.app_store_version }}
      APP_STORE_BUILD: ${{ inputs.app_store_build }}
      SUBMIT_APP_STORE: ${{ inputs.submit_app_store }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar requisitos e executar somente a ação solicitada
        working-directory: apps/energetico-mobile
        run: node scripts/app-store-submission.mjs

  web-tests:
    name: Testes e pacote web
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Instalar dependências fixadas
        working-directory: apps/energetico-mobile
        run: pnpm install --frozen-lockfile
      - name: Validar segredos ausentes
        working-directory: apps/energetico-mobile
        run: pnpm secrets:verify
      - name: Executar testes
        working-directory: apps/energetico-mobile
        run: pnpm test
      - name: Gerar pacote web
        working-directory: apps/energetico-mobile
        run: pnpm build

  ios-simulator:
    name: Build iOS sem assinatura
    runs-on: macos-26
    needs: web-tests
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Confirmar Xcode 26
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }' | cut -d. -f1)" = "26"
      - name: Testar recebimento nativo de arquivos
        working-directory: apps/energetico-mobile
        run: |
          xcrun swiftc ios/ShareExtension/SharedInboxStore.swift tests/native-share/main.swift -o "$RUNNER_TEMP/energetico-share-tests"
          "$RUNNER_TEMP/energetico-share-tests"
      - name: Testar ativação no menu Compartilhar
        working-directory: apps/energetico-mobile
        run: |
          xcrun swiftc tests/share-activation/main.swift -o "$RUNNER_TEMP/energetico-activation-tests"
          "$RUNNER_TEMP/energetico-activation-tests"
      - name: Instalar dependências fixadas
        working-directory: apps/energetico-mobile
        run: pnpm install --frozen-lockfile
      - name: Gerar e sincronizar o aplicativo
        working-directory: apps/energetico-mobile
        run: |
          pnpm assets:generate
          pnpm test
          pnpm build
          pnpm cap:sync
          node scripts/configure-share-extension.mjs
          pnpm ios:verify
      - name: Resolver MSAL
        working-directory: apps/energetico-mobile
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Compilar aplicativo e extensão para o Simulator
        working-directory: apps/energetico-mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/ShareExtension.appex
          "$RUNNER_TEMP/energetico-activation-tests" build/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/ShareExtension.appex/Info.plist
      - name: Guardar build gratuito do Simulator
        uses: actions/upload-artifact@v4
        with:
          name: energetico-ios-simulator
          path: apps/energetico-mobile/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

  review-screenshots:
    name: Capturas reais para App Review
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_review_screenshots == true }}
    runs-on: macos-26
    needs: ios-simulator
    environment: app-store-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: energetico-ios-simulator
          path: apps/energetico-mobile/build/ReviewApp.app
      - name: Instalar ferramenta de teste fixada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/maestro-download"
          gh release download cli-2.10.0 -R mobile-dev-inc/maestro -p maestro.zip -p checksums_sha256.txt -D "$RUNNER_TEMP/maestro-download"
          cd "$RUNNER_TEMP/maestro-download"
          shasum -a 256 -c checksums_sha256.txt
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro"
      - name: Capturar somente telas após login de demonstração
        working-directory: apps/energetico-mobile
        env:
          MAESTRO_REVIEW_USER: ${{ secrets.ENERGETICO_REVIEW_USERNAME }}
          MAESTRO_REVIEW_PASSWORD: ${{ secrets.ENERGETICO_REVIEW_PASSWORD }}
          MAESTRO_BIN: ${{ runner.temp }}/maestro/maestro/bin/maestro
        run: |
          chmod +x build/ReviewApp.app/App
          node scripts/capture-review.mjs build/ReviewApp.app build/review-screenshots
      - name: Guardar apenas imagens públicas sem credenciais
        uses: actions/upload-artifact@v4
        with:
          name: energetico-review-screenshots
          path: apps/energetico-mobile/build/review-screenshots/*.jpg
          if-no-files-found: error
          retention-days: 7

  testflight:
    name: Distribuição automática/manual TestFlight
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.distribute == true) }}
    runs-on: macos-26
    needs:
      - web-tests
      - ios-simulator
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_APP_PROFILE_B64: ${{ secrets.APPLE_APP_PROFILE_B64 }}
      APPLE_SHARE_PROFILE_B64: ${{ secrets.APPLE_SHARE_PROFILE_B64 }}
    steps:
      - name: Validar credenciais Apple preexistentes
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_B64 \
            APPLE_TEAM_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_APP_PROFILE_B64 \
            APPLE_SHARE_PROFILE_B64
          do
            test -n "${!name:-}" || { echo "Credencial Apple ausente: $name" >&2; exit 1; }
          done
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Instalar dependências e sincronizar
        working-directory: apps/energetico-mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm assets:generate
          pnpm build
          pnpm cap:sync
          node scripts/configure-share-extension.mjs
          pnpm ios:verify
      - name: Instalar certificado e chave da App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/energetico-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/energetico-signing.keychain-db"
          KEYCHAIN_UNLOCK_TOKEN="$(uuidgen)"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "ENERGETICO_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Preparar perfis exclusivos do aplicativo e extensão
        working-directory: apps/energetico-mobile
        run: |
          python3 scripts/install-distribution-profiles.py
          node scripts/distribution-signing.mjs "$RUNNER_TEMP/energetico-signing.json"
      - name: Arquivar e enviar ao TestFlight
        working-directory: apps/energetico-mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "Gerando build TestFlight ${GITHUB_RUN_NUMBER}."
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Energetico.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath build/Energetico.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/TestFlight \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ENERGETICO_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
      - name: Associar build processada ao grupo interno do TestFlight
        working-directory: apps/energetico-mobile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
          TESTFLIGHT_MAX_ATTEMPTS: 40
          TESTFLIGHT_POLL_MS: 30000
        run: node scripts/attach-testflight-build.mjs

  testflight-attach-existing:
    name: Associar build existente ao TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_latest_testflight == true }}
    runs-on: ubuntu-latest
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APP_STORE_BUILD: ${{ inputs.app_store_build }}
      TESTFLIGHT_MAX_ATTEMPTS: 40
      TESTFLIGHT_POLL_MS: 30000
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Associar última build processada
        working-directory: apps/energetico-mobile
        run: node scripts/attach-testflight-build.mjs
