name: Energético iOS

on:
  workflow_dispatch:
    inputs:
      distribute:
        description: "Distribuir no Intel a revisão imutável já validada, dentro de 24 horas"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

# One-off release branch: preserves the registered workflow identity/counter.
# Main's queued distribution must be checked/cancelled by the release operator.
concurrency:
  group: energetico-ios-validated-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-previous-checks:
    name: Validar pré-requisitos imutáveis já executados
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar revisão, última tentativa, testes, idade e contador
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'energeticabr';
            const repo = 'energeticabr.github.io';
            const expectedRepository = `${owner}/${repo}`;
            const expectedPath = '.github/workflows/energetico-ios.yml';
            const expectedSha = '5d08976cc5731db373e767a388cf74701f52dfd5';
            const sourceRunId = 44141321820;
            const sourceRunNumber = 2868;
            const fail = message => { throw new Error(message); };
            if (`${context.repo.owner}/${context.repo.repo}` !== expectedRepository) {
              fail('Repositório de distribuição inesperado.');
            }
            const releaseNumber = Number(process.env.GITHUB_RUN_NUMBER);
            if (!Number.isSafeInteger(releaseNumber) || releaseNumber <= sourceRunNumber) {
              fail('A distribuição deve usar o contador novo do workflow iOS existente.');
            }
            const { data: source } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: sourceRunId,
            });
            if (source.id !== sourceRunId || source.run_number !== sourceRunNumber
                || source.repository?.full_name !== expectedRepository
                || source.head_repository?.full_name !== expectedRepository
                || source.path !== expectedPath || source.event !== 'push'
                || source.head_branch !== 'main' || source.head_sha !== expectedSha) {
              fail('A execução-base não corresponde à revisão imutável autorizada.');
            }
            const createdAt = Date.parse(source.created_at);
            const age = Date.now() - createdAt;
            if (!Number.isFinite(createdAt) || age < 0 || age > 24 * 60 * 60 * 1000) {
              fail('A execução-base precisa ter sido criada nas últimas 24 horas.');
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: source.workflow_id,
            });
            if (workflow.path !== expectedPath) fail('Caminho do workflow-base inesperado.');
            const { data: current } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            if (current.workflow_id !== source.workflow_id || current.path !== expectedPath
                || current.run_number !== releaseNumber || current.event !== 'workflow_dispatch') {
              fail('A distribuição deve continuar a identidade e o contador do workflow iOS existente.');
            }
            const attempt = source.run_attempt;
            if (!Number.isSafeInteger(attempt) || attempt < 1) fail('Tentativa-base inválida.');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id: sourceRunId, attempt_number: attempt, per_page: 100,
            });
            for (const name of [
              'Testes e pacote web',
              'Testes nativos do compartilhamento',
              'Build iOS sem assinatura',
            ]) {
              const matches = jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].status !== 'completed'
                  || matches[0].conclusion !== 'success'
                  || matches[0].head_sha !== expectedSha || matches[0].run_id !== sourceRunId
                  || matches[0].run_attempt !== attempt) {
                fail(`Pré-requisito ausente, duplicado ou sem sucesso na última tentativa: ${name}`);
              }
            }
            const { data: fresh } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: sourceRunId,
            });
            if (fresh.run_attempt !== attempt || fresh.head_sha !== expectedSha) {
              fail('A tentativa-base mudou durante a verificação; nenhuma distribuição foi autorizada.');
            }
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (main.commit?.sha !== expectedSha) {
              fail('Main mudou desde a validação; a distribuição fixa não pode substituir uma revisão mais recente.');
            }
            core.notice(`Revisão ${expectedSha}; run ${sourceRunNumber}, tentativa ${attempt}; três pré-requisitos aprovados; nova build ${releaseNumber}.`);

  testflight:
    name: Distribuição TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
    runs-on: macos-26-intel
    needs: validate-previous-checks
    environment: app-store-connect
    env:
      VALIDATED_SOURCE_SHA: 5d08976cc5731db373e767a388cf74701f52dfd5
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_APP_PROFILE_B64: ${{ secrets.APPLE_APP_PROFILE_B64 }}
      APPLE_SHARE_PROFILE_B64: ${{ secrets.APPLE_SHARE_PROFILE_B64 }}
    steps:
      - name: Validar credenciais Apple preexistentes
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_B64 \
            APPLE_TEAM_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_APP_PROFILE_B64 \
            APPLE_SHARE_PROFILE_B64
          do
            test -n "${!name:-}" || { echo "Credencial Apple ausente: $name" >&2; exit 1; }
          done
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: 5d08976cc5731db373e767a388cf74701f52dfd5
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Confirmar revisão imutável antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SOURCE_SHA"
      - name: Verificar novamente a trava dos gestos da assinatura
        working-directory: apps/energetico-mobile
        shell: bash
        run: |
          set -euo pipefail
          pnpm guard:signature-gestures -- --base-ref "${VALIDATED_SOURCE_SHA}^"
      - name: Instalar dependências e sincronizar
        working-directory: apps/energetico-mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm assets:generate
          pnpm build
          pnpm cap:sync
          node scripts/configure-share-extension.mjs
          pnpm ios:verify
      - name: Instalar certificado e chave da App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/energetico-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/energetico-signing.keychain-db"
          KEYCHAIN_UNLOCK_TOKEN="$(uuidgen)"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_UNLOCK_TOKEN" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "ENERGETICO_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Preparar perfis exclusivos do aplicativo e extensão
        working-directory: apps/energetico-mobile
        run: |
          python3 scripts/install-distribution-profiles.py
          node scripts/distribution-signing.mjs "$RUNNER_TEMP/energetico-signing.json"
      - name: Arquivar e enviar ao TestFlight
        working-directory: apps/energetico-mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "Gerando build TestFlight ${GITHUB_RUN_NUMBER}."
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Energetico.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath build/Energetico.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/TestFlight \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ENERGETICO_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
      - name: Associar build processada ao grupo interno do TestFlight
        working-directory: apps/energetico-mobile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
          APP_STORE_BUILD: ${{ github.run_number }}
          TESTFLIGHT_MAX_ATTEMPTS: 40
          TESTFLIGHT_POLL_MS: 30000
        run: node scripts/attach-testflight-build.mjs
