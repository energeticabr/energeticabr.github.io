name: Backend provision variation changes
on:
  pull_request:
    paths:
      - 'backend-patches/provision-variation-changes/**'
      - '.github/workflows/backend-provision-variation-changes.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/provision-variation-changes/**'
      - '.github/workflows/backend-provision-variation-changes.yml'
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -B -m unittest discover -s backend-patches/provision-variation-changes/tests -p test_deploy.py -v
