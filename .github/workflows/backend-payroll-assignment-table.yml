name: Backend payroll assignment table
on:
  pull_request:
    paths:
      - 'backend-patches/payroll-assignment-table/**'
      - '.github/workflows/backend-payroll-assignment-table.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/payroll-assignment-table/**'
      - '.github/workflows/backend-payroll-assignment-table.yml'
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s backend-patches/payroll-assignment-table/tests -p test_deploy.py -v
