name: Backend direct payroll linking
on:
  pull_request:
    paths:
      - 'backend-patches/payroll-direct-link/**'
      - '.github/workflows/backend-payroll-direct-link.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/payroll-direct-link/**'
      - '.github/workflows/backend-payroll-direct-link.yml'
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B backend-patches/payroll-direct-link/test_deploy.py
