name: PDF native selection
on:
  workflow_dispatch:
  push:
    branches: [fix/pdf-text-selection-webkit-20261104]
    paths:
      - '.github/workflows/pdf-selection-ios.yml'
      - 'apps/energetico-mobile/tests/native-pdf-selection/**'
      - 'apps/energetico-mobile/tests/fixtures/pdf-native-selection.html'
permissions:
  contents: read
jobs:
  native-selection:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: apps/energetico-mobile
      - name: Start synthetic fixture server
        working-directory: apps/energetico-mobile
        run: |
          mkdir -p public/pdfjs
          for folder in cmaps standard_fonts wasm iccs; do
            cp -R "node_modules/pdfjs-dist/$folder" public/pdfjs/
          done
          pnpm exec vite --base / --host 127.0.0.1 --port 4179 --strictPort > "$RUNNER_TEMP/pdf-vite.log" 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4179/tests/fixtures/pdf-native-selection.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/pdfjs/standard_fonts/FoxitSerif.pfb >/dev/null
      - run: brew install xcodegen
      - name: Select iOS 26 simulator
        working-directory: apps/energetico-mobile/tests/native-pdf-selection
        run: |
          set -o pipefail
          xcodebuild -version
          xcodegen generate
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,ds in sorted(data.items(),reverse=True) if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Boot iOS 26 simulator
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Inspect native text layer before accessibility automation
        timeout-minutes: 8
        working-directory: apps/energetico-mobile/tests/native-pdf-selection
        run: |
          set -eo pipefail
          xcodebuild build -project PDFSelection.xcodeproj -scheme PDFSelection -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/pdf-build" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/pdf-build.log" 2>&1
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/pdf-build/Build/Products/Debug-iphonesimulator/PDFSelection.app"
          xcrun simctl launch "$DEVICE" br.com.energetica.pdf-selection-test --mode default
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE" br.com.energetica.pdf-selection-test data)
          for attempt in {1..120}; do
            if [ -f "$APP_DATA/Documents/pdf-status.json" ] && python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if s.get("ready") or s.get("error") else 1)' "$APP_DATA/Documents/pdf-status.json"; then break; fi
            sleep 1
          done
          cp "$APP_DATA/Documents/pdf-status.json" "$RUNNER_TEMP/pdf-native-ready.json"
          cat "$RUNNER_TEMP/pdf-native-ready.json"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/pdf-native-ready.png"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if s.get("ready") and not s.get("error") else 1)' "$RUNNER_TEMP/pdf-native-ready.json"
      - name: Native iPhone long press
        timeout-minutes: 20
        working-directory: apps/energetico-mobile/tests/native-pdf-selection
        run: |
          set -o pipefail
          xcodebuild test -project PDFSelection.xcodeproj -scheme PDFSelection -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/pdf-selection.xcresult" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/pdf-native.log"
      - name: Export synthetic diagnostic screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/pdf-selection.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/pdf-selection.xcresult" --output-path "$RUNNER_TEMP/pdf-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-native-selection-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pdf-native.log
            ${{ runner.temp }}/pdf-vite.log
            ${{ runner.temp }}/pdf-selection.xcresult
            ${{ runner.temp }}/pdf-screenshots
            ${{ runner.temp }}/pdf-build.log
            ${{ runner.temp }}/pdf-native-ready.json
            ${{ runner.temp }}/pdf-native-ready.png
          retention-days: 3
