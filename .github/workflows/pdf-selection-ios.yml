name: PDF native selection
on:
  workflow_dispatch:
  push:
    branches: [fix/pdf-text-selection-webkit-20261104]
    paths:
      - '.github/workflows/pdf-selection-ios.yml'
      - 'apps/energetico-mobile/tests/native-pdf-selection/**'
      - 'apps/energetico-mobile/tests/fixtures/pdf-native-selection.html'
permissions:
  contents: read
jobs:
  native-selection:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: apps/energetico-mobile
      - name: Start synthetic fixture server
        working-directory: apps/energetico-mobile
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4179 --strictPort > "$RUNNER_TEMP/pdf-vite.log" 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4179/tests/fixtures/pdf-native-selection.html >/dev/null && break
            sleep 1
          done
      - run: brew install xcodegen
      - name: Select iOS 26 simulator
        working-directory: apps/energetico-mobile/tests/native-pdf-selection
        run: |
          set -o pipefail
          xcodebuild -version
          xcodegen generate
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,ds in sorted(data.items(),reverse=True) if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Boot iOS 26 simulator
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Native iPhone long press
        timeout-minutes: 20
        working-directory: apps/energetico-mobile/tests/native-pdf-selection
        run: |
          set -o pipefail
          xcodebuild test -project PDFSelection.xcodeproj -scheme PDFSelection -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath "$RUNNER_TEMP/pdf-selection.xcresult" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/pdf-native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-native-selection-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pdf-native.log
            ${{ runner.temp }}/pdf-vite.log
            ${{ runner.temp }}/pdf-selection.xcresult
          retention-days: 3
