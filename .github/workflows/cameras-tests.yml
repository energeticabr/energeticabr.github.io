name: Camera gateway and V380 protocol

on:
  push:
    paths:
      - automations/cameras/**
      - .github/workflows/cameras-tests.yml
  pull_request:
    paths:
      - automations/cameras/**
      - .github/workflows/cameras-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V380 crypto and media tools
        run: |
          python -m pip install -r automations/cameras/requirements-v380.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Test local protocol peers and real HLS encoding
        run: python -B -m unittest discover -s automations/cameras -v
