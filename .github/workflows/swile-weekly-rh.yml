name: SWILE RH provisions contracts

on:
  push:
    branches: [main]
    paths:
      - 'automations/swile-weekly-rh/**'
      - 'automations/monthly-payroll-taxes/**'
      - 'automations/weekly-meal-provisions/**'
      - '.github/workflows/swile-weekly-rh.yml'
  pull_request:
    paths:
      - 'automations/swile-weekly-rh/**'
      - 'automations/monthly-payroll-taxes/**'
      - 'automations/weekly-meal-provisions/**'
      - '.github/workflows/swile-weekly-rh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing monthly report verification dependencies
        run: python -m pip install reportlab==4.4.9 pypdf==6.10.0
      - name: Test SWILE planning, reconciliation, REST and native definition
        run: python -m unittest discover -s automations/swile-weekly-rh -v
      - name: Test shared journal and previous automation
        run: |
          python -m unittest discover -s automations/monthly-payroll-taxes -v
          python -m unittest discover -s automations/weekly-meal-provisions -v
