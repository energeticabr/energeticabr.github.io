name: Backend — vencimento do descritivo

on:
  pull_request:
    paths:
      - 'backend-patches/provision-parent-due/**'
      - '.github/workflows/backend-provision-parent-due.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/provision-parent-due/**'
      - '.github/workflows/backend-provision-parent-due.yml'

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Validar pacote e instalacao sem dados reais
        run: python -B -m unittest discover -s backend-patches/provision-parent-due -v
