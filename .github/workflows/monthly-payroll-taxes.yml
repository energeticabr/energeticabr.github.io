name: Monthly payroll taxes contracts

on:
  push:
    branches: [main]
    paths:
      - 'automations/monthly-payroll-taxes/**'
      - 'automations/weekly-meal-provisions/**'
      - '.github/workflows/monthly-payroll-taxes.yml'
  pull_request:
    paths:
      - 'automations/monthly-payroll-taxes/**'
      - 'automations/weekly-meal-provisions/**'
      - '.github/workflows/monthly-payroll-taxes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF verification dependencies
        run: python -m pip install reportlab==4.4.9 pypdf==6.10.0
      - name: Test all monthly automation contracts
        run: python -m unittest discover -s automations/monthly-payroll-taxes -v
      - name: Preserve weekly standard connector contracts
        run: python -m unittest discover -s automations/weekly-meal-provisions -v
