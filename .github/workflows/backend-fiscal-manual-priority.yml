name: Fiscal manual priority
on:
  pull_request:
    paths:
      - 'backend-patches/fiscal-manual-priority/**'
      - 'backend-patches/on-demand-workers/demand_watch.py'
      - '.github/workflows/backend-fiscal-manual-priority.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/fiscal-manual-priority/**'
      - 'backend-patches/on-demand-workers/demand_watch.py'
      - '.github/workflows/backend-fiscal-manual-priority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend-patches/fiscal-manual-priority -p "test_*.py" -v
