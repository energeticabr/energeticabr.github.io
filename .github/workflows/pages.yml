name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      TZ: America/Sao_Paulo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Energético Web App
        run: pnpm --dir apps/energetico-mobile install --frozen-lockfile

      - name: Validate portal
        run: node --test --test-concurrency=2

      - name: Build Energético Web App
        run: pnpm --dir apps/energetico-mobile run build:pwa

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir _site
          test -f assets/icons/portal-192.png
          test -f assets/icons/portal-512.png
          cp -R assets portal _site/
          cp -- *.html CNAME robots.txt sitemap.xml .nojekyll _site/
          cp -- manifest.webmanifest portal-service-worker.js _site/
          cp -R apps/energetico-mobile/dist-pwa _site/energetico

      - name: Download previously deployed Energético assets
        id: previous-assets
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const repo = context.repo;
            const sources = [];
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const candidates = [];
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/`;
            // Environment deployments are new for each attempt, even for an old rerun.
            deploymentPages: for (let page = 1; ; page++) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...repo, environment: 'github-pages', per_page: 30, page,
              });
              for (const deployment of deployments) {
                if (Date.parse(deployment.created_at) < cutoff) break deploymentPages;
                const statuses = [];
                for (let statusPage = 1; ; statusPage++) {
                  const { data } = await github.rest.repos.listDeploymentStatuses({
                    ...repo, deployment_id: deployment.id, per_page: 100, page: statusPage,
                  });
                  statuses.push(...data);
                  if (data.length < 100) break;
                }
                // An inactive deployment can still have been successfully served.
                for (const status of statuses) {
                  const createdAt = status.created_at || status.updated_at;
                  const time = Date.parse(createdAt);
                  const log = status.log_url || status.target_url || '';
                  const match = log.startsWith(runUrl) && log.slice(runUrl.length).match(/^(\d+)(?:\/|$)/);
                  if (status.state === 'success' && time >= cutoff && match) {
                    candidates.push({ deployment, createdAt, time, runId: Number(match[1]) });
                  }
                }
              }
              if (deployments.length < 30) break;
            }
            // Completion order can differ from deployment creation order.
            candidates.sort((a, b) => b.time - a.time || b.deployment.id - a.deployment.id);
            const seen = new Set();
            for (const candidate of candidates) {
              if (sources.length >= 8) break;
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: candidate.runId });
              if (run.path !== '.github/workflows/pages.yml' || run.head_branch !== 'main'
                || run.head_sha !== candidate.deployment.sha
                || Date.parse(run.run_started_at) > candidate.time) continue;
              const id = `${run.head_sha}-${run.id}-${run.run_attempt}`;
              if (seen.has(id)) continue;
              seen.add(id);
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: run.id, per_page: 100 });
              const available = artifacts.data.artifacts.filter(artifact => !artifact.expired
                && Date.parse(artifact.created_at) >= Date.parse(run.run_started_at)
                && Date.parse(artifact.created_at) <= candidate.time);
              const history = available.find(artifact => artifact.name === 'energetico-web-assets');
              const artifact = history || available.find(artifact => artifact.name === 'github-pages');
              if (!artifact) continue;
              const destination = path.resolve('.previous-energetico', String(run.id));
              fs.mkdirSync(destination, { recursive: true });
              execFileSync('gh', ['run', 'download', String(run.id), '--repo', `${repo.owner}/${repo.repo}`, '--name', artifact.name, '--dir', destination], { stdio: 'inherit' });
              if (!history) execFileSync('tar', ['-xf', path.join(destination, 'artifact.tar'), '-C', destination]);
              sources.push({ dir: history ? destination : path.join(destination, 'energetico'), createdAt: candidate.createdAt, id });
              // A retained archive already includes the complete recent history.
              if (history) break;
            }
            core.setOutput('sources', JSON.stringify(sources));
            core.info(`Restoring assets from ${sources.length} successful deployments.`);

      - name: Preserve complete assets for already open Energético sessions
        env:
          PREVIOUS_ASSETS: ${{ steps.previous-assets.outputs.sources }}
          BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { preserveEnergeticoAssets } from './scripts/preserve-energetico-assets.mjs';
          const result = await preserveEnergeticoAssets({
            currentDir: '_site/energetico',
            previousDirs: JSON.parse(process.env.PREVIOUS_ASSETS || '[]'),
            buildId: process.env.BUILD_ID,
          });
          const { cohorts, ...summary } = result;
          console.log(JSON.stringify(summary));
          NODE

      - name: Keep immutable Energético assets for the next deployment
        uses: actions/upload-artifact@v4
        with:
          name: energetico-web-assets
          overwrite: true
          retention-days: 14
          path: |
            _site/energetico/assets
            _site/energetico/asset-history.json
            !_site/energetico/assets/**/*.map

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
