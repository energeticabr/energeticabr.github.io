name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      TZ: America/Sao_Paulo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Energético Web App
        run: pnpm --dir apps/energetico-mobile install --frozen-lockfile

      - name: Validate portal
        run: node --test

      - name: Build Energético Web App
        run: pnpm --dir apps/energetico-mobile run build:pwa

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir _site
          test -f assets/icons/portal-192.png
          test -f assets/icons/portal-512.png
          cp -R assets portal _site/
          cp -- *.html CNAME robots.txt sitemap.xml .nojekyll _site/
          cp -- manifest.webmanifest portal-service-worker.js _site/
          cp -R apps/energetico-mobile/dist-pwa _site/energetico

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
