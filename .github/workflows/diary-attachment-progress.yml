name: Diary attachment progress protocol
on:
  push:
    branches: [main]
    paths: ["backend-patches/diary-attachment-progress/**", ".github/workflows/diary-attachment-progress.yml"]
  pull_request:
    paths: ["backend-patches/diary-attachment-progress/**", ".github/workflows/diary-attachment-progress.yml"]
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s backend-patches/diary-attachment-progress -p 'test*.py'
