name: NB iOS TestFlight

on:
  pull_request:
    paths:
      - 'apps/energetico-mobile/scripts/prepare-nb-ios.mjs'
      - '.github/workflows/nb-ios.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Operação
        type: choice
        options: [prepare, setup-signing, group, publish, attach]
        default: prepare
      manual_signing:
        description: Usar perfis de distribuição já cadastrados para o NB
        type: boolean
        default: true
      use_intel_runner:
        description: Compilar em um executor macOS Intel
        type: boolean
        default: false
      source_beta_group:
        description: Grupo de origem para reutilizar o único testador interno existente
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nb-ios-${{ github.event.pull_request.number || (inputs.operation == 'setup-signing' && 'setup-signing') || (inputs.operation == 'group' && 'group') || 'testflight' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/energetico-mobile

jobs:
  apple:
    name: Cadastro Apple
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APP_STORE_BUILD: ${{ inputs.operation == 'publish' && github.run_number || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: inputs.operation == 'prepare'
        run: node scripts/nb-apple.mjs register
      - if: inputs.operation == 'publish'
        env:
          NB_MANUAL_SIGNING: ${{ inputs.manual_signing }}
        run: |
          if [[ "$NB_MANUAL_SIGNING" == true ]]; then
            node scripts/nb-apple.mjs wait-profiles
          else
            node scripts/nb-apple.mjs check
          fi
      - if: inputs.operation == 'setup-signing'
        run: node scripts/nb-apple.mjs setup-signing
      - if: inputs.operation == 'group'
        run: node scripts/nb-apple.mjs group
      - if: inputs.operation == 'attach'
        env:
          NB_SOURCE_BETA_GROUP: ${{ inputs.source_beta_group }}
        run: node scripts/nb-apple.mjs attach

  build:
    name: Compilação iOS NB
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || inputs.operation == 'prepare' || (inputs.operation == 'publish' && needs.apple.result == 'success')) }}
    needs: apple
    runs-on: ${{ inputs.use_intel_runner == true && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Compilar e verificar a identidade do NB
        run: |
          pnpm install --frozen-lockfile
          pnpm guard:signature-gestures -- --base-ref origin/main
          node --test tests/nb-participacoes.test.mjs tests/chat-client.test.mjs tests/native-bootstrap.test.mjs
          node scripts/prepare-nb-ios.mjs
          pnpm build --mode nb-participacoes
          pnpm cap:sync
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/nb-simulator \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/nb-simulator.log" 2>&1 \
            || { tail -100 "$RUNNER_TEMP/nb-simulator.log"; exit 1; }
          app=build/nb-simulator/Build/Products/Debug-iphonesimulator/App.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = br.com.energetica.nbparticipacoes
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist")" = NBPAR
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/PlugIns/ShareExtension.appex/Info.plist")" = br.com.energetica.nbparticipacoes.share

  testflight:
    name: Publicação no TestFlight interno
    if: inputs.operation == 'publish'
    needs: [apple, build]
    runs-on: ${{ inputs.use_intel_runner == true && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 55
    environment: app-store-connect
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APP_STORE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/energetico-mobile/pnpm-lock.yaml
      - name: Verificar canal separado no servidor
        run: |
          for endpoint in portal-chat portal-upload portal-transcribe; do
            curl --silent --show-error --fail -D - -o /dev/null -X OPTIONS \
              -H 'Origin: capacitor://localhost' -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: x-portal-app' \
              "https://163-176-171-217.sslip.io/api/$endpoint" \
              | grep -iE '^access-control-allow-headers:.*x-portal-app'
          done
      - name: Preparar NB
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-nb-ios.mjs
          pnpm build --mode nb-participacoes
          pnpm cap:sync
      - name: Instalar certificado e chave Apple existentes
        run: |
          set -eu
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          p12="$RUNNER_TEMP/nb-distribution.p12"
          keychain="$RUNNER_TEMP/nb-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$key"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          chmod 600 "$key" "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          echo "NB_APPLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Instalar e conferir os perfis do NB
        if: inputs.manual_signing
        run: |
          node scripts/nb-apple.mjs profiles
          python3 scripts/install-distribution-profiles.py --nb
          node scripts/distribution-signing.mjs "$RUNNER_TEMP/nb-signing.json"
      - name: Arquivar e enviar somente para o TestFlight interno
        env:
          NB_MANUAL_SIGNING: ${{ inputs.manual_signing }}
        run: |
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$NB_APPLE_KEY" \
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/NB.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$APP_STORE_BUILD" "${auth[@]}" archive
          if [[ "$NB_MANUAL_SIGNING" != true ]]; then
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          options = {
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
              "testFlightInternalTestingOnly": True,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          PY
          fi
          xcodebuild -exportArchive -archivePath build/NB.xcarchive -exportPath build/TestFlight \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}"
      - name: Confirmar a build e o grupo interno na Apple
        env:
          NB_SOURCE_BETA_GROUP: ${{ inputs.source_beta_group }}
        run: node scripts/nb-apple.mjs attach

