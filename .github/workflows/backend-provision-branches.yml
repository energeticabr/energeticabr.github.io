name: Backend — filiais da provisão

on:
  pull_request:
    paths:
      - 'backend-patches/provision-allowed-branches/**'
      - '.github/workflows/backend-provision-branches.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/provision-allowed-branches/**'
      - '.github/workflows/backend-provision-branches.yml'

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar pacote e instalação segura sem dados reais
        run: python -B -m unittest discover -s backend-patches/provision-allowed-branches -v
