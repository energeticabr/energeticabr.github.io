name: Backend attachment replacement tests
on:
  pull_request:
    paths:
      - 'backend-patches/attachment-append-pages/**'
      - '.github/workflows/backend-attachment-append.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/attachment-append-pages/**'
      - '.github/workflows/backend-attachment-append.yml'
permissions:
  contents: read
jobs:
  replacement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install 'pypdf>=5,<6'
      - run: python -B -m unittest discover -s backend-patches/attachment-append-pages -p 'test_*.py'
