name: Trava dos gestos da assinatura

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signature-gesture-lock:
    name: Verificar trava dos gestos da assinatura
    runs-on: ubuntu-latest
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - name: Conferir regra, autorização e impressões digitais
        working-directory: apps/energetico-mobile
        env:
          SIGNATURE_GESTURE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
        run: |
          base_ref="$SIGNATURE_GESTURE_BASE_REF"
          if ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
            base_ref="${{ github.event.repository.default_branch }}"
          fi
          pnpm guard:signature-gestures -- --base-ref "$base_ref"
