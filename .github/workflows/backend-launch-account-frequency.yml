name: Backend launch account frequency
on:
  pull_request:
    paths:
      - 'backend-patches/launch-account-frequency/**'
      - '.github/workflows/backend-launch-account-frequency.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/launch-account-frequency/**'
      - '.github/workflows/backend-launch-account-frequency.yml'
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s backend-patches/launch-account-frequency -p test_deploy.py -v
