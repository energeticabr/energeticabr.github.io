name: Backend attendance inline selectors
on:
  pull_request:
    paths:
      - 'backend-patches/attendance-inline-selects/**'
      - '.github/workflows/backend-attendance-inline-selects.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/attendance-inline-selects/**'
      - '.github/workflows/backend-attendance-inline-selects.yml'
permissions:
  contents: read
jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s backend-patches/attendance-inline-selects -p test_deploy.py -v
