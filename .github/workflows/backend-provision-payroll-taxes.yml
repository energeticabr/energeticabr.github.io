name: Backend provision payroll taxes

on:
  pull_request:
    paths:
      - 'backend-patches/provision-payroll-taxes/**'
      - '.github/workflows/backend-provision-payroll-taxes.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/provision-payroll-taxes/**'
      - '.github/workflows/backend-provision-payroll-taxes.yml'

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s backend-patches/provision-payroll-taxes/tests -p test_deploy.py -v
