name: Energético scanner native cache
on:
  push:
    branches: [main]
    paths: ['apps/energetico-mobile/**', '.github/workflows/energetico-scanner-tests.yml']
  pull_request:
    paths: ['apps/energetico-mobile/**', '.github/workflows/energetico-scanner-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift-cache:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test real scanner cache without camera or uploads
        working-directory: apps/energetico-mobile
        run: |
          swiftc ios/App/App/ScanCache.swift tests/native-scanner/main.swift -o "$RUNNER_TEMP/scanner-test"
          "$RUNNER_TEMP/scanner-test"
  java-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test real scanner cache without camera or uploads
        working-directory: apps/energetico-mobile
        run: |
          javac -d "$RUNNER_TEMP/scanner-classes" android/app/src/main/java/br/com/energetica/energetico/ScanCache.java tests/native-scanner/ScanCacheTest.java
          java -cp "$RUNNER_TEMP/scanner-classes" br.com.energetica.energetico.ScanCacheTest
