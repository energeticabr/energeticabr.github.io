name: Backend provision single unit price
on:
  pull_request:
    paths:
      - 'backend-patches/provision-single-unit-price/**'
      - '.github/workflows/backend-provision-single-unit-price.yml'
  push:
    branches: [main]
    paths:
      - 'backend-patches/provision-single-unit-price/**'
      - '.github/workflows/backend-provision-single-unit-price.yml'
permissions:
  contents: read
jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -B -m unittest discover -s backend-patches/provision-single-unit-price/tests -p test_deploy.py -v
