<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; base-uri 'self'">
  <base href="../../">
  <link rel="stylesheet" href="portal/styles/admin.css">
  <title>Power Apps home fixture</title>
</head>
<body data-test-status="running">
  <main id="root" class="admin-content"></main>
  <script type="module">
    import { ENTITIES } from "./portal/catalog/entities.js";
    import { MODULES } from "./portal/catalog/modules.js";
    import { POWERAPPS_HOME_QUICK_ACTIONS } from "./portal/catalog/powerapps-home-contract.js";
    import { renderPowerAppsHome } from "./portal/ui/powerapps-home-page.js";

    const root = document.querySelector("#root");
    const repository = {
      async resolveList(_siteKey, names) { return { status: "resolved", id: names[0] }; },
      async getColumns() { return []; },
      async getItemsPage() { return { items: [], hasMore: false, nextLink: "" }; },
    };
    const page = renderPowerAppsHome(root, {
      access: {},
      entities: ENTITIES,
      modules: MODULES,
      can: () => true,
      repository,
      isSuperAdmin: true,
    });

    const waitForImages = Promise.all([...root.querySelectorAll("img")].map(image => (
      image.complete ? Promise.resolve() : new Promise(resolve => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", resolve, { once: true });
      })
    )));
    await waitForImages;
    await page.openReport();

    const layer = root.querySelector("[data-home-report-dialog]");
    const reportFocusIsVisible = Boolean(document.activeElement?.closest?.(".powerapps-home-report"));
    const metrics = layer.querySelectorAll("[data-metric-id]");
    const groups = layer.querySelectorAll("[data-metric-group]");
    const imagesLoaded = [...root.querySelectorAll("img")].every(image => image.naturalWidth > 0);
    const mobile = matchMedia("(max-width: 760px)").matches;
    const canvas = root.querySelector(".powerapps-home-canvas");
    const firstTile = root.querySelector(".powerapps-home-tile");
    const canvasStyle = getComputedStyle(canvas);
    const firstTileStyle = getComputedStyle(firstTile);
    const canvasTileDisplay = firstTileStyle.display;
    const mobileMenuDisplay = getComputedStyle(root.querySelector(".powerapps-home-mobile-menu")).display;
    const canvasPlacementWorks = mobile || (
      canvasStyle.backgroundImage.includes("powerapps-home-background.jpg")
      && parseFloat(firstTileStyle.left) > 50
      && parseFloat(firstTileStyle.top) > 50
    );
    const mobileLabelsFit = !mobile || [...root.querySelectorAll(".powerapps-home-mobile-menu span, .powerapps-home-mobile-tools span")]
      .every(label => {
        const labelBox = label.getBoundingClientRect();
        const commandBox = label.closest("a, button")?.getBoundingClientRect();
        return label.scrollWidth <= label.clientWidth + 1 && labelBox.right <= (commandBox?.right || 0) + 1;
      });
    const metricColorsWork = getComputedStyle(groups[0]).getPropertyValue("--dashboard-group-color").trim() !== "";

    page.closeReport();
    await page.openReport("pedidos");
    const entityPanelWorks = layer.querySelector("[data-home-report-title]")?.textContent === "Pedidos para baixa"
      && Boolean(layer.querySelector(".entity-page"))
      && layer.querySelector("[data-home-report-full]")?.getAttribute("href") === "#/entity/notas-pendentes";
    page.closeReport();
    await page.openReport("lancamentos");
    const analyticsPanelWorks = layer.querySelector("[data-home-report-title]")?.textContent === "Análise de lançamentos"
      && Boolean(layer.querySelector(".analytics-page"))
      && layer.querySelector("[data-home-report-full]")?.getAttribute("href") === "#/analytics/financeiro";
    page.closeReport();
    let panelCount = 0;
    let allPanelsWork = true;
    for (const action of POWERAPPS_HOME_QUICK_ACTIONS) {
      await page.openReport(action.report);
      const expectedSelector = action.report === "resumo-geral"
        ? ".dashboard-page"
        : action.href?.startsWith("#/analytics/") ? ".analytics-page" : ".entity-page";
      const fullLink = layer.querySelector("[data-home-report-full]");
      const actionWorks = !layer.hidden
        && layer.querySelector("[data-home-report-title]")?.textContent === action.label
          && Boolean(layer.querySelector(expectedSelector))
          && !layer.querySelector(".dashboard-warning")
          && !layer.querySelector(".reports-warning")
        && (action.href ? fullLink?.getAttribute("href") === action.href : fullLink?.hidden === true);
      allPanelsWork &&= actionWorks;
      panelCount += Number(actionWorks);
      page.closeReport();
    }
    await page.openReport();
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));

    const raceRoot = document.createElement("main");
    document.body.append(raceRoot);
    let releaseRace;
    const raceGate = new Promise(resolve => { releaseRace = resolve; });
    const racePage = renderPowerAppsHome(raceRoot, {
      access: {},
      entities: ENTITIES,
      modules: MODULES,
      can: () => true,
      repository: {
        ...repository,
        async getItemsPage() {
          await raceGate;
          return { items: [], hasMore: false, nextLink: "" };
        },
      },
      isSuperAdmin: true,
    });
    const raceTrigger = [...raceRoot.querySelectorAll('[data-home-report="pedidos"]')]
      .find(candidate => candidate.getClientRects().length > 0);
    raceTrigger.focus();
    const racePending = racePage.openReport("pedidos", raceTrigger);
    while (!raceRoot.querySelector(".entity-page")) await new Promise(resolve => setTimeout(resolve));
    racePage.closeReport();
    releaseRace();
    await racePending;
    const loadingCloseRestoresFocus = document.activeElement === raceTrigger
      && raceRoot.querySelector("[data-home-report-dialog]").hidden;
    racePage.cleanup();
    raceRoot.remove();

    const passed = root.querySelectorAll("[data-home-tile]").length === 7
      && root.querySelectorAll("[data-home-quick-action]").length === 24
      && imagesLoaded
      && metrics.length === 12
      && groups.length === 5
      && reportFocusIsVisible
      && canvasPlacementWorks
      && mobileLabelsFit
      && metricColorsWork
      && entityPanelWorks
      && analyticsPanelWorks
      && allPanelsWork
      && panelCount === 24
      && loadingCloseRestoresFocus
      && layer.hidden
      && document.documentElement.scrollWidth <= window.innerWidth + 1
      && (mobile ? canvasTileDisplay === "none" && mobileMenuDisplay === "grid" : canvasTileDisplay === "flex" && mobileMenuDisplay === "none");

    document.body.dataset.testStatus = passed ? "passed" : "failed";
    document.body.dataset.viewport = mobile ? "mobile" : "desktop";
    document.body.dataset.tiles = String(root.querySelectorAll("[data-home-tile]").length);
    document.body.dataset.shortcuts = String(root.querySelectorAll("[data-home-quick-action]").length);
    document.body.dataset.metrics = String(metrics.length);
    document.body.dataset.groups = String(groups.length);
    document.body.dataset.imagesLoaded = String(imagesLoaded);
    document.body.dataset.entityPanel = String(entityPanelWorks);
    document.body.dataset.analyticsPanel = String(analyticsPanelWorks);
    document.body.dataset.panels = String(panelCount);
    document.body.dataset.scrollWidth = String(document.documentElement.scrollWidth);
    document.body.dataset.innerWidth = String(window.innerWidth);
    document.body.dataset.mobileLabelsFit = String(mobileLabelsFit);
    document.body.dataset.loadingCloseFocus = String(loadingCloseRestoresFocus);
  </script>
</body>
</html>
