<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="admin.html">
  <link rel="stylesheet" href="portal/styles/admin.css">
  <title>Admin | Energética Construções</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4/lib/msal-browser.min.js" defer></script>
  <script type="module" src="portal/config.js"></script>
  <script type="module" src="portal/app.js"></script>
</head>
<body>
  <main
    id="portalRoot"
    data-login-root
    data-logo-src="assets/logo-energetica-oficial.png"
    data-mascot-src="assets/mascote-energetica-transparente.png"
    aria-busy="true"
    aria-labelledby="portalTitle"
  >
    <section class="portal-login" aria-labelledby="portalTitle">
      <p class="portal-kicker">Acesso administrativo</p>
      <h1 id="portalTitle">Portal administrativo</h1>
      <p class="portal-description">Use sua conta corporativa Microsoft para continuar.</p>
      <button data-microsoft-login-action type="button">Entrar com Microsoft</button>
    </section>
  </main>
  <noscript>Ative o JavaScript para acessar o portal administrativo.</noscript>
</body>
</html>
