<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalhamento de produto</title>
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/ui/payment-ledger.css">
<link rel="stylesheet" href="/src/ui/management-report.css">
<link rel="stylesheet" href="/src/ui/report-landscape.css">
<link rel="stylesheet" href="/src/ui/searchable-filter-selects.css">
<main id="app"></main>
<script type="module">
import {createManagementReportView} from '/src/ui/management-report-view.js';
try {
  const launches=Array.from({length:30},(_,index)=>({id:String(index+1),date:'2026-10-02',
    paymentDate:'2026-10-05',branch:'004 - EDIFÍCIO XAVANTE',supplier:'Fornecedor de materiais de construção e serviços',
    product:'CIMENTO CP II — SACO DE 50 KG',stage:'ALVENARIA E ESTRUTURAS',account:'ENERGÉTICA SICOOB',
    unit:10.1234,quantity:2,freight:5,total:25.2468}));
  launches.push({...launches[0],id:'31',date:'2026-09-03',paymentDate:'2026-09-05'});
  launches.push({...launches[0],id:'32',date:'2026-08-15',paymentDate:'2026-08-18',supplier:'Fornecedor secundário',unit:10,quantity:5,freight:0,total:50});
  const provisions=[{...launches[0],id:'33',paymentDate:'',dueDate:'2026-10-06',unit:20,quantity:3,total:65}];
  const view=createManagementReportView({document,data:{loadSnapshot:async()=>({launches,provisions,productTypes:[]})},
    now:()=>new Date('2026-10-05T12:00:00Z')});
  await view.open();
  const root=view.element,report=root.querySelector('.gm-content'),table=root.querySelector('[data-section=expense]');
  const branch=report.querySelector('[data-section=branches] .gm-branch-link');
  branch.scrollIntoView({block:'center',behavior:'instant'});
  const branchBounds=branch.getBoundingClientRect();
  const branchHit=document.elementFromPoint(branchBounds.left+branchBounds.width/2,branchBounds.top+branchBounds.height/2)===branch;
  if(branchHit)branch.click();
  const branchDashboard=root.querySelector('.gm-expense-dashboard-backdrop');
  const branchAnalysis=branchHit&&!branchDashboard.hidden
    &&branchDashboard.querySelector('h2').textContent===branch.textContent
    &&branchDashboard.querySelector('.gm-expense-dashboard-metric.is-total strong').textContent.includes('897,65');
  branchDashboard.querySelector('.gm-expense-dashboard-close').click();
  const branchFocus=document.activeElement===branch;
  table.querySelector('.gm-expense-toggle').click();
  const product=table.querySelector('.gm-product-link');
  product.scrollIntoView({block:'center',behavior:'instant'});
  const previous=report.innerHTML,top=report.scrollTop,left=report.scrollLeft;
  product.click();
  const popup=root.querySelector('.gm-product-backdrop'),dialog=popup.querySelector('[role=dialog]');
  const close=popup.querySelector('button'),scroll=popup.querySelector('.gm-product-scroll');
  const rect=dialog.getBoundingClientRect(),button=close.getBoundingClientRect();
  const safeProbe=document.createElement('div');
  safeProbe.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.append(safeProbe);
  const safeStyle=getComputedStyle(safeProbe),safeTop=parseFloat(safeStyle.paddingTop)||0,safeBottom=parseFloat(safeStyle.paddingBottom)||0;
  safeProbe.remove();
  document.documentElement.dataset.geometry=JSON.stringify({root:root.getBoundingClientRect().toJSON(),
    backdrop:popup.getBoundingClientRect().toJSON(),dialog:rect.toJSON(),
    scroll:scroll.getBoundingClientRect().toJSON(),close:button.toJSON(),height:getComputedStyle(dialog).height,
    maxHeight:getComputedStyle(dialog).maxHeight,gridRows:getComputedStyle(popup).gridTemplateRows,
    fillsReportHeight:Math.abs(rect.top-(popup.getBoundingClientRect().top+safeTop))<=1
      &&Math.abs(rect.bottom-(popup.getBoundingClientRect().bottom-safeBottom))<=1});
  const forecast=popup.querySelector('[data-source=forecast]');
  const paid=popup.querySelector('[data-source=paid]');
  const results={rows:popup.querySelectorAll('[data-entry-id]').length,branchAnalysis,branchFocus,
    forecastOrange:[...forecast.cells].every(cell=>getComputedStyle(cell).backgroundColor==='rgb(255, 224, 178)'),
    paidOrange:[...paid.cells].some(cell=>getComputedStyle(cell).backgroundColor==='rgb(255, 224, 178)'),
    subtotals:[...popup.querySelectorAll('tbody')].map(body=>
      [...body.lastElementChild.cells].map(cell=>cell.textContent.replace(/\s+/g,' ').trim())),
    inside:rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1,
    closeHit:document.elementFromPoint(button.left+button.width/2,button.top+button.height/2)===close,
    scrolls:scroll.scrollHeight>scroll.clientHeight,
    overflow:scroll.scrollWidth>scroll.clientWidth+1,
    backgroundInert:root.querySelector('.gm-dialog').inert,
    preciseUnit:paid.querySelector('[data-column=unit]').textContent.includes('10,1234'),
    charts:{smoothValueLine:scroll.querySelector('[data-chart=monthly-purchases] [data-series]')?.getAttribute('d')?.includes('C')||false,
      monthlyValues:scroll.querySelectorAll('[data-chart=monthly-purchases] [data-month-point]').length,
      supplierBars:scroll.querySelectorAll('[data-chart=suppliers] [data-supplier-bar]').length,
      monthlyQuantities:scroll.querySelectorAll('[data-chart=monthly-quantity] [data-month-bar]').length}};
  results.fillsReportHeight=JSON.parse(document.documentElement.dataset.geometry).fillsReportHeight;
  const supplierOption=()=>scroll.querySelector('[data-supplier-bar="Fornecedor secundário"]').closest('[role=button]');
  supplierOption().scrollIntoView({block:'center',behavior:'instant'});
  const hit=supplierOption().querySelector('.gm-product-chart-hit');
  const hitRect=hit.getBoundingClientRect();
  const clicked=document.elementFromPoint(hitRect.left+hitRect.width/2,hitRect.top+hitRect.height/2);
  const hitOption=clicked?.closest('[data-chart-option]')===supplierOption();
  if(hitOption)clicked.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  const selected=supplierOption();
  results.chartFilter=hitOption&&document.activeElement===selected
    &&selected.getAttribute('aria-pressed')==='true'
    &&scroll.querySelector('[data-month-point="2026-10"]').textContent.includes('0,00')
    &&scroll.querySelector('[data-month-bar="2026-08"]').textContent.endsWith(': 5');
  selected.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
  results.chartFilterCleared=supplierOption().getAttribute('aria-pressed')==='false'
    &&scroll.querySelector('[data-month-point="2026-10"]').textContent.includes('757,40');
  scroll.scrollTop=1000;
  close.click();
  Object.assign(results,{returned:!root.hidden&&popup.hidden,sameDOM:report.innerHTML===previous,
    sameScroll:report.scrollTop===top&&report.scrollLeft===left,focus:document.activeElement===product});
  results.rankings=['suppliers','stages','accounts'].map(section=>{
    const ranking=root.querySelector(`[data-section=${section}]`);
    const toggle=ranking.querySelector('button[aria-expanded]');
    const label=toggle.nextElementSibling;
    const leftOfLabel=toggle.offsetLeft<label.offsetLeft;
    toggle.click();
    const detail=toggle.closest('tr').nextElementSibling;
    const nested=detail.querySelector('button[aria-expanded]');
    nested?.click();
    const fitsWidth=report.scrollWidth<=report.clientWidth+1;
    const count=detail.querySelectorAll('[data-launch-id]').length;
    toggle.click();
    return {leftOfLabel,fitsWidth,count,collapsed:!detail.isConnected};
  });
  report.scrollTop=top;report.scrollLeft=left;
  product.click();
  document.documentElement.dataset.layout=JSON.stringify(results);
} catch(error) {document.documentElement.dataset.layout=JSON.stringify({error:String(error)});}
</script>
</html>
