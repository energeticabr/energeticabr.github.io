<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/energetico/"><title>Teste local de anexos — ENERGÉTICO</title></head>
<body>
<aside style="background:#fff;padding:4px;font-size:12px">
  Teste local — nenhum envio à VM
  <button id="sample-photo">Simular foto enviada</button><button id="sample-pdf">Simular PDF pelo Atalho</button>
  <button id="sample-date">Testar digitação de data</button><output id="keyboard-status" aria-live="polite"></output>
  <button id="sample-formatting">Testar perguntas em negrito</button>
  <button id="sample-typing">Testar 200 teclas com 300 opções</button><output id="typing-status" aria-live="polite"></output>
</aside>
<div id="app"></div>
<aside id="app-tools" aria-label="Instalação e compartilhamento"></aside>
<script type="module">
import { createAppController } from '../../src/app-controller.js';
import { createConversationStore } from '../../src/chat/conversation-store.js';
import { createChatView } from '../../src/ui/chat-view.js';
import { createAttachmentPreview } from '../../src/web/attachment-preview.js';
import { createInstallView } from '../../src/web/install-view.js';
import mascotUrl from '../../src/assets/mascote.png';
import summaryQaUrl from './progress-summary.png';
import '../../src/styles.css';
import '../../src/web/attachment-preview.css';

// Deterministic test-only PDF; exercises all three pages with no user documents.
function samplePdf() {
  const objects = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R 5 0 R 7 0 R] /Count 3 >>'];
  for (let page = 1; page <= 3; page++) {
    const contentId = 2 * page + 2;
    const stream = `BT /F1 24 Tf 48 720 Td (ENERGETICO - pagina ${page} de 3) Tj ET`;
    objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 9 0 R >> >> /Contents ${contentId} 0 R >>`);
    objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
  }
  objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objects.forEach((object, index) => { offsets.push(pdf.length); pdf += `${index + 1} 0 obj\n${object}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${offsets.length}\n0000000000 65535 f \n`;
  pdf += offsets.slice(1).map(offset => `${String(offset).padStart(10, '0')} 00000 n \n`).join('');
  pdf += `trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new File([pdf], 'PDF de teste - 3 páginas.pdf', { type: 'application/pdf' });
}
const store = createConversationStore({ historyMode: 'current-step' });
const remote = new Map();
const activeFlow = { id: 'construction_diary_fill', title: 'PREENCHER DIÁRIO DE OBRAS' };
const descriptors = () => [...remote].map(([id, file]) => ({ id, fileName: file.name, mimeType: file.type, size: file.size, mediaUrl: '/api/portal-media/' + id }));
const preview = createAttachmentPreview({ exportMedia: async () => {} });
const installView = createInstallView(document.querySelector('#app-tools'), {
  client: { status: async () => ({ status: 'active' }) }, standalone: true,
});
const controller = createAppController({
  store, view: createChatView(document.querySelector('#app'), { onOpenSettings: () => installView.open() }),
  auth: { initialize: async () => ({ name: 'Teste local' }), signOut: async () => {} },
  native: { importSharedItems: async () => [], previewMedia: preview.open, closePreview: preview.close, capturePhoto: async () => [], pickDocuments: async () => [] },
  client: {
    sendText: async payload => payload.replyId === 'flow_summary'
      ? { status: 'processed', activeFlow, results: [{ status: 'flow_summary' }], messages: [{ type: 'image', id: 'summary', fileName: 'Resumo do fluxo.png', mediaUrl: '/api/portal-media/summary' }], attachments: descriptors() }
      : { status: 'processed', activeFlow, messages: [{ type: 'text', text: 'Descreva as atividades da obra.' }], attachments: descriptors() },
    sendFile: async file => { remote.set('photo', file); return { status: 'processed', messages: [{ type: 'text', text: 'Deseja adicionar mais anexos?' }], attachments: descriptors() }; },
    getAttachments: async () => descriptors(),
    fetchMedia: async item => item.id === 'summary' ? (await fetch(summaryQaUrl)).blob() : remote.get(item.id),
  },
});
await controller.start();
installView.setReady(true);
document.querySelector('#sample-typing').onclick = () => {
  store.ingestRemoteMessages([{ type: 'poll', question: 'Qual é o registro?', options: Array.from({ length: 300 }, (_, id) => ({ id: String(id), label: `Registro ${id}` })) }]);
  const draft = document.querySelector('#chatDraft');
  draft.focus();
  const start = performance.now();
  for (let i = 1; i <= 200; i++) {
    draft.value = 'a'.repeat(i);
    draft.dispatchEvent(new Event('input', { bubbles: true }));
  }
  const elapsed = Math.round(performance.now() - start);
  const passed = store.getState().draft === 'a'.repeat(200)
    && draft === document.activeElement && draft === document.querySelector('#chatDraft')
    && !document.querySelector('#app-tools [role="dialog"]');
  document.querySelector('#typing-status').textContent = `${passed ? 'PASSOU' : 'FALHOU'}: 200 teclas em ${elapsed} ms, com 300 opções. Campo e texto preservados, sem janela de configuração.`;
};
document.querySelector('#sample-photo').onclick = async () => {
  const blob = await (await fetch(mascotUrl)).blob();
  store.queueFiles([new File([blob], 'Foto do mascote.png', { type: 'image/png' })]);
  await controller.uploadFile(store.getState().pendingFiles[0].id);
};
document.querySelector('#sample-pdf').onclick = async () => { remote.set('pdf', samplePdf()); await controller.refreshAttachments(); };
document.querySelector('#sample-formatting').onclick = () => store.ingestRemoteMessages([
  { type: 'text', text: 'Informe a *data* no formato **DD/MM/AAAA**.' },
  { type: 'poll', question: '*QUAL É A OBRA?*', options: [{ id: 'obra_a', label: '**Obra A**' }, { id: 'obra_b', label: 'Obra B' }] },
]);
document.querySelector('#sample-date').onclick = async () => {
  const draft = document.querySelector('#chatDraft');
  draft.focus();
  let preserved = true;
  for (const value of ['0', '06', '06/', '06/0', '06/09', '06/09/', '06/09/2', '06/09/20', '06/09/202', '06/09/2026']) {
    draft.value = value;
    draft.dispatchEvent(new Event('input', { bubbles: true }));
    await controller.refreshAttachments();
    preserved &&= draft === document.querySelector('#chatDraft') && draft === document.activeElement;
  }
  document.querySelector('#keyboard-status').textContent = preserved
    ? 'PASSOU: campo e foco preservados durante 10 atualizações.'
    : 'FALHOU: campo ou foco alterado.';
};
</script>
</body></html>
