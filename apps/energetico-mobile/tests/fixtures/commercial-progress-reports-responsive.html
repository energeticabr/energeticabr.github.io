<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../src/ui/commercial-progress-reports.css"><link rel="stylesheet" href="../../src/ui/searchable-filter-selects.css"></head>
<body>
<script type="module">
  import { createCommercialProgressReportsView } from "../../src/ui/commercial-progress-reports-view.js";
  const long = "IMOVELCOMNOMEMUITOLONGOESEMSPACESPARATESTARDOBRADELINHASETRANSBORDAMENTOHORIZONTAL".repeat(3);
  const snapshot = {
    properties: [{ id: "1", branch: "Centro", property: long, visualStatus: "ATIVO", saleStatus: "VENDIDO", brokerage: "PAGO EMPRESA", invoice: "PENDENTE", fiscal: "DECLARADO" }],
    contracts: [{ id: "10", branch: "Centro", property: long, buyer: long, status: "VENDIDO", total: 100, saleDate: "2026-09-01", broker: long }],
    clients: [{ id: "1", branch: "Centro", property: long, name: long, definitive: "SIM" }],
    receipts: [{ id: "1", branch: "Centro", property: long, contractId: "10", buyer: long, amount: 100, paidDate: "", dueDate: "2026-10-10", directBroker: "", description: long }],
    milestones: [{ id: "2", branch: "Centro", property: long, contractId: "10", buyer: long, type: long, description: long, startDate: "2026-09-30", dueDate: "2026-10-03", status: "ATIVIDADE INICIADA" }],
  };
  const report = Number(new URLSearchParams(location.search).get("report")) || 14;
  const view = createCommercialProgressReportsView({ data: { async loadSnapshot() { return snapshot; } } });
  document.body.append(view.element);
  await view.open(report);
  document.documentElement.dataset.ready = "true";
</script>
</body>
</html>
