<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salário pago e esperado — dados fictícios</title></head><body><main id="app"></main><script type="module">
import '/src/styles.css';
import '/src/ui/searchable-filter-selects.css';
import '/src/ui/payment-ledger.css';
import '/src/ui/report-print.css';
import '/src/ui/supplier-payroll-report.css';
import { createSupplierPayrollReportView } from '/src/ui/supplier-payroll-report-view.js';
import { decorateReportNavigation } from '/src/ui/report-navigation.js';
import { decorateReportPrint } from '/src/ui/report-print.js';
try {
  const sheets = [
    { id: '1', supplier: 'ALFA FICTÍCIO — VALORES ALTOS', profession: 'Cargo fictício A', month: '2026-10' },
    { id: '2', supplier: 'BRAVO FICTÍCIO — SALÁRIO NÃO INFORMADO', profession: 'Cargo fictício B', month: '2026-10' },
    { id: '9', supplier: 'CHARLIE FICTÍCIO — DUAS FOLHAS', profession: 'Cargo fictício C', month: '2026-10' },
    { id: '10', supplier: 'CHARLIE FICTÍCIO — DUAS FOLHAS', profession: 'Cargo fictício C', month: '2026-10' },
    { id: '4', supplier: 'DELTA FICTÍCIO — DÉCIMO TERCEIRO', profession: 'Cargo fictício D', month: '2026-10' },
  ];
  const salaryExpectations = { '1': 12345678900, '2': null, '9': 320050, '10': 320050, '4': 500000 };
  const rows = [
    { id: '101', payrollId: '1', type: 'Salário', totalCents: 9999999999 },
    { id: '102', payrollId: '2', type: 'Salário', totalCents: 52700 },
    { id: '109', payrollId: '9', type: 'salário', totalCents: 52700 },
    { id: '110', payrollId: '10', type: 'salário', totalCents: 10000 },
    { id: '104', payrollId: '4', type: '13 Salário', totalCents: 120000 },

  const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  for (let i = 0; i < 80 && view.element.querySelectorAll('.spr-salary-expected').length < 3; i++) await frame();

      return { text: plain(node), whiteSpace: getComputedStyle(node).whiteSpace,
        oneLine: new Set(fragments.map(rect => Math.round(portrait ? rect.left : rect.top))).size === 1,

    noExpectedOn13Salary: !unaffected.querySelector('.spr-salary-expected'),

    totalPaidUnchanged: plain(cards[0].querySelector('.spr-total-paid .spr-metric-value')),

} catch (error) { document.documentElement.dataset.layout = JSON.stringify({ error: error.stack || error.message }); }
</script></body></html>
