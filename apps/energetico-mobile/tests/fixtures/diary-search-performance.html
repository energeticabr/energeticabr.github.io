<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação local — pesquisa e miniaturas</title>
<link rel="stylesheet" href="../../src/styles.css"><link rel="stylesheet" href="../../src/ui/launch-gallery.css">
<style>body{margin:0;font-family:Arial,sans-serif}#qa{position:fixed;z-index:9000;bottom:0;background:white;padding:8px;border:1px solid #abc;font-size:12px;max-width:90vw}#qa img{width:78px;height:52px;object-fit:contain;vertical-align:middle}</style>
</head><body><aside id="qa">Prévia local · dados fictícios · <span id="result">Validando…</span><img id="thumbnail" alt="Miniatura de validação"></aside>
<script type="module">
import { createLaunchGallery } from '../../src/ui/launch-gallery-view.js';
import { createMediaThumbnail } from '../../src/web/media-thumbnail.js';
const rows = [
  { id:'901', hasAttachments:false, fields:{ FORNECEDOR:'MAURO CENTRAL', PRODUTO:'CONFERÊNCIA DE OBRA', 'VALOR TOTAL':125, QTD:1 } },
  { id:'902', hasAttachments:false, fields:{ FORNECEDOR:'ANA NORTE', PRODUTO:'INSPEÇÃO', 'VALOR TOTAL':200, QTD:1 } },
];
const result = items => ({ rows:items,count:items.length,page:1,pages:1,filterOptions:{},totals:{paid:items.reduce((sum,item)=>sum+item.fields['VALOR TOTAL'],0)} });
const pending=[];
let requests=0;
const gallery=createLaunchGallery({document,request:(operation,payload)=>{
  if(operation!=='snapshot')throw Error('Unexpected operation');
  requests++;
  return requests===1?Promise.resolve(result(rows)):new Promise(resolve=>pending.push({payload,resolve}));
}});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
await gallery.open();
const root=document.querySelector('.lg-overlay'),search=root.querySelector('[data-gallery-quick-search]');
search.focus();search.value='Mauro';search.dispatchEvent(new Event('input',{bubbles:true}));search.setSelectionRange(2,4);
await sleep(220);
const during={focused:document.activeElement===search,loaderHidden:root.querySelector('.gallery-loading-screen').hidden,
  interactive:!search.closest('[inert]'),cards:root.querySelectorAll('.lg-record').length,
  caret:[search.selectionStart,search.selectionEnd],status:root.querySelector('.lg-list-status').textContent};
search.value='Mauro central';search.dispatchEvent(new Event('input',{bubbles:true}));
pending.shift().resolve(result([rows[1]]));await sleep(0);
const staleIgnored=root.querySelectorAll('.lg-record').length===2;
await sleep(220);pending.shift().resolve(result([rows[0]]));await sleep(0);
const source=document.createElement('canvas');source.width=2400;source.height=1600;
const context=source.getContext('2d');context.fillStyle='#09566b';context.fillRect(0,0,2400,1600);
const blob=await new Promise(resolve=>source.toBlob(resolve,'image/png'));
const preview=await createMediaThumbnail(blob,'photo.png');
const small=await createImageBitmap(await(await fetch(preview)).blob());
const dimensions=[small.width,small.height];small.close();
document.querySelector('#thumbnail').src=preview;
document.querySelector('#result').textContent='Busca sem interrupção · miniatura 520 × 347';
const layout={during,staleIgnored,finalIds:[...root.querySelectorAll('.lg-record')].map(item=>item.dataset.itemId),
  search:search.value,thumbnail:dimensions,overflow:root.scrollWidth>innerWidth+1};
document.documentElement.dataset.layout=JSON.stringify(layout);
</script></body></html>
