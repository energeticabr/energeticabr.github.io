const card = document.querySelector('.launch-completion');
const result = card ? {

  data: [...card.querySelectorAll('dt, dd')].map(el => {
    const rect = el.getBoundingClientRect();
    return { text: el.textContent.trim(), left: rect.left, right: rect.right, font: parseFloat(getComputedStyle(el).fontSize), overflow: el.scrollWidth > el.clientWidth };
  }),
  headingFont: parseFloat(getComputedStyle(card.querySelector('h2')).fontSize),
