<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/payroll-breakdown.css"><title>Desdobrar folha - prévia</title></head><body><main></main><script type="module">
import { createPayrollBreakdownView } from '/src/ui/payroll-breakdown-view.js';
import { validatePayrollBreakdown } from '/src/chat/payroll-breakdown.js';
const suppliers = [{ id:'1', label:'CLEITON CESAR NONATO', branch:'004 - EDIFÍCIO XAVANTE', profession:'SERVENTE DE PEDREIRO' },{ id:'2', label:'EDGAR NELSON DA SILVA', branch:'004 - EDIFÍCIO XAVANTE', profession:'MESTRE DE OBRAS' }];
window.view = createPayrollBreakdownView({ documentRef:document, now:()=>new Date('2026-10-16T12:00:00Z'), data:{loadSuppliers:async()=>suppliers,loadPayrollContext:async()=>({sheetId:'19',paid:{salary:1234.56,meal:200},paidTotal:1434.56}),post:async draft=>{const summary=validatePayrollBreakdown(draft);return {...summary,lines:summary.lines.map((line,index)=>({...line,id:String(index+1),parentId:String(index+10)}))};}} });
await window.view.open();
if(new URLSearchParams(location.search).has('measure')){
 document.querySelector('[data-breakdown-supplier="1"]').click();document.querySelector('[data-breakdown-next]').click();
 while(!document.querySelector('[data-breakdown-value]'))await new Promise(requestAnimationFrame);
 const input=document.querySelector('[data-breakdown-value="2026-10-02:salary"]');input.value='500';input.dispatchEvent(new Event('input'));
 const total=document.querySelector('.payroll-breakdown-totals');total.open=true;total.scrollIntoView({block:'end'});
 await new Promise(requestAnimationFrame);
 const table=total.querySelector('table'),body=document.querySelector('.payroll-breakdown-body'),rect=table.getBoundingClientRect();
 document.documentElement.dataset.layout=JSON.stringify({width:innerWidth,left:rect.left,right:rect.right,scrollWidth:body.scrollWidth,clientWidth:body.clientWidth,headings:[...table.querySelectorAll('thead th')].map(node=>node.textContent),salary:[...table.querySelector('tbody tr').cells].map(node=>node.textContent),total:[...table.querySelector('tbody tr:last-child').cells].map(node=>node.textContent)});
}
</script></body></html>
