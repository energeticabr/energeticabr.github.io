<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adicionar páginas — teste local</title></head>
<body><main id="app"></main><script type="module">
import '../../src/styles.css';
import '../../src/web/attachment-preview.css';
import { createChatView } from '../../src/ui/chat-view.js';
import { createConversationStore } from '../../src/chat/conversation-store.js';
import { createAppController } from '../../src/app-controller.js';
import { createAttachmentPreview } from '../../src/web/attachment-preview.js';
import { createBrowserPorts } from '../../src/web/browser-ports.js';
import { installAppZoomGuard } from '../../src/web/app-zoom-guard.js';
import { PDFDocument, rgb } from 'pdf-lib';

// Fictitious picker/camera/server boundaries. Real controller, PDF composition,
// store, tray, event handlers and PDF renderer. No real uploads or tenant data.
const params = new URLSearchParams(location.search), root = document.querySelector('#app');
installAppZoomGuard();
const browserPorts = createBrowserPorts();
const store = createConversationStore(), view = createChatView(root), preview = createAttachmentPreview({ canEmbedPdf: () => false });
const initialId = 'a'.repeat(64), blobs = new Map();
let replacements = 0, replacementRequests = 0, pickerCalls = 0, cameraCalls = 0, networkWrites = 0, sentText = 0, sentFile = 0;
let confirmReplacement;
const confirmation = new Promise(resolve => { confirmReplacement = resolve; });
const interactions = [];
for (const capture of [true, false]) document.addEventListener('click', event => {
  if (!event.target.closest?.('.attachment-preview-dialog, .document-scanner')) return;
  interactions.push({ capture, trusted: event.isTrusted, action: event.target.dataset.previewAction || event.target.dataset.cameraMode || '',
    defaultPrevented: event.defaultPrevented, menuHidden: document.querySelector('.attachment-preview-append-menu')?.hidden,
    modals: [...document.querySelectorAll('dialog:modal')].map(dialog => dialog.className) });
}, capture);
const originalFetch = window.fetch;
window.fetch = (url, options) => { if (options?.method && !['GET','HEAD'].includes(options.method)) networkWrites++; return originalFetch(url, options); };
async function pdf(title, count = 1) {
  const doc = await PDFDocument.create();
  for (let i = 0; i < count; i++) {
    const page = doc.addPage([400,560]);
    page.drawRectangle({ x: 20, y: 20, width: 360, height: 520, borderWidth: 2, borderColor: rgb(.05,.33,.4) });
    page.drawText(title, { x: 40, y: 490, size: 19, color: rgb(.05,.33,.4) });
    page.drawText(`PAGINA ${i + 1}`, { x: 40, y: 450, size: 15 });
    page.drawText('Documento ficticio - sem envio real', { x: 40, y: 400, size: 12 });
  }
  return new File([await doc.save()], title.toLowerCase().replaceAll(' ','-') + '.pdf', { type: 'application/pdf' });
}
async function photo() {
  const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,400,560);
  ctx.fillStyle = '#0c576a'; ctx.strokeStyle = '#0c576a'; ctx.lineWidth = 2; ctx.strokeRect(20,20,360,520);
  ctx.font = 'bold 22px sans-serif'; ctx.fillText('FOTO FICTICIA',40,75);
  ctx.font = '16px sans-serif'; ctx.fillText('Uma imagem vira uma pagina',40,115);
  return new File([await new Promise(resolve => canvas.toBlob(resolve, 'image/png'))], 'foto.png', { type: 'image/png' });
}
const original = params.get('base') === 'image' ? await photo() : await pdf('DOCUMENTO ORIGINAL', 2);
const additional = await pdf('ARQUIVO ADICIONADO'), image = await photo(), scan = await pdf('ESCANEAMENTO',2);
blobs.set(initialId, original);
let attachments = [{ id: initialId, fileName: original.name, size: original.size, mimeType: original.type, mediaUrl: '/synthetic/original' }];
const flow = { id: 'document_create', contextId: 'synthetic-batch', title: 'ADICIONAR UM NOVO DOCUMENTO' };
const question = { id: 'question', type: 'poll', question: 'Qual a filial do documento?', options: [{ id:'test-branch',label:'FILIAL FICTICIA' }] };
const controller = createAppController({ store, view,
  auth: { initialize: async () => ({ homeAccountId:'synthetic',name:'Teste local' }), getToken:async () => 'synthetic-only' },
  diaryFieldVisitDataFactory:async () => ({load:async()=>[]}),
  pendingProvisionAttachmentsDataFactory:async () => ({loadUpcomingPayments:async()=>[],listAttachments:async()=>[]}),
  native: { importSharedItems:async()=>[], previewMedia:preview.open, closePreview:preview.close,
    pickDocuments:async()=>{ pickerCalls++; return params.has('browser-picker') ? browserPorts.pickDocuments() : [additional,image]; },
    capturePhoto:async()=>{ cameraCalls++;return params.has('browser-picker') ? browserPorts.capturePhoto() : [image]; }, scanDocument:async()=>{ cameraCalls++;return [scan]; } },
  client: { fetchMedia:async item=>blobs.get(item.id),
    getAttachments:async()=>attachments,
    sendText:async()=>{ sentText++; return {status:'processed',messages:[question],activeFlow:flow,attachments}; },
    sendFile:async()=>{ sentFile++; throw new Error('Não reenviar no chat'); },
    replaceAttachment:async(id,file,options)=>{
      if(id!==attachments[0].id)throw new Error('Alvo incorreto');
      replacementRequests++;
      if(params.has('hold-confirmation')) await confirmation;
      options.onProgress?.({percent:45}); await new Promise(resolve=>setTimeout(resolve,120));
      const replacement={id:(++replacements===1?'b':'c').repeat(64),fileName:file.name,size:file.size,mimeType:file.type,mediaUrl:'/synthetic/replaced'};
      blobs.set(replacement.id,file);attachments=[replacement];
      return {status:'processed',operation:'attachment_replaced',requestId:options.requestId,previousAttachmentId:id,replacement,attachments,messages:[]};
    } } });
async function wait(predicate,label) {
  const deadline=performance.now()+15000;
  while(!predicate()){if(performance.now()>deadline)throw new Error(label);await new Promise(requestAnimationFrame);}
}
async function openTray() {
  await wait(()=>root.querySelector('[data-action="open-file"]'),'Anexo não apareceu na bandeja');
  root.querySelector('[data-action="open-file"]').click();
  await wait(()=>document.querySelector('[data-preview-action="append-pages"]:not([hidden]):not(:disabled)'),'Botão + não apareceu');
}
try {
  await controller.start();
  store.ingestRemoteMessages([question],{activeFlow:flow,attachments}); store.setDraft('Rascunho preservado');
  const beforeMessages=JSON.stringify(store.getState().messages), initialText=sentText;
  await openTray();
  if(params.has('manual')) {
    window.attachmentAppendFixture = {
      snapshot: () => ({ replacements, replacementRequests, pickerCalls, cameraCalls, interactions, attachments: store.getState().attachments,
        pendingFiles: store.getState().pendingFiles.length,
        unchangedQuestion: JSON.stringify(store.getState().messages) === beforeMessages,
        unchangedDraft: store.getState().draft === 'Rascunho preservado', noReply: sentText === initialText,
        sentFile, networkWrites }),
      confirmReplacement,
      changeFlow() { store.ingestRemoteMessages([], { activeFlow: { ...flow, contextId: 'synthetic-next-batch' } }); },
      selectFiles(kind = 'files') {
        const input = document.querySelector('input[type="file"]');
        if (!input) throw new Error('Seletor não abriu');
        const selection = new DataTransfer();
        for (const file of kind === 'files' ? [additional, image] : [image]) selection.items.add(file);
        input.files = selection.files;
        input.dispatchEvent(new Event('change'));
      },
      async pageCount() {
        const file = blobs.get(store.getState().attachments[0].id);
        return file.type === 'application/pdf' ? (await PDFDocument.load(await file.arrayBuffer())).getPageCount() : 1;
      },
    };
  }
  if(!params.has('manual')) {
    document.querySelector('[data-preview-action="append-pages"]').click();
    if(params.get('mode')!=='menu') {
      const camera=params.get('mode')==='camera';
      document.querySelector(`[data-preview-action="append-${camera?'camera':'files'}"]`).click();
      if(camera) { await wait(()=>document.querySelector('[data-camera-mode="scan"]'),'Opções foto/scan não abriram'); document.querySelector('[data-camera-mode="scan"]').click(); }
      await wait(()=>replacements===1 && document.querySelector('.attachment-preview-append:not(:disabled)'),'PDF não substituído');
      await wait(()=>document.querySelector('.attachment-preview-pdf canvas') && document.querySelector('.attachment-preview-status [aria-valuenow="100"]'),'PDF não renderizou');
    }
    const rect=document.querySelector('.attachment-preview-dialog').getBoundingClientRect();
    const controls=[...document.querySelectorAll('.attachment-preview-header button')].filter(el=>el.checkVisibility()).map(el=>({label:el.textContent,width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height}));
    const menu=document.querySelector('.attachment-preview-append-menu').getBoundingClientRect();
    const final=blobs.get(store.getState().attachments[0].id);
    const result={pages:final.type==='application/pdf'?(await PDFDocument.load(await final.arrayBuffer())).getPageCount():1,
      tray:store.getState().attachments.length,type:final.type,replacements,pickerCalls,cameraCalls,networkWrites,sentFile,
      unchangedQuestion:JSON.stringify(store.getState().messages)===beforeMessages,
      unchangedDraft:store.getState().draft==='Rascunho preservado',noReply:sentText===initialText,
      overflow:rect.left<0||rect.right>innerWidth,menuOverflow:menu.width>0&&(menu.left<0||menu.right>innerWidth),controls};
    document.documentElement.dataset.layout=JSON.stringify(result);
  }
} catch(error) { document.documentElement.dataset.layout=JSON.stringify({error:error.stack||String(error)}); }
</script></body></html>
