<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/src/ui/operations-reports.css">
  <style>html,body { margin:0; width:100%; max-width:100%; } main { width:100%; min-width:0; } section { margin-bottom:10px; }</style>
</head>
<body>
<main id="reports"></main>
<script type="module">
  import { createOperationsReportsView } from "/src/ui/operations-reports-view.js";
  const long = "EXTRAORDINARIAMENTEUMTEXTOEXTENSOSEMESPAÇOS".repeat(7);
  const snapshots = {
    6: { stages: [{ branch: long, stage: long, start: "2026-09-01", end: "", status: "INICIADO", percent: 25, activities: [{ id: "1", activity: long, property: long, supplier: long, start: "2026-09-01", end: "2026-10-01", status: "ATIVIDADE INICIADA" }] }] },
    7: { count: 1, rows: [{ id: "44", date: "2026-10-01", branch: long, status: "PENDENTE" }] },
    8: { summary: { pending: 1, completed: 0, total: 1 }, rows: [{ id: "7", identified: "2026-10-01", due: "2026-10-05", responsible: long, responsibleKey: long, status: "ATIVIDADE CRIADA", difficulty: long, association: long, priority: "ATIVIDADE EMERGENCIAL", task: long }] },
  };
  if (new URL(location.href).searchParams.has('visual')) {
    snapshots[6].stages[0] = { branch: '004 - EDIFÍCIO XAVANTE', stage: 'ALVENARIA E ESTRUTURAS', start: '2026-08-10', end: '', status: 'INICIADO', percent: 0, activities: [
      { id: '1', activity: 'EXECUÇÃO PAREDES ARRIMO', property: 'TODOS', supplier: 'EDGAR NELSON DA SILVA', start: '2026-06-19', end: '', status: 'ATIVIDADE INICIADA' },
      { id: '2', activity: 'ARMAÇÃO FERRAGEM ARRIMO', property: 'TODOS', supplier: '—', start: '2026-08-10', end: '', status: 'ATIVIDADE INICIADA' },
    ] };
    snapshots[7] = { count: 2, rows: [
      { id: '209', date: '2026-10-02', branch: '004 - EDIFÍCIO XAVANTE', status: 'PENDENTE' },
      { id: '208', date: '2026-10-01', branch: '004 - EDIFÍCIO XAVANTE', status: 'PENDENTE' },
    ] };
    snapshots[8] = { summary: { pending: 4, completed: 15, total: 19 }, rows: [
      { id: '47', identified: '2026-08-01', due: '2026-08-02', responsible: 'PLANALTO TINTAS', responsibleKey: 'PLANALTO TINTAS', status: 'ATIVIDADE CRIADA', difficulty: 'MÉDIA', association: 'FINANCEIRO E TRIBUTÁRIO', priority: 'NÃO PRIORITÁRIA', task: 'COBRAR NOTA FISCAL PLANALTO TINTAS' },
      { id: '48', identified: '2026-08-03', due: '2026-08-14', responsible: '', responsibleKey: 'SEM RESPONSÁVEL', status: 'EM ATENDIMENTO', difficulty: 'BAIXA', association: '', priority: 'NÃO PRIORITÁRIA', task: 'VENDER 200 VALE PETROBRAS TODOS OS MESES' },
    ] };
  }
  const selectedReport = Number(new URL(location.href).searchParams.get('report'));
  for (const number of [6, 7, 8].filter(number => !selectedReport || number === selectedReport)) {
    const view = createOperationsReportsView({ document, data: { async loadReport(report) { return snapshots[report]; } } });
    document.getElementById("reports").append(view.element);
    await view.open(number);
  }
  await Promise.all([...document.querySelectorAll('.or-brand img')].map(image => image.decode().catch(() => {})));
  const reportWidths = [...document.querySelectorAll(".or-report")].map(node => ({
    report: node.querySelector("h2")?.textContent,
    width: node.getBoundingClientRect().width,
    scrollWidth: node.scrollWidth,
    childOverflow: [...node.querySelectorAll("*")].some(child => child.getBoundingClientRect().right > innerWidth + 1),
    font: getComputedStyle(node).fontFamily,
    logoLoaded: node.querySelector('.or-brand img')?.naturalWidth > 0,
    logoSource: node.querySelector('.or-brand img')?.src,
    brandBackground: getComputedStyle(node.querySelector('.or-brand')).backgroundColor,
    filterBackground: node.querySelector('.or-filter-label') && getComputedStyle(node.querySelector('.or-filter-label')).backgroundColor,
    stageBorder: node.querySelector('.or-stage-card') && getComputedStyle(node.querySelector('.or-stage-card')).borderTopColor,
    stageSummaryDisplay: node.querySelector('.or-stage-summary') && getComputedStyle(node.querySelector('.or-stage-summary')).display,
    dueSummaryDisplay: node.querySelector('.or-due-summary') && getComputedStyle(node.querySelector('.or-due-summary')).display,
    pendingColor: node.querySelector('.or-diary-card [data-tone="danger"]') && getComputedStyle(node.querySelector('.or-diary-card [data-tone="danger"]')).color,
    footerBackground: node.querySelector('.or-diary-footer') && getComputedStyle(node.querySelector('.or-diary-footer')).backgroundColor,
    metricBackgrounds: [...node.querySelectorAll('.or-metric')].map(card => getComputedStyle(card).backgroundColor),
  }));
  document.documentElement.dataset.layout = JSON.stringify({ viewport: innerWidth, document: document.documentElement.scrollWidth, reportWidths });
</script>
</body>
</html>
