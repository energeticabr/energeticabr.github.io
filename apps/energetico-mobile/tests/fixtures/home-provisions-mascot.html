     const bytes=new Uint8Array(await pdf.arrayBuffer()),output=document.createElement('output');output.dataset.pdfSample=action;output.hidden=true;output.textContent=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));document.body.append(output);
    }
    await task.destroy();panel.close();
   }
   await report.open();const supplier=report.element.querySelector('[name=supplier]');supplier.value='Alfa';supplier.dispatchEvent(new Event('change'));
   report.element.querySelector('[data-action=print-report-pdf]').click();
   await new Promise((resolve,reject)=>{const check=()=>{if(document.querySelector('.attachment-preview-content canvas')){observer.disconnect();clearTimeout(timer);resolve();}};const observer=new MutationObserver(check);observer.observe(document.body,{subtree:true,childList:true});const timer=setTimeout(()=>{observer.disconnect();reject(new Error('PDF viewer did not render'));},15000);check();});
   const viewer={open:document.querySelector('.attachment-preview-dialog').open,canvas:Boolean(document.querySelector('.attachment-preview-content canvas')),forward:!document.querySelector('.attachment-preview-export').disabled,back:document.querySelector('.attachment-preview-back').textContent,automaticShare:document.documentElement.dataset.shared==='true'};
   document.querySelector('.attachment-preview-close').click();viewer.returned=!report.element.hidden&&supplier.value==='Alfa';
   document.documentElement.dataset.layout=JSON.stringify({results,viewer});
  }catch(error){document.documentElement.dataset.layout=JSON.stringify({error:error.stack});}
 }
}
