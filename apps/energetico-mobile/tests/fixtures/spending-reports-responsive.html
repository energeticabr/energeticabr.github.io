<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/src/ui/spending-reports.css?v=powerapps-parity">
  <style>html,body { width: 100%; margin: 0; box-sizing: border-box; } body { padding: 10px; font-family: Arial, sans-serif; } main { width: 100%; min-width: 0; }</style>
</head>
<body>
  <main id="host"></main>
  <script type="module">
    import { createSpendingReportsView } from "/src/ui/spending-reports-view.js";
    const long = new URLSearchParams(location.search).has("long")
      ? "FORNECEDOR-COM-NOME-ININTERRUPTO-MUITO-LONGO-".repeat(12)
      : "004 - EDIFÍCIO XAVANTE";
    const row = { id: "123", date: "2026-09-12", paymentDate: "2026-09-25", supplier: long,
      product: long, branch: long, disbursement: "SIM", order: "42", stage: long, account: long,
      description: long, unit: 20, quantity: 2, freight: 5, total: 45 };
    const view = createSpendingReportsView({ document, data: { async loadSnapshot() {
      return Number(new URLSearchParams(location.search).get("report")) === 9
        ? { launches: [row], productTypes: [{ product: long, expenseType: long }] }
        : { recurrences: [{ id: "7", status: "ATIVO" }], provisions: [{ id: "41", recurrenceId: "7",
          branch: long, supplier: new URLSearchParams(location.search).has("long") ? long : "VIVO",
          product: new URLSearchParams(location.search).has("long") ? long : "TARIFA DE INTERNET", dueDate: "2026-10-04", schedule: "PENDENTE",
          status: "PAGAMENTO PREVISTO", total: 89.99 }] };
    } } });
    document.querySelector("#host").append(view.element);
    await view.open(Number(new URLSearchParams(location.search).get("report")));
    document.documentElement.dataset.ready = "true";
  </script>
</body>
</html>
