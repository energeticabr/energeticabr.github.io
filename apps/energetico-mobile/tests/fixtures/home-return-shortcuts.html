<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/payment-ledger.css"><link rel="stylesheet" href="/src/ui/tax-guides-report.css"><link rel="stylesheet" href="/src/ui/searchable-filter-selects.css"></head>
<body><main id="app"></main><script>
const fixtureError=error=>document.documentElement.dataset.layout=JSON.stringify({fixtureError:String(error?.stack||error)});
window.addEventListener('error',event=>fixtureError(event.error||event.message));
window.addEventListener('unhandledrejection',event=>fixtureError(event.reason));
</script><script type="module">
import { createChatView } from '/src/ui/chat-view.js';
import { createPaymentLedgerView } from '/src/ui/payment-ledger-view.js';
import { createTaxGuidesReportView } from '/src/ui/tax-guides-report-view.js';
import { decorateReportPrint } from '/src/ui/report-print.js';

const question = 'QUAL ÁREA VOCÊ DESEJA ACESSAR?';
const notice = '📎 OS DADOS DO FLUXO FORAM ELIMINADOS. OS ANEXOS FORAM TRANSFERIDOS PARA O PRÓXIMO FLUXO.';
const menu = { id: 'home', role: 'assistant', type: 'poll', question, options: [
  { id: 'group_pending', reply: 'group_pending', label: '⏳ PENDÊNCIAS (55)', tone: 'danger' },
  ...[['supplies', '📦 SUPRIMENTOS'], ['demands', '📋 DEMANDAS'], ['human_resources', '👥 RECURSOS HUMANOS'],
    ['construction', '🏗️ ETAPA OBRA'], ['commercial', '📈 COMERCIAL'], ['audit', '🔎 AUDITORIA E DOCUMENTOS'],
    ['nb', '🏢 NB PARTICIPAÇÕES'], ['personal_expenses', '💰 GASTOS PESSOAIS']]
    .map(([id, label]) => ({ id: 'group_' + id, reply: 'group_' + id, label })),
] };
const state = { sessionStatus: 'authenticated', account: { name: 'Pessoa de teste' }, draft: '', pendingFiles: [], activeFlow: null,
  messages: [{ ...menu, question: notice + '\n\n' + question }],
  attachments: [{ id: 'transferred', fileName: 'Documento transferido.pdf', mimeType: 'application/pdf', size: 19700, mediaUrl: '/api/portal-media/test-document' }] };
const root = document.querySelector('#app'), view = createChatView(root);
const selected = [], opened = [], reads = [];
let opening;
const report = createPaymentLedgerView({ document, data: { async loadPaymentsSnapshot() {
  reads.push('payments');
  return { launches: [{ id: '1', paymentDate: '2026-10-24', supplier: 'Fornecedor de teste', branch: 'Filial de teste', product: 'Serviço de teste',
    description: 'Dado fictício', order: '1', disbursement: 'SIM', account: 'Conta de teste', unit: 45, quantity: 1, freight: 0, total: 45 }] };
} } });
view.on('open-payment-ledger', () => { opened.push('payments'); opening = report.open(); });
const baseTaxReport=createTaxGuidesReportView({document,data:{async loadSnapshot(){reads.push('taxGuides');return {rows:[
  {id:'7',hasAttachments:false,fields:{TIPO:'INSS',FILIAL:'004 - EDIFÍCIO XAVANTE',COMPETENCIA:'2026-10-20',VENCIMENTO:'2026-11-20',VALOR:null}},
  {id:'8',hasAttachments:false,fields:{TIPO:'FGTS',FILIAL:'004 - EDIFÍCIO XAVANTE',COMPETENCIA:'2026-10-20',VENCIMENTO:'2026-11-20',VALOR:1407.4}},
]};}}});
const taxReport=decorateReportPrint(baseTaxReport,{action:'open-tax-guides-report'});
view.on('open-tax-guides-report',()=>{opened.push('taxGuides');opening=taxReport.open();});
view.on('select-reply', event => selected.push(event.replyId));
view.render({ ...state, attachments: [], messages: [menu] });
view.render({ ...state, attachments: [], activeFlow: { id: 'submenu' }, messages: [{ ...menu,
  question: 'SUPRIMENTOS: QUAL FLUXO VOCÊ DESEJA INICIAR?', options: [{ id: 'start', label: 'Iniciar' }] }] });
const submenuIcons = root.querySelectorAll('.chat-message--assistant button[data-action^="open-"]').length;
view.render(state);
await Promise.all([...document.images].map(image => image.decode().catch(() => {})));

let reportReady = false;
let taxReportReady=false,taxClosedBack=false,taxReportFits=false;
if (new URLSearchParams(location.search).has('probe')) {
  root.querySelector('[data-action="open-payment-ledger"] img')?.click();
  await opening;
  reportReady = !report.element.hidden && report.element.querySelector('.pl-table tbody')?.textContent.includes('Fornecedor de teste');
  report.close();
  const taxTrigger=root.querySelector('[data-action="open-tax-guides-report"]');taxTrigger.focus();taxTrigger.querySelector('img').click();await opening;
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  taxReportReady=!taxReport.element.hidden&&taxReport.element.querySelectorAll('tbody tr').length===2&&taxReport.element.textContent.includes('20/10/2026')&&taxReport.element.textContent.includes('20/11/2026');
  taxReportFits=document.documentElement.scrollWidth<=innerWidth+1&&taxReport.element.querySelector('.tgr-panel').scrollWidth<=taxReport.element.querySelector('.tgr-panel').clientWidth+1;
  taxReport.element.querySelector('.report-close-control').click();
  taxClosedBack=taxReport.element.hidden&&!root.hasAttribute('inert')&&document.activeElement===taxTrigger;
  view.render(state);
  await Promise.all([...document.images].map(image => image.decode().catch(() => {})));
}
const buttons = [...root.querySelectorAll('.chat-message--assistant button[data-action^="open-"]')];
const payslip = buttons.find(button => button.dataset.action === 'open-holerite-report');
document.documentElement.dataset.layout = JSON.stringify({
  submenuIcons, reportReady, taxReportReady, taxClosedBack, taxReportFits, opened, reads, selected,
  taxRhid:[...root.querySelectorAll('[data-action="open-tax-guides-report"],[data-action="open-rhid-mascot-report"]')].map(node=>{const r=node.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom};}),
  taxCommercialOverlap:[...root.querySelectorAll('.chat-main-commercial-shortcuts > button,.chat-main-provisions-shortcut')].some(node=>{const a=node.getBoundingClientRect(),b=root.querySelector('[data-action="open-tax-guides-report"]').getBoundingClientRect();return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;}),
  count: buttons.length, actions: buttons.map(button => button.dataset.action),
  payslip: payslip?.textContent.trim(),
  buttons: buttons.map(button => { const rect = button.getBoundingClientRect(); return {
    left: rect.left, right: rect.right, width: rect.width, height: rect.height,
    external: button.closest('.chat-bubble') === null,
    loaded: button.querySelector('img')?.naturalWidth > 0 || (
      button.dataset.action === 'open-pending-payroll-links' && button.textContent.includes('IDFOLHA')
    ),
  }; }),
  notice: root.querySelector('.chat-choice-card > p')?.textContent || '',
  attachment: root.querySelector('.chat-attachments')?.textContent || '',
  overflow: document.documentElement.scrollWidth > innerWidth + 1,
});
if(new URLSearchParams(location.search).has('report')){
  root.querySelector('[data-action="open-tax-guides-report"]').click();await opening;
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
}
document.documentElement.dataset.ready = 'true';
</script></body></html>
