<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia responsiva dos relatórios de RH</title>
  <style>html,body{box-sizing:border-box;width:100%;max-width:100%;margin:0;padding:0;font:15px Arial,sans-serif}body{padding:8px}</style>
</head>
<body><main id="app"></main>
<script type="module">
import "../../src/ui/rh-reports.css";
import { createRhReportsView } from "../../src/ui/rh-reports-view.js";

const report = Number(new URLSearchParams(location.search).get("report"));
const long = "FORNECEDOR-COM-NOME-MUITO-EXTENSO-SEM-ESPACOS-".repeat(7);
const now = new Date();
const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
const supplier = { id: "1", name: long, contractor: true, branch: "FILIAL-EXTENSA-SEM-ESPACOS-".repeat(5),
  property: "OBRA-A-IMOVEL-COM-TITULO-LONGO-".repeat(5), profession: "PEDREIRO", status: "ATIVO",
  paymentType: "DIÁRIA", dailyValue: 150, stage: long, activity: long };
const presence = { id: "10", supplier: supplier.name, date: today, branch: supplier.branch,
  property: supplier.property, profession: supplier.profession, presence: "PRESENTE", status: "PENDENTE PGTO",
  dailyValue: 150, activity: long, observation: long, motivation: long, paymentId: "88" };
const data = { async loadReport() { return { suppliers: [supplier], presences: [presence],
  launches: [{ id: "88", supplier: supplier.name, date: today, total: 150, advance: "NÃO" }] }; } };
const view = createRhReportsView({ document, data });
document.querySelector("#app").append(view.element);
await view.open(report);
window.reportReady = report;
</script></body></html>
