<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"></head>
<body><script type="module">
import { createCamerasView } from '/src/ui/cameras-view.js';
const accountKey = 'layout-check';
const listMode = location.search === '?list';
const wallMode = location.search === '?player';
localStorage.setItem('energetico:camera-preview:v1:' + accountKey + ':camera-1', 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAAB//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8Af//Z');
localStorage.setItem('energetico:camera-visual:v1:' + accountKey, JSON.stringify([{
  name: wallMode ? 'Visual 1' : 'Portão e pátio',
  cameraIds: wallMode ? Array.from({ length: 8 }, (_, index) => 'camera-' + (index + 1)) : ['camera-1', 'camera-2'],
}]));
createCamerasView(document).open({
  accountKey,
  list: async () => Array.from({ length: 9 }, (_, index) => ({
    id: 'camera-' + (index + 1),
    label: index === 0 ? 'Entrada' : listMode && index === 8
      ? 'Pátio ' + 'NomeLongoSemEspaços'.repeat(5) : 'Obra Xavante • canal ' + (index + 1),
    status: index === 0 ? 'offline' : 'online',
    lastOnlineAt: index === 0 ? '2026-11-24T12:00:00Z' : null,
    ...([0, 2, 6].includes(index) ? { cameraGroup: 'camera-1', cameraLabel: 'Obra Xavante' } : {}),
  })),
  start: async () => new Promise(() => {}),
  move: async () => {},
  listRecordings: async () => [],
  playRecording: async () => new Promise(() => {}),
});
await new Promise(resolve => setTimeout(resolve, 100));
if (location.search.includes('single')) {
  document.querySelector('[data-camera-open]').click();
  document.querySelector('[data-camera-recordings]').click();
} else if (location.search.includes('visuals')) {
  document.querySelector('[data-camera-tab="visuals"]').click();
} else if (location.search.includes('pair')) {
  document.querySelector('[data-camera-grid]').click();
  document.querySelectorAll('[data-camera-select]')[0].click();
  document.querySelectorAll('[data-camera-select]')[1].click();
  document.querySelector('[data-camera-open-grid]').click();
} else if (wallMode) {
  document.querySelector('[data-camera-tab="visuals"]').click();
  document.querySelector('[data-camera-visual-open]').click();
}
await new Promise(resolve => setTimeout(resolve, 100));
if (location.search.includes('single')) {
  const recording=document.createElement('button'); recording.type='button'; recording.className='cameras-player__recording';
  const preview=document.createElement('span'); preview.className='cameras-player__recording-preview'; preview.textContent='▶';
  const times=document.createElement('span'); times.className='cameras-player__recording-times';
  const start=document.createElement('strong'); start.textContent='09:49';
  const end=document.createElement('small'); end.textContent='09:54'; times.append(start,end);
  recording.append(preview,times); document.querySelector('.cameras-player__recordings').replaceChildren(recording);
  // Measure the open drawer after its CSS height transition has settled.
  await new Promise(resolve => setTimeout(resolve, 250));
}
const dialog=document.querySelector('.cameras-view'), player=document.querySelector('.cameras-player');
if (window.innerWidth === 320) {
  const savedLabel = player?.querySelector('.cameras-player__saved-label');
  if (savedLabel) savedLabel.style.fontSize = '18px';
}
const rect=node=>{const r=node.getBoundingClientRect(); return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
const cardHeadings = () => [...document.querySelectorAll('.camera-card__heading')].map(heading => {
  const title = heading.querySelector('strong');
  const text = document.createRange();
  text.selectNodeContents(title);
  const checkbox = heading.querySelector('[data-camera-select]');
  return {
    heading: rect(heading), title: rect(title), titleText: rect(text),
    pencil: rect(heading.querySelector('[data-camera-rename]')),
    checkbox: checkbox && rect(checkbox),
  };
});
const listHeadings = listMode ? cardHeadings() : [];
let selectionHeadings = [];
if (listHeadings.length) {
  document.querySelector('[data-camera-grid]').click();
  selectionHeadings = cardHeadings();
  document.querySelector('[data-camera-grid]').click();
}
const layout = {viewport:rect(dialog),
  tabs:document.querySelector('.cameras-header__tabs') && rect(document.querySelector('.cameras-header__tabs')),
  listHeadings, selectionHeadings,
  cards:[...document.querySelectorAll('.camera-card')].map(rect),
  offlineStatus:document.querySelector('[data-camera-status]') && {
    ribbon:rect(document.querySelector('[data-camera-status]')),
    lastOnline:rect(document.querySelector('.camera-card__last-online')),
    preview:rect(document.querySelector('.camera-card__preview')),
  },
  visualCards:[...document.querySelectorAll('.camera-visual-card')].map(rect),
  groups:[...document.querySelectorAll('.camera-group')].map(group => ({
    bounds:rect(group), children:[...group.querySelectorAll('.camera-card')].map(rect),
  })),
  player:player && rect(player), portrait:String(window.matchMedia('(orientation: portrait)').matches), tiles:[...document.querySelectorAll('.cameras-player__tile')].map(rect),
  savedFrames:[...document.querySelectorAll('.cameras-player__saved-frame:not([hidden])')].map(frame => {
    const tile = frame.closest('.cameras-player__tile');
    const focus = tile.querySelector('.cameras-player__focus');
    return { label:rect(tile.querySelector('.cameras-player__saved-label')), tile:rect(tile),
      focus:focus ? rect(focus) : null, imageLoaded:frame.querySelector('img').naturalWidth > 0 };
  }),
  controls:document.querySelector('.cameras-player__actions') && rect(document.querySelector('.cameras-player__actions')),
  drawer:document.querySelector('.cameras-player__drawer') && rect(document.querySelector('.cameras-player__drawer')),
  liveStateColor:player && getComputedStyle(player.querySelector('.cameras-player__live-state')).color,
  recording:document.querySelector('.cameras-player__recording') && rect(document.querySelector('.cameras-player__recording')),
  recordingTime:document.querySelector('.cameras-player__recording-times') && rect(document.querySelector('.cameras-player__recording-times'))};
if (wallMode) {
  const measurePlayer = () => ({
    stage: rect(dialog.querySelector('.cameras-player__stage')),
    videos: [...dialog.querySelectorAll('.cameras-player__tile:not([hidden]) video')].map(rect),
  });
  const video = player.querySelector('[data-camera-video="camera-1"]');
  video.click();
  video.click();
  layout.focused = measurePlayer();
  video.click();
  video.click();
  layout.restored = measurePlayer();
  video.closest('.cameras-player__tile').querySelector('.cameras-player__focus').click();
  layout.individual = measurePlayer();
}
document.documentElement.dataset.layout = JSON.stringify(layout);
</script></body></html>
