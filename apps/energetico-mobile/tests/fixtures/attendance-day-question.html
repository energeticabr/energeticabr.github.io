<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"></head>
<body><main id="app"></main><script type="module">
import { createChatView } from '/src/ui/chat-view.js';
const view=createChatView(document.querySelector('#app'));
view.render({sessionStatus:'authenticated',account:{name:'Teste'},draft:'',pendingFiles:[],activeFlow:{id:'attendance_validation',title:'👷 VALIDAR PRESENÇAS APONTADAS'},messages:[
  {id:'day',role:'assistant',type:'poll',presentation:'attendance_multi_select',question:'👉 👷 QUAL PRESENÇA DESEJA VALIDAR?\nCASO DESEJE FILTRAR, DIGITE UM TEXTO.',options:[
    {id:'choice:registro_presenca_pendente:1',label:'1 - COLABORADOR EXEMPLO',date:'2026-10-12',rhidBadge:{status:'present',label:'09h00',date:'2026-10-12',punches:{entry1:'07:00',exit1:'12:00',entry2:'13:00',exit2:'17:00'}}},
    {id:'choice:registro_presenca_pendente:2',label:'2 - COLABORADORA EXEMPLO',date:'2026-10-12',rhidBadge:{status:'absent',label:'AUSENTE',date:'2026-10-12'}},
  ]}
]});
await document.fonts.ready;
await new Promise(requestAnimationFrame);
const heading=document.querySelector('.chat-choice-card > p');
const date=heading.querySelector('strong');
const box=heading.getBoundingClientRect();
const header=document.querySelector('.chat-attendance-heading');
const author=header?.querySelector('strong')?.getBoundingClientRect();
const button=header?.querySelector('button')?.getBoundingClientRect();
const bubble=heading.closest('.chat-bubble').getBoundingClientRect();
const message=heading.closest('.chat-message').getBoundingClientRect();
const row=document.querySelector('.chat-attendance-select__row');
const record=row.querySelector('[data-action="select-reply"]').getBoundingClientRect();
const remove=row.querySelector('[data-action="open-attendance-delete"]');
const removeBox=remove.getBoundingClientRect();
const deleteColor=getComputedStyle(remove).backgroundColor;
const dateStyle={color:getComputedStyle(date).color,weight:getComputedStyle(date).fontWeight};
remove.click();
const confirmation=document.querySelector('[data-attendance-delete-dialog] [role="dialog"]').getBoundingClientRect();
document.documentElement.dataset.layout=JSON.stringify({text:heading.textContent,date:date?.textContent,...dateStyle,left:box.left,right:box.right,viewport:innerWidth,
  bubbleLeft:bubble.left,messageLeft:message.left,recordRight:record.right,deleteLeft:removeBox.left,deleteRight:removeBox.right,
  deleteWidth:removeBox.width,deleteHeight:removeBox.height,deleteColor,dialogLeft:confirmation.left,dialogRight:confirmation.right,
  hours:button&&author&&{label:header.querySelector('button').textContent,left:button.left,right:button.right,bottom:button.bottom,
    authorRight:author.right,centers:Math.abs((author.top+author.bottom-button.top-button.bottom)/2),questionTop:box.top}});
document.documentElement.dataset.ready='true';
</script></body></html>
