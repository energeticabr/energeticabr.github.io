<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegação à esquerda</title>
<link rel="stylesheet" href="../../src/ui/../styles.css">
<link rel="stylesheet" href="../../src/ui/supplier-payroll.css">
<link rel="stylesheet" href="../../src/ui/orders-gallery.css">
<link rel="stylesheet" href="../../src/ui/tasks-gallery.css">
<link rel="stylesheet" href="../../src/ui/launch-gallery.css">
<link rel="stylesheet" href="../../src/ui/registration-gallery.css">
<link rel="stylesheet" href="../../src/ui/hr-payroll-gallery.css">
<link rel="stylesheet" href="../../src/ui/contractor-reports.css">
<link rel="stylesheet" href="../../src/ui/gallery-record-actions.css">
</head><body><script type="module">
import { createLaunchGallery } from '../../src/ui/launch-gallery-view.js';
import { createOrdersGallery } from '../../src/ui/orders-gallery-view.js';
import { createTasksGallery } from '../../src/ui/tasks-gallery-view.js';
import { createPaymentProgrammingGallery } from '../../src/ui/payment-programming-gallery-view.js';
import { createRecurringExpensesGallery } from '../../src/ui/recurring-expenses-gallery-view.js';
import { createRegistrationGallery } from '../../src/ui/registration-gallery-view.js';
import { createContractorReportsView } from '../../src/ui/contractor-reports-view.js';
import { createHrPayrollGallery } from '../../src/ui/hr-payroll-gallery-view.js';
import { createHrPayrollReport } from '../../src/ui/hr-payroll-report-view.js';
import { createSupplierPayrollView } from '../../src/ui/supplier-payroll-view.js';
import { createPowerBiDashboardView } from '../../src/ui/powerbi-dashboard-view.js';
const name = new URLSearchParams(location.search).get('screen');
const tray = [new File(['a'],'comprovante-de-pagamento-'+ 'referencia'.repeat(16)+'.pdf',{type:'application/pdf'}),
  new File(['b'],'segundo-comprovante.pdf',{type:'application/pdf'})];
const options = {
 document, documentRef: document, onHome() {},
 getReceiptAttachments: () => tray.map((file,index) => ({id:String(index),fileName:file.name})),
 readReceiptAttachment: async id => tray[Number(id)],
};
const data = { loadSnapshot: async () => ({rows:[]}), loadOverview: async () => ({rows:[]}), loadDetails: async () => ({}) };
const payrollData = {
 loadSuppliers: async () => [{id:'1',label:'CLEITON CESAR NONATO',branch:'004 - EDIFÍCIO XAVANTE',profession:'SERVENTE DE PEDREIRO'}],
 loadProducts: async () => [{id:'2',label:'SERVENTE DE PEDREIRO',recommended:true}],
 loadAccounts: async () => [{id:'3',label:name === 'payroll-summary-long' ? 'PIX - CONTA DE PAGAMENTO COM DESCRIÇÃO EXTENSA PARA CONFERÊNCIA' : 'PIX'}],
 loadStages: async () => [{id:'4',label:'ALVENARIA E ESTRUTURAS'}],
 loadSheets: async () => [{id:'5',label:'10/2026'}],
};
const factories = {
 launches: () => createLaunchGallery({...options, request: async () => ({ rows:[], count:0, page:1, pages:1, totals:{}, filterOptions:{} })}),
 orders: () => createOrdersGallery({...options,data}),
 tasks: () => createTasksGallery({...options,data}),
 payments: () => createPaymentProgrammingGallery({...options,data}),
 recurring: () => createRecurringExpensesGallery({...options,data}),
 reports: () => createContractorReportsView({...options,data}),
 registration: () => createRegistrationGallery({...options,data,kind:'documents'}),
 hr: () => createHrPayrollGallery({...options,gallery:'IDFOLHA',request:async()=>({gallery:'IDFOLHA',rows:[],page:1,hasMore:false})}),
 hrreport: () => createHrPayrollReport({...options,request:async()=>[]}),
 payroll: () => createSupplierPayrollView({...options,data:payrollData}),
 'payroll-stage': () => createSupplierPayrollView({...options,data:payrollData}),
 'payroll-summary': () => createSupplierPayrollView({...options,data:payrollData}),
 'payroll-summary-long': () => createSupplierPayrollView({...options,data:payrollData}),
 powerbi: () => createPowerBiDashboardView({...options,powerBiClient:{models:{TokenType:{Aad:0}},embed:()=>({on(){},off(){}}),reset(){}}}),
};
const view = factories[name]();
await view.open(name === 'hrreport' ? {id:'1'} : name === 'powerbi' ? {accessToken:'fixture',getAccessToken:async()=>'fixture',onHome(){}} : undefined);
if(name.startsWith('payroll')) {
 document.querySelector('[name=date]').value='2026-10-03';
 document.querySelector('[name=date]').dispatchEvent(new Event('input',{bubbles:true}));
 document.querySelector('[data-payroll-next]').click();
 for(const id of ['1','2']) {
  for(let i=0;i<100 && !document.querySelector('[data-payroll-option="'+id+'"]');i++) await new Promise(r=>setTimeout(r,10));
  document.querySelector('[data-payroll-option="'+id+'"]').click();
 }
 for(let i=0;i<100 && !document.querySelector('[data-payroll-rubric]');i++) await new Promise(r=>setTimeout(r,10));
 if(name === 'payroll-stage' || name.startsWith('payroll-summary')) {
  for(const [selector,value] of [['[name=salary-value]','100'],['[name=salary-account]','3']]) {
   document.querySelector(selector).value=value;
   document.querySelector(selector).dispatchEvent(new Event('input',{bubbles:true}));
   document.querySelector(selector).dispatchEvent(new Event('change',{bubbles:true}));
  }
  if(name === 'payroll-summary-long') {
   for(const [selector,value] of [['[name=allowance-value]','10,25'],['[name=allowance-quantity]','2'],['[name=allowance-account]','3']]) {
    document.querySelector(selector).value=value;
    document.querySelector(selector).dispatchEvent(new Event('input',{bubbles:true}));
    document.querySelector(selector).dispatchEvent(new Event('change',{bubbles:true}));
   }
   document.querySelector('[data-payroll-receipts="salary"]').click();
   for(const input of document.querySelectorAll('[data-receipt-id]')) input.checked=true;
   document.querySelector('[data-receipt-confirm]').click();
   while(document.querySelector('[data-receipt-picker]')) await new Promise(r=>setTimeout(r,10));
  }
  document.querySelector('[data-payroll-next]').click();
  for(let i=0;i<100 && document.querySelector('.supplier-payroll-question')?.textContent !== 'Indique a etapa';i++) await new Promise(r=>setTimeout(r,10));
  if(name.startsWith('payroll-summary')) {
   document.querySelector('[data-payroll-option="4"]').click();
   for(let i=0;i<100 && !document.querySelector('[data-payroll-option="5"]');i++) await new Promise(r=>setTimeout(r,10));
   document.querySelector('[data-payroll-option="5"]').click();
  }
 }
}
document.documentElement.dataset.ready='true';
</script></body></html>
