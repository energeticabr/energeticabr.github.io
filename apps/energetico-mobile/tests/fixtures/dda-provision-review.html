<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vinculação DDA fictícia</title></head><body><main id="app"></main><script type="module">
import '../../src/styles.css';
import '../../src/ui/payment-ledger.css';
import '../../src/ui/dda-report.css';
import {createDdaReportView} from '../../src/ui/dda-report-view.js';
let writes=0;
const nameFallback=new URLSearchParams(location.search).has('fallback');
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const view=createDdaReportView({document,data:{
 loadSnapshot:async()=>({rows:[{id:'28',fields:{Title:'FORNECEDOR FICTÍCIO',VALOR:360,SITUACAO:'Em aberto',VENCIMENTO:'2026-11-04'}}]}),
 provisionLink:{loadOptions:async()=>[{id:'44',supplier:nameFallback?'FICTÍCIO':'FORNECEDOR FICTÍCIO',label:'#44 · FORNECEDOR FICTÍCIO',amount:720,provisions:[{id:'101',amount:nameFallback?180:360,due:'2026-11-04'},{id:'102',amount:nameFallback?540:360,due:'2026-12-04'}]}],save:async()=>{writes++;return {ddaId:'28',provisionId:'44'};}}
}});
await view.open();
document.querySelector('[data-dda-provision-pencil]').click();await frame();
const match=document.querySelector(nameFallback?'.dda-provision-name-match':'.dda-provision-line-match'),matchRect=match.getBoundingClientRect();
const pickerMatch=(nameFallback?match.textContent.includes('Nome do fornecedor semelhante ao DDA'):match.textContent.includes('Provisão #101')&&match.textContent.includes('360,00'))&&document.querySelectorAll('.dda-provision-star').length===1;
const pickerFits=matchRect.left>=-1&&matchRect.top>=-1&&matchRect.right<=innerWidth+1&&matchRect.bottom<=innerHeight+1;
document.querySelector('input[type=radio]').click();
async function review(){document.querySelector('.dda-provision-save').click();await frame();return document.querySelector('[data-edit-review]');}
let dialog=await review();
const rect=dialog.getBoundingClientRect(), buttons=[...dialog.querySelectorAll('button')];
const fits=rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1;
const hit=buttons.every(button=>{const r=button.getBoundingClientRect();return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===button;});
const transform=getComputedStyle(dialog).transform;
const dimensions={width:dialog.offsetWidth,height:dialog.offsetHeight};
const focusInside=dialog.contains(document.activeElement),writesBefore=writes;
dialog.querySelector('[data-edit-review-cancel]').click();await frame();
const cancelled=writes===0&&document.querySelector('input[type=radio]').checked&&!document.querySelector('[data-edit-review]');
dialog=await review();dialog.querySelector('[data-edit-review-submit]').click();await frame();
const confirmed=writes===1&&!view.element.hidden&&document.querySelector('.ddr-link-cluster').textContent==='ID 44';
// Leave the real confirmation open for the captured visual check.
view.close();await view.open();
document.querySelector('[data-dda-provision-pencil]').click();await frame();
document.querySelector('input[type=radio]').click();await review();
document.documentElement.dataset.layout=JSON.stringify({pickerMatch,pickerFits,fits,hit,transform,dimensions,bounds:{left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom},focusInside,writesBefore,cancelled,confirmed});
</script></body></html>
