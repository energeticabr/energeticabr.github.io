<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vinculação DDA fictícia</title></head><body><main id="app"></main><script type="module">
import '../../src/styles.css';
import '../../src/ui/payment-ledger.css';
import '../../src/ui/dda-report.css';
import {createDdaReportView} from '../../src/ui/dda-report-view.js';
let writes=0,dateWrites=0;
const duplicate=new URLSearchParams(location.search).has('duplicate');
const nameFallback=new URLSearchParams(location.search).has('fallback');
const alignDue=new URLSearchParams(location.search).has('alignDue');
const compact=new URLSearchParams(location.search).has('compact');
if(new URLSearchParams(location.search).has('wideControls')){
 const style=document.createElement('style');
 style.textContent='.dda-provision-filters select { letter-spacing: 2px; }';
 document.head.append(style);
}
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const view=createDdaReportView({document,data:{
 loadSnapshot:async()=>({rows:[{id:'28',fields:{Title:'FORNECEDOR FICTÍCIO',VALOR:360,SITUACAO:'Em aberto',VENCIMENTO:'2026-11-04'}}]}),
 provisionLink:{loadOptions:async()=>[{id:'44',supplier:nameFallback?'FICTÍCIO':'FORNECEDOR FICTÍCIO',label:'#44 · FORNECEDOR FICTÍCIO',amount:720,provisions:[{id:'101',amount:nameFallback?180:360,due:'2026-11-04'},...(alignDue?[]:[{id:'102',amount:nameFallback?540:360,due:'2026-12-04'}])]}],save:async({sharedLinkETag})=>{if(duplicate&&!sharedLinkETag)return {requiresSharedConfirmation:true,eTag:'fixture'};writes++;return {ddaId:'28',provisionId:'44'};},
  loadOrderOptions:async()=>[{id:'44',supplier:'PEDIDO FICTÍCIO',amount:360,date:'2026-11-10'}],
  saveOrder:async()=>({ddaId:'28',orderId:'44'}),
  ...(alignDue?{prepareDueAdjustment:async()=>({provisionId:'44',childId:'101',childDue:'2026-11-05',parentDue:'2026-11-05',due:'2026-11-04'}),adjustDue:async()=>{dateWrites++;}}:{}),
 }
}});
await view.open();
function pencilLayout(){
 const pencil=document.querySelector('[data-dda-provision-pencil]');
 const badge=pencil.previousElementSibling;
 return {inColumn:pencil.closest('td')?.classList.contains('ddr-link'),
  below:pencil.offsetTop>=badge.offsetTop+badge.offsetHeight,
  background:getComputedStyle(pencil).backgroundColor};
}
const beforePencil=pencilLayout();
document.querySelector('[data-dda-provision-pencil]').click();await frame();
const search=document.querySelector('.dda-provision-search'),status=document.querySelector('.dda-provision-status'),source=document.querySelector('.dda-provision-source');
function selectedLabelWidth(select){
 const sample=select.cloneNode(false);
 sample.append(select.selectedOptions[0].cloneNode(true));
 Object.assign(sample.style,{position:'absolute',visibility:'hidden',width:'max-content'});
 select.parentElement.append(sample);
 const width=sample.offsetWidth;
 sample.remove();
 return width;
}
const searchFits=compact?search.offsetTop+search.offsetHeight<=source.offsetTop
 :search.offsetTop===status.offsetTop&&search.offsetLeft+search.offsetWidth<=source.offsetLeft;
const filterWidths={search:search.offsetWidth,source:source.offsetWidth,sourceLabel:selectedLabelWidth(source),
 status:status.offsetWidth,statusLabel:selectedLabelWidth(status),available:status.offsetParent.clientWidth};
const pickerFiltersFit=Boolean(source&&searchFits&&source.offsetTop===status.offsetTop
 &&source.offsetLeft+source.offsetWidth<=status.offsetLeft
 &&status.offsetLeft+status.offsetWidth<=status.offsetParent.clientWidth+1
 &&filterWidths.source+1>=filterWidths.sourceLabel&&filterWidths.status+1>=filterWidths.statusLabel);
source.value='order';source.dispatchEvent(new Event('change'));await frame();
const orderFiltersFit=source.value==='order'&&status.getClientRects().length===0
 &&source.offsetLeft+source.offsetWidth<=source.offsetParent.clientWidth+1
 &&document.querySelector('.dda-provision-options').textContent.includes('PEDIDO FICTÍCIO');
source.value='provision';source.dispatchEvent(new Event('change'));await frame();
const match=document.querySelector(nameFallback?'.dda-provision-name-match':'.dda-provision-line-match');
const pickerList=document.querySelector('.dda-provision-options');
if(compact){match.scrollIntoView({block:'nearest'});await frame();}
const matchRect=match.getBoundingClientRect(),listRect=pickerList.getBoundingClientRect();
const pickerMatch=(nameFallback?match.textContent.includes('Nome do fornecedor semelhante ao DDA'):match.textContent.includes('Provisão #101')&&match.textContent.includes('360,00'))&&document.querySelectorAll('.dda-provision-star').length===1;
const pickerFits=matchRect.left>=-1&&matchRect.top>=-1&&matchRect.right<=innerWidth+1&&matchRect.bottom<=innerHeight+1
 &&(!compact||(matchRect.top>=listRect.top-1&&matchRect.bottom<=listRect.bottom+1));
const pickerOverflows=pickerList.scrollWidth>pickerList.clientWidth+1;
const pickerGeometry=compact?Object.fromEntries([
 ['dialog',document.querySelector('.dda-provision-dialog')],['search',search],['list',pickerList],
 ['match',match],['header',match.closest('section').querySelector('header')],
].map(([key,element])=>[key,element.getBoundingClientRect().toJSON()])):null;
const chipColors=[...pickerList.querySelectorAll('.report-link-comparison')].map(chip=>{
 const css=getComputedStyle(chip);
 return [css.backgroundColor,css.borderTopColor];
});
document.querySelector('input[type=radio]').click();
let pickerSubmitReachable=true;
async function review(){
 const button=document.querySelector('.dda-provision-save');
 if(compact){
  button.scrollIntoView({block:'nearest'});
  await frame();
  const {x,y,width,height}=button.getBoundingClientRect();
  pickerSubmitReachable&&=document.elementFromPoint(x+width/2,y+height/2)===button;
 }
 button.click();
 await frame();
 return document.querySelector('[data-edit-review]');
}
let dialog=await review();
const rect=dialog.getBoundingClientRect(), buttons=[...dialog.querySelectorAll('button')];
const fits=rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1;
const hit=buttons.every(button=>{const r=button.getBoundingClientRect();return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===button;});
const transform=getComputedStyle(dialog).transform;
const dimensions={width:dialog.offsetWidth,height:dialog.offsetHeight};
const focusInside=dialog.contains(document.activeElement),writesBefore=writes;
dialog.querySelector('[data-edit-review-cancel]').click();await frame();
const cancelled=writes===0&&document.querySelector('input[type=radio]').checked&&!document.querySelector('[data-edit-review]');
dialog=await review();dialog.querySelector('[data-edit-review-submit]').click();await frame();
let duplicateFits,duplicateNo,duplicateTransform;
let dueReview;
if(duplicate){
 const popup=document.querySelector('[data-edit-review]');
 const box=popup.getBoundingClientRect();
 duplicateFits=box.left>=-1&&box.top>=-1&&box.right<=innerWidth+1&&box.bottom<=innerHeight+1;
 duplicateTransform=getComputedStyle(popup).transform;
 popup.querySelector('[data-edit-review-cancel]').click();await frame();
 duplicateNo=writes===0&&!document.querySelector('[data-edit-review]')&&document.querySelector('input[type=radio]').checked;
 dialog=await review();dialog.querySelector('[data-edit-review-submit]').click();await frame();
 document.querySelector('[data-edit-review-submit]').click();await frame();
}
if(alignDue){
 const popup=document.querySelector('[data-edit-review]'),box=popup.getBoundingClientRect();
 const choices=[...popup.querySelectorAll('button')];
 dueReview={title:popup.querySelector('h2').textContent,labels:choices.map(button=>button.textContent),
  fits:box.left>=-1&&box.top>=-1&&box.right<=innerWidth+1&&box.bottom<=innerHeight+1,
  hit:choices.every(button=>{const r=button.getBoundingClientRect();return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===button;}),
  before:{writes,dateWrites}};
 popup.querySelector('[data-edit-review-confirm]').click();await frame();
 dueReview.after={writes,dateWrites};
}
const afterPencil=pencilLayout();
const confirmed=writes===1&&!view.element.hidden&&!document.querySelector('.dda-provision-dialog')
 &&document.querySelector('.ddr-link-cluster').textContent==='ID 44'
 &&document.activeElement===document.querySelector('[data-dda-provision-pencil]');
// Leave the real confirmation open for the captured visual check.
view.close();await view.open();
document.querySelector('[data-dda-provision-pencil]').click();await frame();
document.querySelector('input[type=radio]').click();
const capturedReview=await review();
if(duplicate){capturedReview.querySelector('[data-edit-review-submit]').click();await frame();}
document.documentElement.dataset.layout=JSON.stringify({pickerMatch,pickerFits,pickerOverflows,pickerFiltersFit,orderFiltersFit,pickerSubmitReachable,filterWidths,pickerGeometry,chipColors,fits,hit,transform,dimensions,bounds:{left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom},focusInside,writesBefore,cancelled,confirmed,beforePencil,afterPencil,duplicateFits,duplicateNo,duplicateTransform,dueReview});
</script></body></html>
