await view.open(); view.element.querySelector('.gantt-toggle').click();

const completed=[...root.querySelectorAll('.gantt-cluster--description[data-tone="finished"]')].map(card=>({color:getComputedStyle(card).backgroundColor,button:!!card.closest('.gantt-row').querySelector('.gantt-finish-button')}));
const rows=[...root.querySelectorAll('.gantt-row--stage,.gantt-row--activity')].filter(row=>row.querySelector('.gantt-finish-button')).map(row=>{
 const name=row.querySelector('.gantt-name'),card=row.querySelector('.gantt-cluster--description'),button=row.querySelector('.gantt-finish-button');
 const portrait=root.dataset.reportPortrait==='true';
 const nr=name.getBoundingClientRect(),cr=card.getBoundingClientRect(),br=button.getBoundingClientRect();
 return {
  below:portrait?br.right<=nr.left:br.top>=nr.bottom,
  inside:card.contains(button)&&br.left>cr.left&&br.right<cr.right&&br.top>cr.top&&br.bottom<cr.bottom,

 };

document.documentElement.dataset.layout=JSON.stringify({rows,completed,date:form.querySelector('input').value,visible:rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1,formFits:form.scrollWidth<=form.clientWidth+1});
