  ...(includeScrollRows?Array.from({length:18},(_,index)=>({id:String(200+index),branch,stage:`Etapa ${index+1}`,type:'ATIVIDADE COMUM',status:'FINALIZADO'})):[]),
 ],activities:[

 ]};},

 async finalizeActivity(id,date,{expectedActivity}){return {...expectedActivity,id,plannedDate:date,status:'ATIVIDADE FINALIZADA'};},
 async finalizeStage(){throw new Error('fixture does not write');},
 async startStage(){throw new Error('fixture does not write');},
 async setStageVisibility(){throw new Error('fixture does not write');},
}});
await view.open(); view.element.querySelector('.gantt-toggle').click();
await document.fonts.ready;
const root=view.element;
const completed=[...root.querySelectorAll('.gantt-cluster--description[data-tone="finished"]')].map(card=>({color:getComputedStyle(card).backgroundColor,button:!!card.closest('.gantt-row').querySelector('.gantt-finish-button')}));
const rows=[...root.querySelectorAll('.gantt-row--stage,.gantt-row--activity')].filter(row=>row.querySelector('.gantt-finish-button')).map(row=>{
 const name=row.querySelector('.gantt-name'),card=row.querySelector('.gantt-cluster--description'),button=row.querySelector('.gantt-finish-button');
 const portrait=root.dataset.reportPortrait==='true';
 const nr=name.getBoundingClientRect(),cr=card.getBoundingClientRect(),br=button.getBoundingClientRect();
 return {
  below:portrait?br.right<=nr.left:br.top>=nr.bottom,
  inside:card.contains(button)&&br.left>cr.left&&br.right<cr.right&&br.top>cr.top&&br.bottom<cr.bottom,
  touch:button.offsetHeight>=44&&button.offsetWidth>=44,
  cardColor:getComputedStyle(card).backgroundColor,disabled:button.disabled,
 };
});

await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const form=root.querySelector('.gantt-finish-form'),rect=form.getBoundingClientRect();
const finishDialog={date:form.querySelector('input').value,visible:rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1,formFits:form.scrollWidth<=form.clientWidth+1};

const cardRect=start.closest('.gantt-cluster--description').getBoundingClientRect();
const portrait=root.dataset.reportPortrait==='true';
const insideCard=rect=>rect.left>=cardRect.left&&rect.right<=cardRect.right&&rect.top>=cardRect.top&&rect.bottom<=cardRect.bottom;
const startFits=insideCard(startRect)&&insideCard(finishRect);

  nextToStart:portrait ? suppressRect.bottom<startRect.top&&suppressRect.right===startRect.right
    : suppressRect.right<startRect.left&&suppressRect.top===startRect.top,
  inside:insideCard(suppressRect),
  touch:suppress.offsetWidth>=44&&suppress.offsetHeight>=44,
  filterFits:filterRect.left>=-1&&filterRect.top>=-1&&filterRect.right<=innerWidth+1&&filterRect.bottom<=innerHeight+1,
  filterOptions:[...filter.options].map(option=>option.textContent),
};

const cancelConfirmation=confirmation.querySelector('.gantt-finish-cancel');
const confirmationLayout={
  fits:confirmationRect.left>=-1&&confirmationRect.top>=-1&&confirmationRect.right<=innerWidth+1&&confirmationRect.bottom<=innerHeight+1,
  touch:[...confirmation.querySelectorAll('button')].every(button=>button.offsetWidth>=44&&button.offsetHeight>=44),
  focus:document.activeElement===cancelConfirmation,
};
cancelConfirmation.click();
const colors={

  finish:getComputedStyle(root.querySelector('.gantt-finish-button:enabled')).backgroundColor,
  disabled:getComputedStyle(start.nextElementSibling).backgroundColor,
};
suppress.setAttribute('aria-disabled','true');
colors.suppressDisabled=getComputedStyle(suppress).backgroundColor;
suppress.removeAttribute('aria-disabled');
start.click();
const startFormRect=form.getBoundingClientRect();
const startDialog={startFits,touch:start.offsetWidth>=44&&start.offsetHeight>=44,date:form.querySelector('input').value,
 visible:startFormRect.left>=-1&&startFormRect.top>=-1&&startFormRect.right<=innerWidth+1&&startFormRect.bottom<=innerHeight+1};
root.querySelector('.gantt-finish-cancel').click();
filter.value='NÃO EXIBIR';
filter.dispatchEvent(new Event('change'));
colors.restore=getComputedStyle(root.querySelector('.gantt-visibility-button')).backgroundColor;

view.close();

root.querySelector('.gantt-toggle').click();

const activityFinish=root.querySelector('.gantt-row--activity .gantt-finish-button');

scroll.scrollLeft=180;
const scrollPosition=()=>({top:scroll.scrollTop,left:scroll.scrollLeft});
const before=scrollPosition();
activityFinish.click();
await new Promise(resolve=>setTimeout(resolve,0));
form.querySelector('[type=submit]').click();
await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const submission={before,after:scrollPosition(),expanded:root.querySelector('.gantt-toggle').getAttribute('aria-expanded'),
  notice:root.querySelector('.gantt-notice').textContent,focused:document.activeElement===scroll};
document.documentElement.dataset.layout=JSON.stringify({rows,completed,...finishDialog,startDialog,visibility,confirmationLayout,colors,submission});
</script></body></html>
