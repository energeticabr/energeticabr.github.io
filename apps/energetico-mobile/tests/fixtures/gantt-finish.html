import { createStageGanttView } from '../../src/ui/stage-gantt-view.js';
const branch='004 - EDIFÍCIO XAVANTE';
const view=createStageGanttView({document,now:()=>new Date(2026,10,18),data:{
 async loadSnapshot(){return {complete:true,launches:[
  {id:'7',branch,stage:'ALVENARIA E ESTRUTURAS',type:'ATIVIDADE COMUM',status:'INICIADO',startDate:'2026-08-10',endDate:''},
 ],activities:[
  {id:'129',branch,stage:'ALVENARIA E ESTRUTURAS',activity:'ESCORAMENTO E ARMAÇÃO FERRAGEM SEGUNDA LAJE',property:'',supplier:'JOÃO',status:'ATIVIDADE INICIADA',executionDate:'2026-10-25',plannedDate:''},
 ]};},
 async loadAssignments(){return {complete:true,rows:[{id:'1',date:'2026-11-17',supplier:'JOÃO',profession:'ARMADOR'}]};},
 async finalizeActivity(){throw new Error('fixture does not write');}, async finalizeStage(){throw new Error('fixture does not write');},

await view.open(); view.element.querySelector('.gantt-toggle').click();

 const name=row.querySelector('.gantt-name'),button=row.querySelector('.gantt-finish-button');
 const portrait=root.dataset.reportPortrait==='true';
 const nr=name.getBoundingClientRect(),br=button.getBoundingClientRect();
 return {below:portrait?br.right<=nr.left:br.top>=nr.bottom,touch:button.offsetHeight>=44,fits:button.offsetWidth<=button.parentElement.clientWidth,color:getComputedStyle(button).backgroundColor,disabled:button.disabled};

await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const form=root.querySelector('.gantt-finish-form'),rect=form.getBoundingClientRect();
document.documentElement.dataset.layout=JSON.stringify({rows,date:form.querySelector('input').value,visible:rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1,formFits:form.scrollWidth<=form.clientWidth+1});
</script></body></html>
