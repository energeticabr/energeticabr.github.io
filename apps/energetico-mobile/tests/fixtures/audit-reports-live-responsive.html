<!doctype html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; width: 100%; } body { font-family: Arial, sans-serif; } main { width: 100%; min-width: 0; }</style>
</head>
<body>
  <main></main>
  <script type="module">
    import "../../src/ui/audit-reports-live.css";
    import { createAuditReportsView } from "../../src/ui/audit-reports-live-view.js";
    const long = "FILIAL DE OBRAS E DOCUMENTAÇÃO COM IDENTIFICADOR-SEM-ESPAÇOS-QUE-PRECISA-QUEBRAR-EM-LINHAS-SEM-CORTE-EM-TELEFONE-HORIZONTAL";
    const number = Number(new URLSearchParams(location.search).get("report"));
    const data = { async loadReport(report) {
      if (report === 11) return { quotes: [{ id: "9", branch: long, stage: long, description: long, status: "ATIVA" }], budgets: [{ id: "10", quotationId: "9", branch: long, stage: long, supplier: long, observation: long, status: "PENDENTE SOLICITAÇÃO", total: 1234.5 }] };
      if (report === 12) return { rows: [{ id: "1", assetNumber: long, branch: long, asset: long, group: long, depreciationDate: "2026-10-02", estimated: 1234.5, quantity: 2, residual: 500, percent: 10 }] };
      return { rows: [{ id: "3", documentType: long, branch: long, person: long, stage: long, property: long, homologation: long, status: "PENDENTE", validityDate: "2026-10-05" }] };
    } };
    const view = createAuditReportsView({ document, data });
    document.querySelector("main").append(view.element);
    await view.open(number);
    document.documentElement.dataset.ready = "true";
  </script>
</body>
</html>
