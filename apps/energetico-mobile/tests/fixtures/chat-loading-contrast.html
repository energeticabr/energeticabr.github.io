<!doctype html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../src/styles.css"></head>
<body><div class="chat-progress"><span class="app-loading app-loading--compact" role="status">
  <span class="app-loading__spinner"></span><span class="app-loading__text">Processando sua resposta...</span>
</span></div><script>
  const rgb = value => [...value.matchAll(/[\d.]+/g)].map(match => Number(match[0]));
  const luminance = channels => channels.slice(0, 3).map(channel => {
    const normalized = channel / 255;
    return normalized <= 0.04045 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
  }).reduce((sum, channel, index) => sum + channel * [0.2126, 0.7152, 0.0722][index], 0);
  const background = rgb(getComputedStyle(document.body).backgroundColor);
  const progress = document.querySelector('.chat-progress');
  const backdropStyle = getComputedStyle(progress);
  const backdrop = rgb(backdropStyle.backgroundColor);
  const [red, green, blue, backdropAlpha = 1] = backdrop;
  const dimmedBackground = background.map((channel, index) =>
    backdropAlpha * backdrop[index] + (1 - backdropAlpha) * channel);
  const viewport = progress.getBoundingClientRect();
  const card = progress.querySelector('.app-loading');
  const bounds = card.getBoundingClientRect();
  const style = getComputedStyle(card);
  const cardColor = rgb(style.backgroundColor);
  const alpha = cardColor[3] ?? 1;
  const visibleCard = cardColor.slice(0, 3).map((channel, index) => alpha * channel + (1 - alpha) * dimmedBackground[index]);
  const a = luminance(visibleCard), b = luminance(dimmedBackground);
  document.documentElement.dataset.layout = JSON.stringify({
    backdropTranslucentBlack: red === 0 && green === 0 && blue === 0 && backdropAlpha > 0 && backdropAlpha < 1,
    backdropCoversViewport: viewport.top === 0 && viewport.left === 0 && viewport.right === innerWidth && viewport.bottom === innerHeight,
    backdropAllowsPointerEvents: backdropStyle.pointerEvents === 'none',
    cardCentered: Math.abs((bounds.left + bounds.right) / 2 - innerWidth / 2) < 1
      && Math.abs((bounds.top + bounds.bottom) / 2 - innerHeight / 2) < 1,
    contrast: (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05),
    borderWidth: parseFloat(style.borderTopWidth),
    cardVisible: bounds.width > 0,
  });
</script></body></html>
