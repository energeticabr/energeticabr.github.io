<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamentos — rolagem contínua</title></head><body><main id="app"></main>
<script type="module">
import '../../src/styles.css';
import '../../src/ui/payment-ledger.css';
import '../../src/ui/searchable-filter-selects.css';
import '../../src/ui/report-print.css';
import {createPaymentLedgerView} from '../../src/ui/payment-ledger-view.js';
import {decorateReportNavigation} from '../../src/ui/report-navigation.js';
import {decorateReportPrint,captureFilteredReport} from '../../src/ui/report-print.js';
async function checkAttachments(){
  const {createAttachmentPreview}=await import('../../src/web/attachment-preview.js');
  const {PDFDocument}=await import('pdf-lib');
  await import('../../src/web/attachment-preview.css');
  const pdf=await PDFDocument.create();
  pdf.addPage([595,842]).drawText('Comprovante fictício', {x:42,y:760,size:30});
  const blob=new Blob([await pdf.save()],{type:'application/pdf'});
  const preview=createAttachmentPreview({canEmbedPdf:()=>false,exportMedia(){}});
  const orderPdf='20261119-181055_COMPROVANTE_DE_PAGAMENTO_SICOOB_2026_19_11_14_33_33_PIX.pdf';
  const base={paymentDate:'2026-10-02',supplier:'Alfa',branch:'Xavante',product:'SERVIÇO',account:'CAIXA',unit:1,quantity:1,freight:0,total:1};
  const view=decorateReportNavigation(createPaymentLedgerView({openMediaCollection:(items,options)=>preview.openCollection(items,{...options,onAddToTray(){}}),data:{
    async loadPaymentsSnapshot(){return {launches:[
      {...base,id:'3851',order:'569',hasAttachments:true},
      {...base,id:'3875',order:'578',hasAttachments:false},
      {...base,id:'1234567',order:'1234567',hasAttachments:true},
    ]};},
    async listPaymentLedgerPdfs(kind,id){
      if(id==='578')return [];
      const names=id==='569'?[orderPdf]:[`${kind}-${id}.pdf`, `${kind}-aditivo.pdf`];
      return names.map(fileName=>({fileName,source:async()=>blob}));
    },
  }}),{action:'open-payment-ledger'});
  await view.open();
  const root=view.element;
  async function waitFor(callback){
    for(let i=0;i<120;i++){
      const result=callback();
      if(result)return result;
      await new Promise(resolve=>setTimeout(resolve,40));
    }
    throw Error('O elemento esperado não apareceu no visualizador.');
  }
  const order=await waitFor(()=>root.querySelector('td[data-column=order] .pl-pdf-attachment'));
  const launch=await waitFor(()=>root.querySelector('td[data-column=id] .pl-pdf-attachment'));
  const otherOrder=await waitFor(()=>root.querySelector('[aria-label="Abrir PDFs do pedido 1234567"]'));
  const otherLaunch=await waitFor(()=>root.querySelector('[aria-label="Abrir PDFs do lançamento 1234567"]'));
  const geometry=control=>{
    const r=control.getBoundingClientRect(),c=control.closest('td').getBoundingClientRect();
    const n=control.previousElementSibling;
    const hit=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
    return {label:n.textContent,right:control.offsetLeft>=n.offsetLeft+n.offsetWidth-1,
      fits:r.x>=c.x-1&&r.right<=c.right+1&&r.y>=c.y-1&&r.bottom<=c.bottom+1,
      icon:control.querySelector('svg').getBoundingClientRect().width>=10,clickable:control.contains(hit)};
  };
  const controls=[order,launch,otherOrder,otherLaunch];
  const result={controls:controls.map(geometry),count:root.querySelectorAll('.pl-pdf-attachment').length,
    iconColors:controls.map(control=>getComputedStyle(control.querySelector('svg rect')).fill)};
  const dialog=document.querySelector('.attachment-preview-dialog');
  const title=dialog.querySelector('.attachment-preview-title'),close=dialog.querySelector('.attachment-preview-close');
  const next=dialog.querySelector('.attachment-preview-collection-next'),previous=dialog.querySelector('.attachment-preview-collection-previous');
  const nav=next.parentElement,back=dialog.querySelector('.attachment-preview-back');
  const visiblePdf=name=>waitFor(()=>dialog.open&&title.textContent===name&&dialog.querySelector('.attachment-preview-content canvas')
    &&dialog.querySelector('.attachment-preview-status').textContent.includes('100%'));
  function measure(){
    const viewport=dialog.querySelector('.attachment-preview-pdf-viewport'),bounds=dialog.getBoundingClientRect();
    const footer=dialog.querySelector('.attachment-preview-footer');
    viewport.scrollTop=viewport.scrollHeight;
    return {
      fits:bounds.left>=-1&&bounds.top>=-1&&bounds.right<=innerWidth+1&&bounds.bottom<=innerHeight+1,
      horizontal:dialog.offsetWidth>dialog.offsetHeight&&(innerHeight>innerWidth?bounds.height>bounds.width:bounds.width>bounds.height),
      leftClose:close.textContent==='×'&&close.offsetLeft<title.offsetLeft&&getComputedStyle(close).color==='rgb(176, 0, 0)',
      compactFooter:footer.offsetHeight<=56&&footer.scrollWidth<=footer.clientWidth+1,
      visiblePdf:viewport.clientHeight/dialog.clientHeight,
      scrollable:viewport.scrollTop>0,
      actions:['add-to-tray','export'].every(action=>{
        const button=footer.querySelector(`[data-preview-action="${action}"]`);
        return button.offsetWidth>0&&!button.disabled;
      }),
    };
  }
  order.click();await visiblePdf(orderPdf);
  result.orderPdf=measure();
  result.singleNavHidden=nav.hidden&&back.hidden;
  result.longTitle=title.offsetHeight<=24&&title.title===orderPdf;
  close.click();result.orderFocus=!dialog.open&&!root.hidden&&document.activeElement===order;
  launch.click();await visiblePdf('launch-3851.pdf');
  result.launchPdf=measure();
  result.firstLaunchPdf=!nav.hidden&&previous.disabled&&!next.disabled;
  next.click();await visiblePdf('launch-aditivo.pdf');
  result.secondLaunchPdf=!previous.disabled&&next.disabled;
  previous.click();await visiblePdf('launch-3851.pdf');
  close.click();result.launchFocus=!dialog.open&&!root.hidden&&document.activeElement===launch;
  return result;
}
try {
  if(new URLSearchParams(location.search).has('attachments')){
    document.documentElement.dataset.layout=JSON.stringify(await checkAttachments());
  }else{
  const launches=Array.from({length:451},(_,i)=>({id:String(i+1),paymentDate:'2026-10-02',supplier:i<250?'Alfa':'Beta',branch:'004 - EDIFÍCIO XAVANTE',product:'SERVENTE DE PEDREIRO',order:String(350+i),disbursement:'SIM',account:'CAIXA',description:'Descrição do pagamento',unit:1,quantity:1,freight:0,total:1}));
  let printed,finishPrint;const printDone=new Promise(resolve=>finishPrint=resolve);
  const view=decorateReportPrint(decorateReportNavigation(createPaymentLedgerView({data:{async loadPaymentsSnapshot(){return {launches};}}}),{action:'open-payment-ledger'}),{
    action:'open-payment-ledger',loadLogo:async()=>undefined,
    buildPdf:async snapshot=>{printed=snapshot;return new Blob(['%PDF-test'],{type:'application/pdf'});},
    previewMedia:async pending=>{await pending;finishPrint();},
  });
  await view.open();const root=view.element,scroll=root.querySelector('.pl-table-scroll'),logo=root.querySelector('img.pl-logo');await logo.decode();
  const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  await frame();
  const counts=[root.querySelectorAll('tbody tr').length];
  scroll.scrollTop=70;await frame();root.querySelector('[data-action=print-report-pdf]').click();await printDone;await frame();
  if(new URLSearchParams(location.search).has('header')){
    scroll.scrollTop=70;await frame();
    const header=[...root.querySelectorAll('.pl-table thead th')].find(cell=>cell.textContent==='FORNECEDOR');
    const rect=header.getBoundingClientRect(),style=getComputedStyle(header),scrollRect=scroll.getBoundingClientRect();
    document.documentElement.dataset.layout=JSON.stringify({header:{top:rect.top,left:rect.left,width:rect.width,height:rect.height,scrollTop:scrollRect.top,background:style.backgroundColor,borderTop:style.borderTopWidth,borderCollapse:getComputedStyle(root.querySelector('.pl-table')).borderCollapse,covered:document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2)===header}});
  }else{
  const printer={rows:printed.pages[0].blocks.find(block=>block.type==='table').rows.length,visible:root.querySelectorAll('tbody tr').length,top:scroll.scrollTop};
  const first=root.querySelector('tbody tr');
  for(let i=0;i<3;i++){scroll.scrollTop=scroll.scrollHeight;await frame();counts.push(root.querySelectorAll('tbody tr').length);}
  const anchored=root.querySelector('tbody tr')===first;
  const select=root.querySelector('[name=supplier]');select.value='Beta';select.dispatchEvent(new Event('change'));await frame();
  const filteredInitial=root.querySelectorAll('tbody tr').length,filterScroll=scroll.scrollTop;
  scroll.scrollTop=scroll.scrollHeight;await frame();const filteredEnd=root.querySelectorAll('tbody tr').length;
  const beforePrint=scroll.scrollTop,restore=await view.preparePrint?.();const captured=captureFilteredReport(root);restore?.();
  document.documentElement.dataset.layout=JSON.stringify({counts,anchored,printer,filteredInitial,filteredEnd,filterScroll,printRows:captured.pages[0].blocks.find(block=>block.type==='table').rows.length,restoredScroll:scroll.scrollTop===beforePrint,
    ids:[...root.querySelectorAll('[data-column=id]')].map(node=>node.textContent),pager:Boolean(root.querySelector('.pl-pager')),logoBackground:getComputedStyle(logo.parentElement).backgroundColor,logoLoaded:logo.naturalWidth>0,
    overflow:scroll.scrollWidth-scroll.clientWidth,documentOverflow:document.documentElement.scrollWidth-innerWidth,tableHeight:scroll.clientHeight});
  }
  }
}catch(error){document.documentElement.dataset.layout=JSON.stringify({error:String(error.stack||error)});}
</script></body></html>
