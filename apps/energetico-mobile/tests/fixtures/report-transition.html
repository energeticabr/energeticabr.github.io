<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/payment-ledger.css"><link rel="stylesheet" href="/src/ui/provision-report.css"><link rel="stylesheet" href="/src/ui/cargos.css"><link rel="stylesheet" href="/src/ui/attendance-summary.css"><link rel="stylesheet" href="/src/ui/searchable-filter-selects.css"></head>
<body><main id="app"><button>HOME de teste</button></main><script>
addEventListener('error',event=>document.documentElement.dataset.layout=JSON.stringify({error:event.message}));
addEventListener('unhandledrejection',event=>document.documentElement.dataset.layout=JSON.stringify({error:String(event.reason)}));
window.transitionStage='imports';
setTimeout(()=>{if(!document.documentElement.dataset.layout)document.documentElement.dataset.layout=JSON.stringify({error:'Timed out: '+window.transitionStage});},15000);
</script><script type="module">
import {createAppController} from '/src/app-controller.js';
import {createConversationStore} from '/src/chat/conversation-store.js';
import {createPaymentLedgerView} from '/src/ui/payment-ledger-view.js';
import {createProvisionReportView} from '/src/ui/provision-report-view.js';
import {createCargosView} from '/src/ui/cargos-view.js';
import {createAttendanceSummaryReportView} from '/src/ui/attendance-summary-view.js';
import {retainReportPresentation} from '/src/ui/report-navigation.js';
try {
 if(new URLSearchParams(location.search).has('pending')){
  const source=document.createElement('div');source.className='chat-confirmation-backdrop';
  source.dataset.pendingProvisionsDialog='';
  source.innerHTML='<div class="chat-confirmation chat-pending-provisions chat-pending-provisions--payments" role="dialog"><button aria-label="Fechar">X</button><div class="chat-pending-provisions__list">'+Array.from({length:30},(_,i)=>`<p>Provisão ${i+1}</p>`).join('')+'</div></div>';
  document.body.append(source);
  const backdrop=getComputedStyle(source).backgroundColor;
  const rect=source.firstElementChild.getBoundingClientRect(),release=retainReportPresentation(source);
  source.remove();await new Promise(requestAnimationFrame);
  const layer=document.querySelector('[data-report-transition]'),surface=layer.querySelector('[role=dialog]'),after=surface.getBoundingClientRect();
  const sameBounds=['left','top','width','height'].every(key=>Math.abs(rect[key]-after[key])<1);
  const indicator=surface.querySelector('.app-loading');
  const result={backdrop,retainedBackdrop:getComputedStyle(layer.firstElementChild).backgroundColor,sameBounds,blank:!surface.textContent.includes('Provisão'),loading:!!indicator,percentage:indicator.querySelector('[role=progressbar]').textContent,background:getComputedStyle(surface).backgroundColor};
  release();document.documentElement.dataset.layout=JSON.stringify(result);
 }else{
 window.transitionStage='controller';
 const cargos=new URLSearchParams(location.search).has('cargos'),scrollSelector=cargos?'.cargos-scroll':'.pl-table-scroll';
 const handlers=new Map(),panels=[];
 const view={render(){},on(type,fn){handlers.set(type,fn);return()=>handlers.delete(type);},focusComposer(){}};
 const account={homeAccountId:'transition-test',name:'Teste'};
 const gate=Promise.withResolvers();
 const data={loadPaymentsSnapshot:async()=>({launches:Array.from({length:50},(_,i)=>({id:String(i+1),supplier:`Fornecedor ${i+1}`,branch:'004 - EDIFÍCIO XAVANTE',paymentDate:'2026-11-17',product:'MATERIAL',order:String(i+1),unit:200,quantity:1,freight:0,total:200}))}),
  async loadProvisionReportSnapshot(){await gate.promise;return {provisions:[{id:'7',supplier:'Destino pronto',branch:'004 - EDIFÍCIO XAVANTE',product:'LOCAÇÃO',dueDate:'2026-11-18',status:'PAGAMENTO PREVISTO',total:200}],recurrences:[]};}};
 const controller=createAppController({store:createConversationStore(),view,
  auth:{initialize:async()=>account,getToken:async()=> 'test',signOut:async()=>{}},
  client:{getPendingProvisionSnapshot:async()=>({rows:[]}),sendText:async()=>({status:'processed',messages:[]})},
  native:{importSharedItems:async()=>[]},pendingProvisionAttachmentsDataFactory:async()=>({loadUpcomingPayments:async()=>[]}),
  paymentLedgerDataFactory:async()=>data,
  cargosDataFactory:async()=>({loadSnapshot:async()=>({rows:Array.from({length:50},(_,i)=>({cargo:`Cargo ${i+1}`,salary:100,food:20,bonus:0,transport:10,total:130}))})}),
  attendanceSummaryDataFactory:async()=>({async loadSnapshot(){await gate.promise;return {suppliers:[],presences:[]};}}),
  cargosFactory:options=>{const panel=createCargosView({...options,document});panels.push(panel);return panel;},
  attendanceSummaryFactory:options=>{const panel=createAttendanceSummaryReportView({...options,document});panels.push(panel);return panel;},
  paymentLedgerFactory:options=>{const panel=createPaymentLedgerView({...options,document});panels.push(panel);return panel;},
  provisionReportFactory:options=>{const panel=createProvisionReportView({...options,document});panels.push(panel);return panel;},
 });
 window.transitionStage='start';await controller.start();window.transitionStage='payments';await handlers.get(cargos?'open-cargos-table':'open-payment-ledger')({});
 const source=panels[0].element.closest('.report-landscape-viewport'),scroll=source.querySelector(scrollSelector);
 scroll.scrollTop=180;
 const expectedScroll=scroll.scrollTop,rect=source.querySelector('[role="dialog"]').getBoundingClientRect();
 const opening=handlers.get('navigate-mascot-report')({from:cargos?'open-cargos-table':'open-payment-ledger',direction:cargos?'next':'previous'});
 window.transitionStage='frames';
 if(new URLSearchParams(location.search).has('rapid')){
  for(let i=0;i<8;i++) await new Promise(requestAnimationFrame);
  const destination=panels[1].element;
  const arrow=destination.querySelector('[data-report-direction=next]');
  const before={covered:!!document.querySelector('[data-report-transition]'),visible:!destination.hidden,disabled:arrow.disabled};
  arrow.click();
  for(let i=0;i<8;i++) await new Promise(requestAnimationFrame);
  const returned=panels.length>=3 && !panels.at(-1).element.hidden;
  gate.resolve();await opening;
  document.documentElement.dataset.layout=JSON.stringify({before,returned});
 } else {
 const frames=[];
 for(let i=0;i<4;i++){
  await new Promise(requestAnimationFrame);
  const layer=document.querySelector('[data-report-transition]'),copy=layer?.firstElementChild;
  const indicator=layer?.querySelector('.app-loading'),badge=indicator?.querySelector('[role="progressbar"]');
  const loadingRect=indicator?.getBoundingClientRect(),surface=layer?.querySelector('[role="dialog"]');
  frames.push({retained:!!layer,sourceVisible:!source.hidden,blank:!layer?.querySelector('table'),
   loading:!!indicator&&loadingRect.width>0&&loadingRect.height>0,
   percentage:badge?.textContent,mascot:!!indicator?.querySelector('.app-loading__mascot'),
   within:loadingRect&&loadingRect.left>=0&&loadingRect.top>=0&&loadingRect.right<=innerWidth&&loadingRect.bottom<=innerHeight,
   topmost:!!document.elementFromPoint(innerWidth/2,innerHeight/2)?.closest('[data-report-transition]'),
   backdrop:copy&&getComputedStyle(copy).backgroundColor,underlay:getComputedStyle(panels[1].element).backgroundColor,
   background:surface&&getComputedStyle(surface).backgroundColor});
 }
 const retainedSurface=document.querySelector('[data-report-transition] [role="dialog"]');
 const copyRect=retainedSurface?.getBoundingClientRect();
 const sameBounds=!!copyRect&&['left','top','width','height'].every(key=>Math.abs(rect[key]-copyRect[key])<1);
 window.transitionStage='destination';gate.resolve();await opening;await new Promise(requestAnimationFrame);
 const destination=panels[1].element;
 document.documentElement.dataset.layout=JSON.stringify({frames,expectedScroll,sameBounds,removed:!document.querySelector('[data-report-transition]'),
  ready:cargos?!destination.querySelector('[aria-busy="true"]')&&!destination.textContent.includes('Carregando presenças'):destination.textContent.includes('Destino pronto'),background:getComputedStyle(destination).backgroundColor,
  visible:!destination.hidden});
 }
 }
}catch(error){document.documentElement.dataset.layout=JSON.stringify({error:String(error.stack||error)});}
</script></body></html>
