<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de pedidos: layout responsivo</title>
  <link rel="stylesheet" href="../../src/ui/orders-gallery.css">
  <link rel="stylesheet" href="../../src/ui/gallery-record-actions.css">
</head>
<body>
  <script type="module">
    import { createOrdersGallery } from '../../src/ui/orders-gallery-view.js';
    const rows = [
      { id: '353', hasAttachments: true, fields: {
        ID: '353', FORNECEDOR: 'ISRAEL ESCORAMENTO E ARMAÇÕES', STATUS: 'PENDENTE AUDITORIA',
        FILIAL: '004 - EDIFÍCIO XAVANTE', FORMAPGTO: 'ENERGÉTICA - CAIXA', VALORTOTAL: 13000,
        'NOTA FISCAL': 'PENDENTE', Criado: '2026-10-03T10:00:00Z', Modificado: '2026-10-03T11:00:00Z',
        'Criado por': 'Usuário não identificado', 'Modificado por': 'Bernardo notini',
      } },
      { id: '351', hasAttachments: false, fields: {
        ID: '351', FORNECEDOR: 'CEMIG', STATUS: 'APROVADO', FILIAL: '004 - EDIFÍCIO XAVANTE',
        FORMAPGTO: 'DÉBITO AUTOMÁTICO', VALORTOTAL: 450, 'NOTA FISCAL': 'PENDENTE',
        Criado: '2026-10-02T10:00:00Z', Modificado: '2026-10-02T10:00:00Z',
      } },
    ];
    const gallery = createOrdersGallery({ document, data: {
      async loadSnapshot() {
        if (new URLSearchParams(location.search).has('failure')) throw new Error('A requisicao Microsoft Graph excedeu o tempo limite. ' + 'Falha temporária na consulta dos pedidos. '.repeat(5));
        return { rows };
      },
      async listAttachments(id) { return id === '353' ? [{ fileName: 'pedido.pdf' }, { fileName: 'foto.jpg' }] : []; },
      async loadEditor(id) { return { entity: { id: 'pedidos', title: 'Pedido' }, item: { id, fields: { FORNECEDOR: 'ISRAEL ESCORAMENTO E ARMAÇÕES' } },
        columns: [{ name: 'FORNECEDOR', label: 'Fornecedor', control: 'text', editable: true }], contract: { hasForm: true } }; },
      async loadLinkedReport() { return new Promise(() => {}); },
    } });
    await gallery.open();
    if (new URLSearchParams(location.search).has('failure')) {
      const root = document.querySelector('.og-overlay'), alert = root.querySelector('.og-notice'), sort = root.querySelector('.og-sort-field');
      const rect = alert.getBoundingClientRect(), retry = [...root.querySelectorAll('button')].find(button => button.textContent === 'Tentar novamente');
      document.documentElement.dataset.layout = JSON.stringify({
        alertVisible: !alert.hidden && alert.getAttribute('role') === 'alert',
        text: alert.textContent, sortHidden: sort.hidden,
        fits: rect.left >= 0 && rect.right <= innerWidth && alert.scrollWidth <= alert.clientWidth + 1,
        beforeRetry: rect.bottom <= retry.getBoundingClientRect().top,
        noOverflow: root.querySelector('.og-content').scrollWidth <= root.querySelector('.og-content').clientWidth + 1,
      });
    }
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
