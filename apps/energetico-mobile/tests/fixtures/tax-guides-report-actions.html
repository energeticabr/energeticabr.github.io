<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/tax-guides-report.css"><link rel="stylesheet" href="/src/ui/searchable-filter-selects.css"></head>
<body><main id="app"></main><script type="module">
import { createTaxGuidesReportView } from '/src/ui/tax-guides-report-view.js';
import { decorateReportPrint } from '/src/ui/report-print.js';
import { retainReportPresentation } from '/src/ui/report-navigation.js';
const row={id:'7',hasAttachments:false,fields:{TIPO:'INSS',FILIAL:'004 - EDIFÍCIO XAVANTE',COMPETENCIA:'2026-10-20',VENCIMENTO:'2026-11-20',VALOR:null,STATUS:'PENDENTE'}};
const params=new URLSearchParams(location.search),mode=params.get('mode');
const submitted={...row,id:'8',hasAttachments:true,fields:{...row.fields,TIPO:'FGTS',STATUS:'SUBMETIDO'}};
const rows=[row,submitted];
if(mode==='many-rows'){
  for(let i=0;i<40;i++)rows.push({...row,id:String(9+i)});
}
const data={loadSnapshot:async()=>({rows}),
loadEditor:async()=>({item:row,attachments:{existingFiles:[]}}),saveEditor:async()=>{}};
if(params.has('keyboard'))Object.defineProperty(window,'visualViewport',{value:Object.assign(new EventTarget(),{width:innerWidth,height:Math.round(innerHeight*.55),offsetTop:0,offsetLeft:0})});
const view=decorateReportPrint(createTaxGuidesReportView({document,data,pickAttachments:async()=>[new File(['guide'],'guia.pdf',{type:'application/pdf'})]}),{action:'open-tax-guides-report'});
await view.open();
if(['attach','amount','confirm'].includes(mode)){
  view.element.querySelector(`[data-guide-id="7"] [data-guide-action="${mode==='confirm'?'attach':mode}"]`).click();
  if(mode==='confirm')view.element.querySelector('[data-source="files"]').click();
  await new Promise(resolve=>setTimeout(resolve,40));
}
const printStatus=view.element.querySelector('.report-pdf-status');
if(mode==='print-error'){
  printStatus.textContent='Não foi possível abrir o PDF do relatório.';
  printStatus.hidden=false;
}
await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const rect=node=>{const r=node.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height};};
const panel=document.querySelector('.tgr-panel'),editor=document.querySelector('.tgr-editor');
const rowFills=Object.fromEntries([...panel.querySelectorAll('tbody tr')].map(row=>[row.dataset.guideStatus,[...row.cells].map(cell=>getComputedStyle(cell).backgroundColor)]));
const scroll=panel.querySelector('.tgr-scroll');
if(mode==='many-rows'){
  scroll.scrollTop=scroll.scrollHeight;
  panel.scrollTop=panel.scrollHeight;
}
const panelRect=rect(panel),scrollRect=rect(scroll),lastRow=rect(scroll.querySelector('tbody tr:last-child'));
const rotated=view.element.dataset.reportPortrait==='true';
const lastRowInScroll=mode==='many-rows'&&(rotated
  ? lastRow.x>=scrollRect.x-1&&lastRow.right<=scrollRect.right+1
  : lastRow.y>=Math.max(panelRect.y,scrollRect.y)-1&&lastRow.bottom<=Math.min(panelRect.bottom,scrollRect.bottom)+1);
let transition;
if(mode==='transition'){
  const release=retainReportPresentation(view.element);
  const surface=document.querySelector('.report-transition-surface');
  transition={surface:rect(surface),indicator:rect(surface.querySelector('.app-loading'))};
  release();
}
document.documentElement.dataset.layout=JSON.stringify({panel:panelRect,editor:editor&&rect(editor),transition,
rootOverflow:document.documentElement.scrollWidth>innerWidth+1,panelOverflow:panel.scrollWidth>panel.clientWidth+1,
tableScrollTop:scroll.scrollTop,lastRowInScroll,printError:mode==='print-error'?rect(printStatus):null,
buttons:[...document.querySelectorAll('.tgr-editor button')].filter(n=>!n.closest('[hidden]')).map(rect),
confirmation:[...document.querySelectorAll('[data-guide-confirm]:not([hidden]) button')].map(button=>button.textContent),rowFills,
input:editor?.querySelector('input')&&rect(editor.querySelector('input')), sources:editor?.querySelectorAll('[data-source]').length,
visibleHeight:window.visualViewport?.height||innerHeight,logicalWidth:Number.parseFloat(view.element.style.getPropertyValue('--report-width'))||innerWidth});
</script></body></html>
