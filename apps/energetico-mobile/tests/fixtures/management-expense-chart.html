<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; }
  main { position: fixed; inset: 0; }
</style>
<main></main>
<script type="module">
  import '../../src/ui/report-landscape.css';
  import '../../src/ui/management-report.css';
  import { bindReportLandscape } from '../../src/ui/report-landscape.js';
  import { createManagementExpenseTypeDashboardView } from '../../src/ui/management-expense-type-dashboard-view.js';

  const root = document.querySelector('main');
  bindReportLandscape(root);
  const paid = [0, 974, 1200, 547, 133, 46900, 63400, 34500, 25200, 31700, 52500, 102400];
  const periodFor = (year, index) => `${year}-${String(index + 1).padStart(2, '0')}`;
  const monthsFor = year => paid.map((value, index) => {
    const forecast = index === 11 ? 34800 : 0;
    return { period: periodFor(year, index),
      paid: value, forecast, total: value + forecast };
  });
  const rank = [{ name: 'CONCRETO USINADO', total: 97500, percentage: 24.7 }];
  const dashboard = createManagementExpenseTypeDashboardView({ root });
  dashboard.open((year = 2026) => {
    const months = monthsFor(year);
    return {
      year, years: [2026, 2024], expenseType: 'MATERIAL', branch: '004 - EDIFÍCIO XAVANTE', months,
      total: months.reduce((sum, month) => sum + month.total, 0),
      products: rank, suppliers: rank, stages: rank,
    };
  });

  const waitForLayout = async () => {
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
  };
  await waitForLayout();
  const svg = root.querySelector('svg');
  const card = svg.closest('section');
  const points = svg.querySelectorAll('.gm-expense-dashboard-series.is-total circle');
  const labels = [...svg.querySelectorAll('.gm-dashboard-value-label:not([hidden])')];
  const monthsLabels = [...svg.querySelectorAll('.gm-dashboard-month-label')];
  const first = points[0].getBoundingClientRect();
  const last = points[11].getBoundingClientRect();
  const sideways = root.dataset.reportPortrait === 'true';
  const drawnWidth = sideways ? last.y - first.y : last.x - first.x;
  const labelSize = label => {
    const rect = label.getBoundingClientRect();
    return sideways ? rect.width : rect.height;
  };
  const cardWidth = card.clientWidth;
  const boxes = [...labels, ...monthsLabels].map(label => label.getBBox());
  const noOverlap = boxes.every((box, index) => boxes.slice(index + 1).every(next =>
    box.x + box.width <= next.x || next.x + next.width <= box.x ||
    box.y + box.height <= next.y || next.y + next.height <= box.y));
  const rankSize = parseFloat(getComputedStyle(root.querySelector('.gm-dashboard-rank-value')).fontSize);
  const valueHeight = Math.min(...labels.map(labelSize));
  const monthHeight = Math.min(...monthsLabels.map(labelSize));
  const lastLabel = labels.find(label => label.textContent.includes('137,2'))?.textContent;
  svg.dispatchEvent(new PointerEvent('pointermove', {
    clientX: last.x + last.width / 2, clientY: last.y + last.height / 2,
  }));
  const detail = root.querySelector('.gm-expense-dashboard-month-detail');
  const detailBounds = detail.getBoundingClientRect();
  const scrollBounds = root.querySelector('.gm-expense-dashboard-scroll').getBoundingClientRect();
  const detailVisible = detailBounds.width > 0 && detailBounds.height > 0 &&
    detailBounds.left >= scrollBounds.left && detailBounds.right <= scrollBounds.right &&
    detailBounds.top >= scrollBounds.top && detailBounds.bottom <= scrollBounds.bottom;

  card.style.maxWidth = `${cardWidth - 100}px`;
  await waitForLayout();
  const resized = sideways ? points[11].getBoundingClientRect().y - points[0].getBoundingClientRect().y
    : points[11].getBoundingClientRect().x - points[0].getBoundingClientRect().x;
  card.style.removeProperty('max-width');
  svg.dispatchEvent(new PointerEvent('pointerleave'));
  await waitForLayout();

  const pointLabel = (chart, series, index) =>
    chart.querySelectorAll(`.is-${series} .gm-dashboard-value-label`)[index];
  const differentMonthColors = ['total', 'paid'].map(series => getComputedStyle(pointLabel(svg, series, 11)).fill);
  const year = root.querySelector('select[name=analysis-year]');
  const dialogBounds = root.querySelector('.gm-expense-dashboard').getBoundingClientRect();
  const yearBounds = year.getBoundingClientRect();
  const yearFits = yearBounds.width >= 34 && yearBounds.height >= 34 &&
    yearBounds.left >= dialogBounds.left && yearBounds.right <= dialogBounds.right &&
    yearBounds.top >= dialogBounds.top && yearBounds.bottom <= dialogBounds.bottom;
  year.focus();
  year.value = '2024';
  year.dispatchEvent(new Event('change', { bubbles: true }));
  const switchedYear = root.querySelector('.gm-dashboard-month-label').textContent;
  const yearRetainedFocus = document.activeElement === year;

  const crowdedMonths = [
    [335441, 7441], [265673, 0], [319062, 160], [721837, 0], [571681, 19672], [531881, 0],
    [194166, 7128], [267269, 0], [475641, 0], [214545, 0], [412853, 10081], [125867, 0],
  ].map(([paid, forecast], index) => ({
    period: periodFor(2026, index), paid, forecast, total: paid + forecast,
  }));
  dashboard.open(() => ({
    year: 2026, years: [2026], expenseType: 'MATERIAL', branch: '004 - EDIFÍCIO XAVANTE', months: crowdedMonths,
    total: crowdedMonths.reduce((sum, month) => sum + month.total, 0),
    products: rank, suppliers: rank, stages: rank,
  }));
  const crowdedChart = root.querySelector('svg');
  Object.assign(crowdedChart.style, { width: '508px', height: '190px' });
  await waitForLayout();
  const equalMonthLabels = ['total', 'paid'].filter(series =>
    getComputedStyle(pointLabel(crowdedChart, series, 3)).display !== 'none');
  const sharedColor = getComputedStyle(pointLabel(crowdedChart, 'paid', 3)).fill;
  const totalLegend = root.querySelector('.gm-dashboard-legend-item.is-total');
  const paidLegend = root.querySelector('.gm-dashboard-legend-item.is-paid');
  totalLegend.click();
  const paidOnlyColor = getComputedStyle(pointLabel(crowdedChart, 'paid', 3)).fill;
  totalLegend.click();
  paidLegend.click();
  const totalOnlyColor = getComputedStyle(pointLabel(crowdedChart, 'total', 3)).fill;

  document.documentElement.dataset.layout = JSON.stringify({
    coverage: drawnWidth / cardWidth, valueHeight, monthHeight, noOverlap, rankSize,
    lastLabel, detail: detail.textContent, detailVisible, resized: drawnWidth - resized, months: monthsLabels.length,
    equalMonthLabels, sharedColor, differentMonthColors, paidOnlyColor, totalOnlyColor,
    yearFits, switchedYear, yearRetainedFocus,
  });
</script>
