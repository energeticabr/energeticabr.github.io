<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provisões e recorrências — layout</title>
<style>html,body{margin:0;padding:0;font-family:Arial,sans-serif}</style></head>
<body><main id="app"><button>Abrir relatório</button></main>
<script type="module">
import '../../src/styles.css';
import '../../src/ui/payment-ledger.css';
import '../../src/ui/searchable-filter-selects.css';
import '../../src/ui/report-print.css';
import '../../src/ui/provision-report.css';
import '../../src/web/attachment-preview.css';
import {createProvisionReportView} from '../../src/ui/provision-report-view.js';
import {decorateReportNavigation} from '../../src/ui/report-navigation.js';
import {decorateReportPrint,captureFilteredReport} from '../../src/ui/report-print.js';
import {createAttachmentPreview} from '../../src/web/attachment-preview.js';
import {installAppZoomGuard} from '../../src/web/app-zoom-guard.js';
try {
  installAppZoomGuard(document);
  const base={recurrenceId:'7',branch:'004 - EDIFÍCIO XAVANTE',supplier:'FORNECEDOR COM NOME EXTENSO LTDA.',product:'LOCAÇÃO DE EQUIPAMENTO',property:'TODOS',paidDate:'',schedule:'',observation:''};
  const provisions=[
    {...base,id:'301',dueDate:'2026-10-09',schedule:'PENDENTE',status:'PAGAMENTO PREVISTO',total:123456789.90},
    {...base,id:'302',dueDate:'2026-10-11',status:'PAGAMENTO PREVISTO',total:121.78},
    {...base,id:'303',dueDate:'2026-10-20',status:'PAGAMENTO PREVISTO',total:200},
    {...base,id:'304',dueDate:'2026-10-22',schedule:'PAGAMENTO AGENDADO',scheduledDate:'2026-10-10',executionDate:'2026-10-15',status:'PAGAMENTO PREVISTO',total:50},
    ...Array.from({length:12},(_,i)=>{const date=`2026-${String(i+1).padStart(2,'0')}-02`;return {...base,id:String(101+i),dueDate:date,paidDate:date,schedule:'PAGO',status:'PAGAMENTO EFETUADO',total:i===0?1234567.89:89.99};}),
    {...base,id:'400',recurrenceId:'8',dueDate:'2026-10-30',paidDate:'2026-10-02',schedule:'PAGO',status:'PAGAMENTO EFETUADO',total:75},
  ];
  const recurrences=[{...base,id:'7',status:'ATIVO',startDate:'2026-10-03',modified:'2026-10-01T12:00:00Z'},{...base,id:'8',status:'ATIVO',startDate:'2026-01-01',modified:'2026-10-01T12:00:00Z'},
    {...base,id:'9',status:'INATIVO',supplier:'FORNECEDOR INATIVO COM NOME EXTENSO LTDA.',product:'EQUIPAMENTO COM UMA DESCRIÇÃO LONGA PARA QUEBRAR SEM PERDER INFORMAÇÕES',modified:'2026-10-10T12:30:00Z'}];let loads=0;
  const grouped=new URLSearchParams(location.search).has('grouped');
  const descriptions=grouped?[{id:'42',branch:'FILIAL DO PAI',supplier:'FORNECEDOR DE REFERÊNCIA',dueDate:'2026-10-25'},
    {id:'43',branch:'FILIAL DO PAI',supplier:'FORNECEDOR DE REFERÊNCIA',dueDate:'2026-10-25'}]:[];
  if(grouped){provisions[0].descriptionId='42';provisions[0].branch='FILIAL DO PAI';provisions[0].supplier='FORNECEDOR DE REFERÊNCIA';provisions[1].descriptionId='42';provisions[2].descriptionId='43';}
  const preview=createAttachmentPreview({canEmbedPdf:()=>false,exportMedia:async()=>{}});
  const action='open-provision-report',view=decorateReportPrint(decorateReportNavigation(createProvisionReportView({data:{async loadProvisionReportSnapshot(){loads++;return {provisions,recurrences,descriptions};}},now:()=>new Date('2026-10-11T12:00:00Z')}),{action}),{action,previewMedia:preview.open,closePreview:preview.close});
  await view.open();const root=view.element;
  const portrait=root.dataset.reportPortrait==='true';
  const rect=node=>{
    const {left,right,top,bottom,width,height}=node.getBoundingClientRect();
    // Compare logical rows/columns even when the report canvas is rotated.
    return portrait?{left:top,right:bottom,top:innerWidth-right,width:height,height:width}:{left,right,top,width,height};
  };
    const logo=root.querySelector('.pr-logo img');await logo.decode();await new Promise(requestAnimationFrame);
    const content=root.querySelector('.pr-content'),toolbar=root.querySelector('.pr-filters'),annual=root.querySelector('.pr-table--annual'),main=root.querySelector('.pr-table--provisions');
    const visible=node=>!node.closest('[hidden]');
    const atomic=[...root.querySelectorAll('.pr-nowrap,.pr-money')].filter(visible).map(node=>{
      const range=document.createRange();range.selectNodeContents(node);const cell=node.closest('td');
      return {text:node.textContent,lines:range.getClientRects().length,rect:rect(node),cell:cell?rect(cell):null,whiteSpace:getComputedStyle(node).whiteSpace};
    });
    const dots=[...root.querySelectorAll('.pr-status-dot')].filter(visible).map(node=>({tone:node.parentElement.dataset.statusTone,color:getComputedStyle(node).backgroundColor,...rect(node)}));
    const annualDotCount=annual.querySelectorAll('.pr-status-dot').length;
    const annualStatuses=[...annual.querySelectorAll('.pr-status-line')].map(node=>({tone:node.dataset.statusTone,text:node.textContent,color:getComputedStyle(node).color}));
    const wrappers=[...root.querySelectorAll('.pr-section-scroll')].map(node=>({...rect(node),overflow:node.scrollWidth-node.clientWidth,section:node.dataset.section,keyboard:node.tabIndex}));
    const annualScroll=annual.closest('.pr-section-scroll');if(annualScroll){annualScroll.scrollLeft=annualScroll.scrollWidth;await new Promise(requestAnimationFrame);}
    const reachTotal=annualScroll?{scroll:annualScroll.scrollLeft,total:rect(annual.querySelector('tbody tr [data-column=total]')),wrapper:rect(annualScroll)}:null;
    const capture=captureFilteredReport(root,{title:'Provisões de pagamento e despesas recorrentes'}),tables=capture.pages[0].blocks.filter(b=>b.type==='table');
    const initial={loads,portrait,warning:!root.querySelector('.pl-orientation').hidden,logoLoaded:logo.naturalWidth>0,documentOverflow:document.documentElement.scrollWidth-innerWidth,
      navigationPadding:parseFloat(getComputedStyle(content).paddingInlineStart),
      toolbarOverflow:toolbar.scrollWidth-toolbar.clientWidth,contentOverflow:content.scrollWidth-content.clientWidth,contentHeight:content.clientHeight,panel:rect(root.querySelector('.pr-dialog')),content:rect(content),
      tableWidth:rect(main).width,availableWidth:main.closest('.pr-section-scroll').clientWidth,
      tableLayouts:[main,annual,root.querySelector('.pr-table--inactive')].map(table=>({
        section:table.dataset.section,display:getComputedStyle(table).display,
        headerDisplay:getComputedStyle(table.tHead.rows[1]).display,headerPosition:getComputedStyle(table.tHead.rows[1]).position,
        headers:[...table.tHead.rows[1].cells].map(cell=>({text:cell.textContent,...rect(cell)})),
        rowDisplay:getComputedStyle(table.tBodies[0].rows[0]).display,
        cells:[...table.tBodies[0].rows[0].cells].map(cell=>({display:getComputedStyle(cell).display,...rect(cell)})),
      })),
      hiddenCells:[...root.querySelectorAll('tbody td')].filter(visible).filter(node=>getComputedStyle(node).display==='none'||rect(node).width===0).map(node=>node.textContent),
      cellOverflows:[...root.querySelectorAll('tbody td')].filter(visible).filter(node=>node.scrollWidth-node.clientWidth>1).map(node=>({text:node.textContent,overflow:node.scrollWidth-node.clientWidth})),
      labelledCells:[...root.querySelectorAll('tbody tr:not(.pr-total) td:not([colspan])')].map(node=>({label:node.dataset.label,text:node.textContent})),
      headerColumns:tables.map(table=>table.rows.filter(row=>row.header).at(-1).cells.length),
      columns:[...annual.tBodies[0].rows[0].cells].slice(1,13).map(node=>rect(node).width),fontSize:getComputedStyle(annual.querySelector('td')).fontSize,
      annualTypography:{
        dates:[...annual.querySelectorAll('.pr-date')].map(node=>({weight:getComputedStyle(node).fontWeight,size:parseFloat(getComputedStyle(node).fontSize)})),
        totals:[...annual.querySelectorAll('td[data-column=total]')].map(node=>({align:getComputedStyle(node).textAlign,weight:getComputedStyle(node).fontWeight})),
        ordinaryAmounts:[...annual.querySelectorAll('.pr-money')].filter(node=>/89,99/.test(node.textContent)).map(node=>parseFloat(getComputedStyle(node).fontSize)),
      },
      rows:main.querySelectorAll('tbody tr[data-id]:not([hidden])').length,pendingTotal:root.querySelector('[data-metric=pendingTotal]').textContent,pendingCount:root.querySelector('[data-metric=pendingCount]').textContent,
      inactiveRows:root.querySelectorAll('.pr-table--inactive tbody tr:not(.pr-total):not(:has([data-column=empty]))').length,
      atomic,dots,annualDotCount,annualStatuses,wrappers,reachTotal,arrows:[...root.querySelectorAll('.report-navigation-arrow')].map(rect),filters:capture.filters,
      capturedTables:tables.map(table=>({columns:table.widths.length,rows:table.rows.length})),annualText:tables[1].rows.flatMap(row=>row.cells.flatMap(cell=>cell.runs.map(run=>run.text))).join(' ')};
    for(let count=0;count<6;count++)root.querySelector('[aria-label="Ampliar tabela anual"]').click();
    await new Promise(requestAnimationFrame);
    const zoomProbe={tableDisplay:getComputedStyle(annual).display,
      fontReadable:parseFloat(getComputedStyle(annual.querySelector('td')).fontSize)>=12&&parseFloat(getComputedStyle(annual.querySelector('.pr-money')).fontSize)>=12,
      viewportGuard:/maximum-scale=1(?:,|$)/.test(document.querySelector('meta[name=viewport]').content)};
    root.querySelector('[aria-label="Ajustar tabela anual à tela"]').click();await new Promise(requestAnimationFrame);
    zoomProbe.resetOverflow=annualScroll.scrollWidth-annualScroll.clientWidth;
    let groupProbe;
    if(grouped){
      const summary=main.querySelector('[data-description-id="42"]'),toggle=summary.querySelector('button');
      const controlled=toggle.getAttribute('aria-controls').split(' ').map(id=>document.getElementById(id));
      const branchCell=summary.querySelector('[data-column=branch]'),branchText=branchCell.querySelector('span');
      const annualBefore=annual.textContent,totalBefore=root.querySelector('[data-metric=pendingTotal]').textContent;
      const collapsedHidden=controlled.every(node=>node.hidden&&getComputedStyle(node).display==='none');
      toggle.focus();toggle.click();await new Promise(requestAnimationFrame);
      groupProbe={collapsedHidden,expanded:toggle.getAttribute('aria-expanded'),focusKept:document.activeElement===toggle,
        branchRect:rect(branchCell),branchDisplay:getComputedStyle(branchCell).display,branchTextRect:rect(branchText),toggleRect:rect(toggle),
        summaryFill:getComputedStyle(summary).backgroundColor,childFill:getComputedStyle(controlled[0]).backgroundColor,
        equalBranch:controlled[0].querySelector('[data-column=branch]').textContent,
        equalSupplier:controlled[0].querySelector('[data-column=supplier]').textContent,
        equalStatus:controlled[0].querySelector('[data-column=status]').textContent,
        differentBranch:controlled[1].querySelector('[data-column=branch]').textContent,
        originalIds:controlled.map(node=>node.dataset.id),originalDates:controlled.map(node=>node.querySelector('[data-column=dueDate]').textContent),
        branch:summary.querySelector('[data-column=branch] span').textContent,supplier:summary.querySelector('[data-column=supplier]').textContent,
        date:summary.querySelector('[data-column=dueDate]').textContent,total:summary.querySelector('[data-column=total]').textContent,
        products:[...summary.querySelector('[data-column=product]').children].map(node=>node.textContent),
        singleHasToggle:Boolean(main.querySelector('[data-id="303"] button')),
        expandedRows:main.querySelectorAll('tbody tr:not(.pr-total):not([hidden])').length,
        expandedOverflow:main.closest('.pr-section-scroll').scrollWidth-main.closest('.pr-section-scroll').clientWidth,
        cellOverflows:[...main.querySelectorAll('tbody td')].filter(visible).filter(node=>node.scrollWidth-node.clientWidth>1).map(node=>node.textContent),
        totalsUnchanged:totalBefore===root.querySelector('[data-metric=pendingTotal]').textContent,
        annualUnchanged:annualBefore===annual.textContent};
      branchCell.click();groupProbe.collapsed=toggle.getAttribute('aria-expanded');groupProbe.hiddenAgain=controlled.every(node=>node.hidden&&getComputedStyle(node).display==='none');
    }
    document.documentElement.dataset.layout=JSON.stringify({...initial,zoomProbe,groupProbe});
}catch(error){document.documentElement.dataset.layout=JSON.stringify({error:String(error.stack||error)});}
</script></body></html>
