<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seleção nativa fictícia</title><link rel="stylesheet" href="../../src/styles.css"><link rel="stylesheet" href="../../src/web/attachment-preview.css"></head>
<body><script type="module">
import { PDFDocument, StandardFonts } from 'pdf-lib';
import { createAttachmentPreview } from '../../src/web/attachment-preview.js';
import { installAppZoomGuard } from '../../src/web/app-zoom-guard.js';
installAppZoomGuard();
const line = '00000.00000 00000.000000 00000.000000 0 00000000000000';
const mode = new URLSearchParams(location.search).get('mode') || 'default';
let ready = false;
let lastTouch = null;
const diagnostics = [];
window.__pdfSelectionDiagnostic = value => diagnostics.push(value);
function report() {
  const span = [...document.querySelectorAll('.attachment-preview-pdf-text-layer span')].find(s => s.textContent === line);
  const rect = span?.getBoundingClientRect();
  const selection = getSelection();
  window.webkit?.messageHandlers.status.postMessage({ready, mode, diagnostics,
    streamAsyncIterator: typeof ReadableStream.prototype[Symbol.asyncIterator],
    spans: [...document.querySelectorAll('.attachment-preview-pdf-text-layer span')].map(node => node.textContent),
    canvases: document.querySelectorAll('.attachment-preview-pdf-canvas').length,
    selected: selection?.toString() || '', lastTouch,
    anchorInTarget: selection?.anchorNode?.parentElement === span,
    focusInTarget: selection?.focusNode?.parentElement === span,
    inside: Boolean(selection?.anchorNode?.parentElement?.closest('.attachment-preview-pdf-text-layer')),
    rect: rect && {x:rect.x, y:rect.y, width:rect.width, height:rect.height}});
}
document.addEventListener('selectionchange', report);
document.addEventListener('touchstart', event => {
  const touch = event.touches[0];
  lastTouch = {x:touch?.clientX,y:touch?.clientY,targetInPaymentSpan:event.target.textContent === line,
    viewportWidth:innerWidth, scale:visualViewport?.scale, offsetTop:visualViewport?.offsetTop};
  report();
}, {capture:true,passive:true});
try {
  const pdf = await PDFDocument.create(), font = await pdf.embedFont(StandardFonts.Helvetica);
  const page = pdf.addPage([600,800]);
  page.drawText('DOCUMENTO FICTICIO PARA TESTE', {x:30,y:750,size:14,font});
  page.drawText(line, {x:220,y:710,size:8,font});
  page.drawText('VALOR FICTICIO', {x:30,y:650,size:10,font});
  const preview = createAttachmentPreview({canEmbedPdf:()=>false});
  await preview.open(new Blob([await pdf.save()], {type:'application/pdf'}), 'Boleto_ficticio.pdf');
  // Isolated diagnostic variants; production styles are never changed here.
  if (mode === 'scope') {
    const style = document.createElement('style');
    style.textContent = '.attachment-preview-header,.attachment-preview-footer,.attachment-preview-status,.attachment-preview-pdf-canvas{-webkit-user-select:none;user-select:none}';
    document.head.append(style);
  }
  if (mode === 'untransformed') {
    const canvas = document.querySelector('canvas'), wrapper = document.querySelector('.attachment-preview-pdf-text');
    wrapper.style.left = `${canvas.offsetLeft}px`; wrapper.style.transform = 'none';
  }
  const target = [...document.querySelectorAll('.attachment-preview-pdf-text-layer span')].find(s=>s.textContent===line);
  if (!target) throw new Error(`Payment span missing; diagnostics=${JSON.stringify(diagnostics)}`);
  if (mode === 'visible') target.style.color = 'black';
  if (mode === 'readable') target.style.cssText = 'position:absolute;left:10px;top:40px;font-size:16px;transform:none;color:black';
  ready = true;
  report();
} catch (error) { window.webkit?.messageHandlers.status.postMessage({error:String(error), stack:error.stack, diagnostics,
  streamAsyncIterator:typeof ReadableStream.prototype[Symbol.asyncIterator],
  spans:[...document.querySelectorAll('.attachment-preview-pdf-text-layer span')].map(node=>node.textContent),
  canvases:document.querySelectorAll('.attachment-preview-pdf-canvas').length}); }
</script></body></html>
