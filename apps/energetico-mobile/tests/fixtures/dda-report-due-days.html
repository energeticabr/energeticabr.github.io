<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dias para vencimento — dados fictícios</title>
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/payment-ledger.css"><link rel="stylesheet" href="/src/ui/dda-report.css"></head>
<body><main id="app"></main><script type="module">
import {createDdaReportView} from '/src/ui/dda-report-view.js';
const dates=['2026-11-04','2026-11-05','2026-11-03','2026-11-09',null];
const report=createDdaReportView({document,now:()=>new Date('2026-11-04T22:00:00-03:00'),
 data:{loadSnapshot:async()=>({rows:dates.map((due,i)=>({id:String(i+1),fields:{
  Title:'FORNECEDOR FICTÍCIO DE MATERIAIS E EQUIPAMENTOS PARA CONSTRUÇÃO LTDA',
  VENCIMENTO:due,EMISSAO:i===4?null:'2026-10-23',VALOR:2500,SITUACAO:'Em aberto',BANCO:'BANCO EXEMPLO',DOCUMENTO:'EX-001',
  STATUS_DDA:i<2||i===3?'Agendado':i===4?'Não confirmado':'Em aberto',
  DESCRITIVOPROVIS_x00c3_O:i===1?'8':'',
  DDA_x0020_sem_x0020_vincula_x00e:i===3
 }}))}),unlinkedReview:{save(){throw new Error('A fixture não deve gravar.');}}}});
await report.open();
await document.fonts.ready;
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const state={overflow:document.documentElement.scrollWidth>innerWidth+1,rows:[],issued:[]};
state.linkRows=[...document.querySelectorAll('[data-dda-id]')].map(row=>{
 const link=row.querySelector('.ddr-link-cluster'),warning=row.querySelector('.ddr-link-warning');
 const label=link.firstChild,word=document.createRange();
 const wordsFit=[...label.textContent.matchAll(/\S+/g)].every(match=>{
  word.setStart(label,match.index);word.setEnd(label,match.index+match[0].length);
  return word.getClientRects().length===1;
 });
 return {id:row.dataset.ddaId,link:link.textContent,warning:warning?.textContent??null,
  linkBackground:getComputedStyle(link).backgroundColor,linkFits:link.scrollWidth<=link.clientWidth+1&&link.offsetWidth<=row.cells[7].clientWidth,wordsFit,
  below:Boolean(warning&&warning.offsetTop>=link.offsetTop+link.offsetHeight),
  fits:Boolean(warning&&warning.scrollWidth<=warning.clientWidth+1),
  rowBackground:getComputedStyle(row).backgroundColor,
  dueDateColor:getComputedStyle(row.querySelector('.ddr-due-date')).color,
  cellBackgrounds:[...row.cells].map(cell=>getComputedStyle(cell).backgroundColor)};
});
state.schedules=[...document.querySelectorAll('.ddr-schedule-cluster')].map(badge=>{
 const style=getComputedStyle(badge),existing=badge.nextElementSibling;
 const label=badge.querySelector('strong').firstChild,word=document.createRange();
 const wordsFit=[...label.textContent.matchAll(/\S+/g)].every(match=>{
  word.setStart(label,match.index);
  word.setEnd(label,match.index+match[0].length);
  return word.getClientRects().length===1;
 });
 return {text:badge.textContent,state:badge.dataset.scheduleState,color:style.color,background:style.backgroundColor,
  sameWidth:badge.offsetWidth===existing.offsetWidth,
  above:badge.offsetTop+badge.offsetHeight<existing.offsetTop,
  fits:wordsFit&&badge.scrollWidth<=badge.clientWidth+1,
  printColorAdjust:style.printColorAdjust};
});
state.metrics=[...document.querySelectorAll('.ddr-metric:not([hidden])')].map(card=>({
 label:card.querySelector('span').textContent,value:card.querySelector('strong').textContent.replace(/\s/g,' '),
 fits:card.scrollWidth<=card.clientWidth+1,top:card.offsetTop
}));
for(const due of document.querySelectorAll('.ddr-due')){
 const badge=due.querySelector('.ddr-due-days'),date=due.querySelector('.ddr-due-date');
 if(!badge){state.missing=due.textContent;continue;}
 const style=getComputedStyle(badge);
 // offset positions stay in report coordinates when the phone rotates it.
 state.rows.push({text:badge.textContent,tone:due.dataset.dueTone,color:style.color,background:style.backgroundColor,
  dateColor:getComputedStyle(due).color,border:style.borderTopColor,fontSize:parseFloat(style.fontSize),height:badge.offsetHeight,
  below:badge.offsetTop>=date.offsetTop+date.offsetHeight,
  centered:Math.abs(badge.offsetLeft+badge.offsetWidth/2-due.clientWidth/2)<=1,
  fits:badge.offsetWidth<=due.clientWidth&&badge.offsetLeft>=0&&badge.offsetLeft+badge.offsetWidth<=due.clientWidth,
  printColorAdjust:style.printColorAdjust});
}
for(const cell of document.querySelectorAll('.ddr-issued-date')){
 const badge=cell.querySelector('.ddr-issued-days'),date=cell.querySelector('strong');
 if(!badge){state.missingIssued=cell.textContent;continue;}
 const style=getComputedStyle(badge);
 state.issued.push({text:badge.textContent,color:style.color,background:style.backgroundColor,
  fontSize:parseFloat(style.fontSize),height:badge.offsetHeight,
  below:badge.offsetTop>=date.offsetTop+date.offsetHeight,
  centered:Math.abs(badge.offsetLeft+badge.offsetWidth/2-cell.clientWidth/2)<=1,
  fits:badge.offsetWidth<=cell.clientWidth&&badge.offsetLeft>=0&&badge.offsetLeft+badge.offsetWidth<=cell.clientWidth,
  printColorAdjust:style.printColorAdjust});
}
document.documentElement.dataset.dueDays=JSON.stringify(state);
document.documentElement.dataset.layout=JSON.stringify(state);
document.documentElement.dataset.ready='true';
</script></body></html>
