<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<script type="module">
  import "../../src/ui/orders-gallery.css";
  import "../../src/ui/contractor-reports.css";
  import "../../src/ui/commercial-docs-rent-reports-style.css";
  import "../../src/ui/searchable-filter-selects.css";
  import { createContractorReportsView } from "../../src/ui/contractor-reports-view.js";
  import { createCommercialDocsRentReportsView } from "../../src/ui/commercial-docs-rent-reports-view.js";
  const params = new URLSearchParams(location.search);
  const number = Number(params.get("report") || 16);
  const long = "DOCUMENTOEXTENSOSEMESPAÇOS".repeat(15);
  const field = (key, pending) => ({ key, label: long, value: pending ? "" : long, pending });
  const snapshots = {
    16: { rows: [{ id: "1", branch: long, property: long, status: long, fiscal: long, contracts: [{ id: "10", buyer: long }], documents: [field("SEGURO", true), field("IDPROPOSTA", false), ...Array.from({ length: 6 }, (_, n) => field(`DOC${n}`, n % 2 === 0))], stateChecks: [field("STATE", true)], otherFields: Array.from({ length: 8 }, (_, n) => field(`OTHER${n}`, n % 2 === 0)), idPending: 5, fieldsPending: 4, totalPending: 9 }] },
    17: { todayKey: "2026-10-02", year: "2026",
      rows: [{ id: "2", property: long, tenant: long, dueDate: "2026-10-02", paymentMethod: long, contractId: "3", amountCents: 123450, dueState: "today", days: 0 }],
      sourceRows: [{ id: "2", property: long, tenant: long, dueDate: "2026-10-02", paidDate: "", paymentMethod: long, contractId: "3", grossCents: 123450 }],
      contracts: [{ id: "3", property: long, tenant: long, paymentMethod: long, status: "ATIVO", amountCents: 123450,
        adjustmentDate: "2026-11-02", expiryDate: "2027-01-02", index: "IPCA" }] },
  };
  const view = createCommercialDocsRentReportsView({ document, data: { async loadReport(report) { return snapshots[report]; } } });
  const shell = createContractorReportsView({
    document,
    data: { async loadOverview() { return { rows: [], documentStatuses: {}, warnings: [] }; }, async loadDetails() { return { launches: [], measurements: [] }; } },
    extraReports: [{ ids: [16, 17], view }],
  });
  await shell.open();
  document.querySelector(`[data-report-id="${number}"]`).click();
  await new Promise(resolve => setTimeout(resolve, 100));
  if (number === 16 && params.has("detail")) {
    const property = view.element.querySelector('[name="property"]');
    property.value = long; property.dispatchEvent(new Event("change", { bubbles: true }));
  }
  const content = document.querySelector(".cr-content"), node = view.element;
  document.documentElement.dataset.layout = JSON.stringify({ viewport: innerWidth, document: document.documentElement.scrollWidth,
    shell: { width: content.getBoundingClientRect().width, scrollWidth: content.scrollWidth },
    report: { visible: !node.hidden, branchCards: node.querySelectorAll(".cdr-branch-summary").length,
      propertyCards: node.querySelectorAll(".cdr-property-card").length,
      rentCards: node.querySelectorAll(".cdr-open-section .cdr-data-card").length,
      tableDisplay: getComputedStyle(node.querySelector(".cdr-branch-table") || node.querySelector(".cdr-rent-table") || node).display,
      mobileCardsDisplay: getComputedStyle(node.querySelector(".cdr-mobile-cards") || node).display,
      filterColor: getComputedStyle(node.querySelector(".cdr-filter-label") || node).backgroundColor,
      pendingColor: getComputedStyle(node.querySelector('[data-metric="SEGURO"]')?.parentElement || node).backgroundColor,
      clearColor: getComputedStyle(node.querySelector('[data-metric="IDPROPOSTA"]')?.parentElement || node).backgroundColor,
      brandColor: getComputedStyle(node.querySelector(".cdr-heading")).backgroundColor,
      logoLoaded: node.querySelector(".cdr-logo")?.naturalWidth > 0,
      metricTitleVisible: getComputedStyle(node.querySelector(".cdr-metrics-title")).display !== "none",
      rentHeaderColor: node.querySelector(".cdr-open-section .cdr-rental-title") ? getComputedStyle(node.querySelector(".cdr-open-section .cdr-rental-title")).backgroundColor : "",
      mobileRowDisplay: node.querySelector(".cdr-open-section .cdr-data-card") ? getComputedStyle(node.querySelector(".cdr-open-section .cdr-data-card")).display : "",
      width: node.getBoundingClientRect().width, scrollWidth: node.scrollWidth,
      childOverflow: [...node.querySelectorAll("*")].some(child => child.getBoundingClientRect().right > innerWidth + 1) } });
</script>
</body>
</html>
