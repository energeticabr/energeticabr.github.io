<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>CNO no DANFE — dados fictícios</title></head>
<body><main id="app"></main><script type="module">
import { PDFDocument, PDFOperator, StandardFonts, popGraphicsState, pushGraphicsState, scale, translate } from 'pdf-lib';
import { createNfeReportView } from '/src/ui/nfe-report-view.js';

const key = '31260612345678000199550010000001401000001401';
const notes = new Map([
  ['1', 'CNO\n90.025.44060/72'],
  ['2', 'Sem dados da obra no documento'],
  ['3', 'CNO 90.025.44069/72'],
  ['4', 'CNO 90.025.4406/72'],
  ['5', 'CNO 90.025.44060/72'],
  ['6', ''],
  ['8', 'Extrato parcial'],
  ['9', ''],
  ['10', 'Sem dados da obra no documento'],
  ['11', ''],
  ['12', ''],
]);
const pdfName = id => `DANFE-${id}.pdf`;
const rows = [...notes.keys(), '7'].map(id => ({ id, fields:{
  MODELO:'55', CHAVE_ACESSO:key, STATUS_IMPORTACAO:'RESUMO_AGUARDANDO_XML',
  STATUS_DANFE:id === '7' ? 'PENDENTE_GERACAO' : 'DISPONIVEL',
  DANFE_URL:id === '7' ? '' : `https://example.test/Attachments/${id}/${pdfName(id)}`,
} }));
const report = createNfeReportView({ document, data:{
  loadSnapshot:async () => ({ rows }),
  async downloadAttachment(id, fileName) {
    if (fileName !== pdfName(id) || !notes.has(id)) throw Error('Anexo incorreto');
    const pdf = await PDFDocument.create();
    const page = pdf.addPage();
    if (id !== '6') {
      const printedKey = id === '5' ? key.replace(/1$/, '2') : key;
      const additional = id === '8' ? '' : 'DADOS ADICIONAIS\n';
      const header = id === '12' ? 'CARTA DE CORRECAO ELETRONICA' : 'DANFE';
      const note = id === '12' ? 'Corrigir DANFE para constar CNO 90.025.44060/72'
        : id === '5' ? `NF-e referenciada: ${key}\n${notes.get(id)}` : notes.get(id);
      const groups = printedKey.match(/.{4}/g).join(' ');
      if (id === '2') {
        const regular = await pdf.embedFont(StandardFonts.Helvetica);
        const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
        page.drawText('DANFE', { x:36, y:760, size:18, font:bold });
        page.drawText('Documento Auxiliar', { x:36, y:752, size:7, font:regular });
        const first = 'CHAVE', rest = ' DE ACESSO';
        page.drawText(first, { x:36, y:724, size:7, font:regular });
        page.drawText(rest, { x:36 + regular.widthOfTextAtSize(first, 7), y:724, size:7, font:bold });
        page.drawText(groups, { x:60, y:715, size:8 });
        page.drawText(additional + note, { x:36, y:678, size:11, lineHeight:18 });
        page.pushOperators(pushGraphicsState(), translate(395, 650), scale(100, 25),
          PDFOperator.of('BI\n/W 2 /H 1 /CS /RGB /BPC 8 /F /AHx\nID\nFFFFFFFFFFFF>\nEI'),
          popGraphicsState());
      } else {
        page.drawText(`${header}\nCHAVE DE ACESSO\n${groups}\n${additional}${note}`,
          { x:36, y:760, size:11, lineHeight:18 });
      }
      if (id === '9' || id === '10') {
        const image = document.createElement('canvas');
        image.width = 200;
        image.height = 30;
        const context = image.getContext('2d');
        context.font = '16px sans-serif';
        context.fillText(id === '9' ? 'CNO 90.025.44060/72' : 'Logomarca', 5, 20);
        page.drawImage(await pdf.embedPng(image.toDataURL()), {
          x:36, y:id === '9' ? 666 : 785, width:200, height:30,
        });
      }
      if (id === '11') {
        const regular = await pdf.embedFont(StandardFonts.Helvetica);
        const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
        const prefix = 'CNO 90.025.44';
        page.drawText(prefix, { x:36, y:666, size:11, font:regular });
        page.drawText('060/72', { x:36 + regular.widthOfTextAtSize(prefix, 11), y:666, size:11, font:bold });
      }
    }
    return new Blob([await pdf.save()], { type:'application/pdf' });
  },
} });
const result = {};
try {
  await report.open();
  await report.capturePrint({ title:'Teste do CNO' });
  const displayed = () => [...report.element.querySelectorAll('tbody [data-invoice-id]')];
  result.notes = Object.fromEntries(displayed().map(row => {
    const badge = row.cells[6].querySelector('.nfe-fact:not([hidden])');
    return [row.dataset.invoiceId, badge?.textContent ?? null];
  }));
  result.xmlPending = displayed().every(row => row.textContent.includes('XML pendente'));
  report.close();
  await report.open();
  const filter = report.element.querySelector('[name="cno"]');
  result.filters = {};
  for (const status of ['valid', 'missing', 'conflict']) {
    filter.value = status;
    filter.dispatchEvent(new Event('change'));
    await report.capturePrint({ title:'Teste do CNO' });
    result.filters[status] = displayed().map(row => row.dataset.invoiceId).sort();
  }
} catch (error) {
  result.error = String(error.stack || error);
}
document.documentElement.dataset.layout = JSON.stringify(result);
</script></body></html>
