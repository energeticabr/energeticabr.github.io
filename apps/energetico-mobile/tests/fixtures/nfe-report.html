<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/ui/payment-ledger.css">
<link rel="stylesheet" href="/src/ui/dda-report.css">
<link rel="stylesheet" href="/src/ui/nfe-report.css">
<link rel="stylesheet" href="/src/ui/searchable-filter-selects.css">
</head>
<body>
<main id="app"></main>
<script>
addEventListener('error', event => {
  document.documentElement.dataset.layout = JSON.stringify({ error:event.message });
});
</script>
<script type="module">
import { createChatView } from '/src/ui/chat-view.js';
import { createNfeReportView } from '/src/ui/nfe-report-view.js';
import { decorateReportNavigation } from '/src/ui/report-navigation.js';
import { decorateReportPrint } from '/src/ui/report-print.js';

const view = createChatView(document.querySelector('#app'));
view.render({ sessionStatus:'authenticated', account:{name:'Teste'}, messages:[{ role:'assistant', type:'poll',
  question:'QUAL ÁREA VOCÊ DESEJA ACESSAR?',
  options:[
    ['pending','⏳ PENDÊNCIAS'],['supplies','📦 SUPRIMENTOS'],['financial','💵 FINANCEIRO'],['demands','📋 DEMANDAS'],
    ['human_resources','👥 RECURSOS HUMANOS'],['construction','🏗️ ETAPA OBRA'],['commercial','📈 COMERCIAL'],
  ].map(([name,label])=>({id:'group_'+name,label})),
}] });
const key = '1'.repeat(44);
const common = { STATUS_IMPORTACAO:'XML_COMPLETO', SITUACAO:'AUTORIZADA', VALOR_TOTAL_NOTA:2500 };
let orderId = null;
const report = decorateReportPrint(decorateReportNavigation(createNfeReportView({ data:{
  proposal:{
    async load(){ return {
      fiscal:{ issueDate:'2026-11-08', dueDate:'2026-11-12', total:'2500.00', lines:[
        { number:'1', description:'Descrição fictícia de serviço para conferir a largura do editor e do seletor', unit:'UN', quantity:'2', unitPrice:'1250', adjustment:'0', discount:'0' },
      ] },
      catalog:{
        suppliers:[{ id:'21',label:'Fornecedor Exemplo',branch:'Obra A' }],
        branches:[{ id:'22',label:'Obra A' },{ id:'23',label:'Obra B' }],
        products:[{ id:'24',label:'Serviço de teste com descrição longa para revisão do relatório',unit:'UN',expenseType:'SERVIÇOS' }],
        stages:[{ id:'25',label:'Etapa A',branch:'Obra A' },{ id:'26',label:'Etapa B',branch:'Obra B' }],
        accounts:[{ id:'27',label:'Cartão de teste' }],history:[],
      },
      draft:{ supplierId:'21',branchId:'22',accountId:'',date:'2026-11-08',lines:[
        { number:'1',productId:'24',stageId:'25',quantity:'2',unitPrice:'1250',adjustment:'0',discount:'0',date:'2026-11-08',dueDate:'2026-11-12' },
      ] },
    }; },
  },
  orderLink:{
    async loadOptions(){ return [
      { id:'31', supplier:'Fornecedor diferente', amount:3600 },
      { id:'32', supplier:'Serviços de Engenharia e Manutenção Industrial — Fornecedor Exemplo', amount:2490 },
    ]; },
    async save({ invoiceId, orderId:selected }) { orderId = selected; return { invoiceId, orderId }; },
  },
  async loadSnapshot(){ return { rows:[
    { id:'2', fields:{ ...common, IDPEDIDO:orderId, TIPO_FISCAL:'NFS-e', DATA_EMISSAO:'2026-11-08', NUMERO_NOTA:'205',
      Title:'Serviços de Engenharia e Manutenção Industrial — Fornecedor Exemplo Ltda.',
      STATUS_RETENCOES:'NAO_INFORMADA_XML', DANFE_URL:'https://example.test/danfse.pdf' } },
    { id:'3', fields:{ ...common, TIPO_FISCAL:'NF-e', DATA_EMISSAO:'2026-11-07', NUMERO_NOTA:'14', VALOR_TOTAL_NOTA:98765432.10,
      Title:'Comércio de Materiais Exemplo Ltda.', CNPJ_FORNECEDOR:'00.000.000/0000-00', CHAVE_ACESSO:key,
      XML_URL:'https://example.test/nota.xml', DANFE_URL:'https://example.test/nota.pdf',
      OBSERVACOES_NOTA:'CNO: 90.025.4406/72', STATUS_RETENCOES:'RETENCAO_INFORMADA_XML' } },
  ] }; },
  async downloadDocument(){
    await new Promise(resolve => setTimeout(resolve, 250));
    return new Blob([`<NFe xmlns="http://www.portalfiscal.inf.br/nfe"><infNFe Id="NFe${key}"><emit><CRT>4</CRT></emit></infNFe></NFe>`]);
  },
}, openMediaCollection:async()=>{} }), {action:'open-nfe-report'}), {action:'open-nfe-report'});
view.on('open-nfe-report', () => report.open());
const box = node => {
  const {x,y,right,bottom,width,height} = node.getBoundingClientRect();
  return {x,y,right,bottom,width,height};
};
const mascot = action => document.querySelector(`[data-action="open-${action}"]`);
const provisions = box(mascot('pending-provisions')), orange = box(mascot('commercial-receipts')), sicoob = box(mascot('sicoob-transaction-report')),
  nfe = box(mascot('nfe-report')), dda = box(mascot('dda-report'));
const panel = report.element.querySelector('.nfe-panel');
const hasMei = () => [...panel.querySelectorAll('[data-invoice-id="3"] .nfe-fact strong')]
  .some(field => field.textContent === 'MEI');
if (!new URLSearchParams(location.search).has('home')) {
  mascot('nfe-report').click();
  await new Promise(resolve => {
    const finish = () => { clearTimeout(timer); observer.disconnect(); resolve(); };
    const check = () => { if (hasMei()) finish(); };
    const observer = new MutationObserver(check);
    const timer = setTimeout(finish, 10000);
    observer.observe(panel, { childList:true, subtree:true, characterData:true });
    check();
  });
}
const reportBody = panel.querySelector('.nfe-body');
const pdf = panel.querySelector('[data-invoice-id="2"] button.nfe-pdf');
const supplier = panel.querySelector('[data-invoice-id="2"] .nfe-supplier');
const rotated = report.element.dataset.reportPortrait === 'true';
const amount = panel.querySelector('[data-invoice-id="3"] .nfe-money');
function amountFitsCell() {
  if (!amount) return false;
  const range = document.createRange();
  range.selectNodeContents(amount);
  const cell = box(amount);
  return [...range.getClientRects()].every(rect => rotated ? rect.bottom <= cell.bottom + 1 : rect.right <= cell.right + 1);
}
const isBefore = (first, second, axis) => first && second &&
  (axis === 'inline'
    ? rotated ? box(first).bottom <= box(second).y : box(first).right <= box(second).x
    : rotated ? box(first).x >= box(second).right : box(first).bottom <= box(second).y);
const fiscalControls = [...panel.querySelectorAll('.nfe-filters select')];
const arrows = [...panel.querySelectorAll('.report-navigation-arrow')].filter(arrow =>
  getComputedStyle(arrow).position === 'fixed' && arrow.offsetWidth > 0);
const filtersFit = [...fiscalControls, panel.querySelector('input[name="search"]')].every(control => {
  const rect = box(control);
  return rect.width > 0 && rect.height > 0 && rect.x >= -1 && rect.y >= -1 &&
    rect.right <= innerWidth + 1 && rect.bottom <= innerHeight + 1 && arrows.every(arrow => {
      const edge = box(arrow);
      return rect.right <= edge.x || rect.x >= edge.right || rect.bottom <= edge.y || rect.y >= edge.bottom;
    });
});
const rowIds = () => [...panel.querySelectorAll('tbody tr')].map(row => row.dataset.invoiceId);
const layout = {
  provisions, orange, sicoob, nfe, dda,
  open:!report.element.hidden, rowIds:rowIds(),
  overflow:document.documentElement.scrollWidth > innerWidth,
  reportBodyWidth:reportBody.offsetWidth,
  availableReportWidth:reportBody.parentElement.clientWidth,
  overlayArrows:arrows.length,
  tableScrolls:reportBody.scrollWidth > reportBody.clientWidth,
  amountFits:amountFitsCell(),
  rotated, mei:hasMei(), pdfOnLeft:Boolean(isBefore(pdf,supplier,'inline')),
  metricsAbove:Boolean(isBefore(panel.querySelector('.nfe-metrics'), panel.querySelector('table'), 'block')),
  headerControls:!!panel.querySelector('.nfe-header [data-action="print-report-pdf"]') &&
    !!panel.querySelector('.report-close-bar .report-close-control'),
  pdfIconWidth:pdf?.querySelector('svg')?.getBoundingClientRect().width ?? 0,
  pdfTargetHeight:pdf?.offsetHeight ?? 0,
  filterNames:fiscalControls.map(control => control.name),
  filtersFit,
  taxHeading:panel.querySelector('th:nth-child(6)')?.textContent,
  taxStacked:Boolean(isBefore(...panel.querySelectorAll('[data-invoice-id="3"] .nfe-tax-stack .nfe-fact'), 'block')),
  invalidCno:panel.querySelector('[data-invoice-id="3"] [data-tone="invalid"]')?.textContent,
  pencilHeight:panel.querySelector('.nfe-link-pencil')?.offsetHeight,
};
if (!report.element.hidden) {
  const pencil = panel.querySelector('[data-invoice-id="2"] .nfe-link-pencil');
  const clickBackdrop = (layer, { bounds = layer.getBoundingClientRect(), start = layer, end } = {}) => {
    for (const x of [Math.max(0, bounds.left) + 2, Math.min(innerWidth, bounds.right) - 2]) {
      for (const y of [Math.max(0, bounds.top) + 2, Math.min(innerHeight, bounds.bottom) - 2]) {
        if (document.elementFromPoint(x, y) !== layer) continue;
        const point = { bubbles:true, clientX:x, clientY:y, detail:1 };
        start.dispatchEvent(new PointerEvent('pointerdown', point));
        const release = { ...point, ...end };
        layer.dispatchEvent(new PointerEvent('pointerup', release));
        layer.dispatchEvent(new PointerEvent('click', release));
        return true;
      }
    }
    return false;
  };
  const openPicker = async () => {
    pencil.click();
    await new Promise(resolve => setTimeout(resolve, 0));
    return report.element.querySelector('.dda-provision-dialog');
  };
  let firstPicker = await openPicker();
  firstPicker.querySelector('h2').click();
  const insideKeepsPicker = firstPicker.isConnected;
  firstPicker.querySelector('input[value="32"]').click();
  const dragKeepsPicker = clickBackdrop(firstPicker.parentElement, {start:firstPicker}) && firstPicker.isConnected;
  const firstBounds = box(firstPicker);
  const capturedDragKeepsPicker = clickBackdrop(firstPicker.parentElement, {
    end:{clientX:firstBounds.x + firstBounds.width / 2, clientY:firstBounds.y + firstBounds.height / 2},
  }) && firstPicker.isConnected;
  if (!firstPicker.isConnected) firstPicker = await openPicker();
  const pickerBackdropCloses = clickBackdrop(firstPicker.parentElement) && !firstPicker.isConnected &&
    !report.element.hidden && document.activeElement === pencil && orderId === null;
  if (firstPicker.isConnected) firstPicker.querySelector('.gallery-record-dialog-button').click();
  const picker = await openPicker();
  const pickerRect = box(picker);
  const propose = picker.querySelector('[data-nfe-propose-launch]');
  const proposePosition = isBefore(picker.querySelector('h2'), propose, 'inline');
  propose.click();
  await new Promise(resolve => setTimeout(resolve, 0));
  const proposal = report.element.querySelector('.nfe-proposal-dialog');
  const proposalRect = box(proposal);
  const editor = proposal.querySelector('details');
  editor.open = true;
  editor.dispatchEvent(new Event('toggle'));
  const pickerResults = {};
  const popupBounds = [];
  for (const [name, query, expected, value] of [
    ['supplierId','exemplo','Fornecedor Exemplo','21'],
    ['branchId','obra b','Obra B','23'],
    ['accountId','cartao','Cartão de teste','27'],
    ['productId','servico de teste','Serviço de teste com descrição longa para revisão do relatório','24'],
    ['stageId','etapa b','Etapa B','26'],
  ]) {
    const select = proposal.querySelector('[name="' + name + '"]');
    const field = select.nextElementSibling;
    const trigger = field?.querySelector('.sfs-trigger');
    const popup = field?.querySelector('.sfs-popup');
    const search = field?.querySelector('.sfs-report-search');
    if (!trigger || !popup || !search) { pickerResults[name] = false; continue; }
    trigger.click();
    const popupRect = box(popup);
    popupBounds.push(popupRect);
    search.focus({preventScroll:true});
    const searchRect = box(search);
    const searchIsVisible = document.elementFromPoint(
      searchRect.x + searchRect.width / 2, searchRect.y + searchRect.height / 2) === search;
    const setQuery = value => {
      search.value = value;
      search.dispatchEvent(new Event('input', {bubbles:true}));
    };
    setQuery('sem resultado');
    const empty = !popup.querySelector('.sfs-empty').hidden && !popup.querySelector('.sfs-option');
    setQuery(query);
    const [match, ...otherOptions] = popup.querySelectorAll('.sfs-option');
    const matchRect = match && box(match);
    const canSelect = matchRect && document.elementFromPoint(
      matchRect.x + matchRect.width / 2, matchRect.y + matchRect.height / 2) === match;
    const matching = match?.textContent === expected && !otherOptions.length;
    match?.click();
    pickerResults[name] = select.hidden && searchIsVisible && canSelect && empty && matching && popup.hidden &&
      select.value === value && trigger.value === expected &&
      popupRect.x >= 0 && popupRect.y >= 0 && popupRect.right <= innerWidth && popupRect.bottom <= innerHeight &&
      (rotated ? searchRect.height > searchRect.width : searchRect.width > searchRect.height);
  }
  const changedStage = proposal.querySelector('[name="stageId"]').value;
  const proposalBody = proposal.querySelector('.nfe-proposal-body');
  const proposalScroll = proposalBody.scrollHeight > proposalBody.clientHeight;
  const proposalSubmit = box(proposal.querySelector('[data-nfe-proposal-submit]'));
  document.documentElement.dataset.proposalBounds = JSON.stringify([box(proposal), proposalSubmit, ...popupBounds]);
  const proposalBackdropCloses = clickBackdrop(proposal.parentElement) && !proposal.isConnected;
  if (proposal.isConnected) proposal.querySelector('.nfe-proposal-header button').click();
  const pickerRestored = propose.isConnected && !picker.closest('[inert]') && document.activeElement === propose;
  const selection = picker.querySelector('input[value="32"]');
  selection.click();
  picker.querySelector('.dda-provision-save').click();
  const review = document.querySelector('[data-edit-review]');
  const reviewRect = box(review);
  review.querySelector('h2').click();
  const insideKeepsReview = review.isConnected;
  const reviewBackdropCloses = clickBackdrop(review, {bounds:{left:0, top:0, right:innerWidth, bottom:innerHeight}}) &&
    !review.isConnected && picker.isConnected && selection.checked && orderId === null;
  if (review.isConnected) review.querySelector('[data-edit-review-cancel]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  picker.querySelector('.dda-provision-save').click();
  document.querySelector('[data-edit-review-confirm]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  const fit = rect => rect.width > 0 && rect.height > 0 && rect.x >= -1 && rect.y >= -1
    && rect.right <= innerWidth + 1 && rect.bottom <= innerHeight + 1;
  const linked = panel.querySelector('[data-invoice-id="2"] .nfe-link-linked');
  const linkedPencil = linked.nextElementSibling;
  document.documentElement.dataset.orderLink = JSON.stringify({
    orangePencilBelow:linkedPencil.classList.contains('nfe-link-edit') && isBefore(linked, linkedPencil, 'block'),
    orangeColor:getComputedStyle(linkedPencil).color,
    orangeTargetHeight:linkedPencil.offsetHeight,
    pickerFits:fit(pickerRect),
    proposePosition, proposalFits:fit(proposalRect), proposalSubmitFits:fit(proposalSubmit),
    proposalScroll, changedStage, pickerRestored, pickerResults,
    insideKeepsPicker, dragKeepsPicker, capturedDragKeepsPicker, pickerBackdropCloses, proposalBackdropCloses,
    insideKeepsReview, reviewBackdropCloses,
    reviewFits:fit(reviewRect),
    linked:panel.querySelector('[data-invoice-id="2"] .nfe-link-linked')?.textContent,
    remainingPencils:panel.querySelectorAll('.nfe-link-pencil').length,
  });
  picker.querySelector('.gallery-record-dialog-button').click();
  const regime = panel.querySelector('select[name="regime"]');
  if (regime) {
    regime.value = 'MEI';
    regime.dispatchEvent(new Event('change'));
    document.documentElement.dataset.meiRows = JSON.stringify(rowIds());
    regime.value = '';
    regime.dispatchEvent(new Event('change'));
  }
}
document.documentElement.dataset.layout = JSON.stringify(layout);
document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
