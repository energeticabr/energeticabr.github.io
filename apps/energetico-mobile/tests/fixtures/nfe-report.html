<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/ui/nfe-report.css">
</head>
<body>
<main id="app"></main>
<script type="module">
import { createChatView } from '/src/ui/chat-view.js';
import { createNfeReportView } from '/src/ui/nfe-report-view.js';
import { decorateReportNavigation } from '/src/ui/report-navigation.js';

const view = createChatView(document.querySelector('#app'));
view.render({ sessionStatus:'authenticated', account:{name:'Teste'}, messages:[{ role:'assistant', type:'poll',
  question:'QUAL ÁREA VOCÊ DESEJA ACESSAR?',
  options:[
    ['pending','⏳ PENDÊNCIAS'],['supplies','📦 SUPRIMENTOS'],['financial','💵 FINANCEIRO'],['demands','📋 DEMANDAS'],
    ['human_resources','👥 RECURSOS HUMANOS'],['construction','🏗️ ETAPA OBRA'],['commercial','📈 COMERCIAL'],
  ].map(([name,label])=>({id:'group_'+name,label})),
}] });
const key = '1'.repeat(44);
const common = { STATUS_IMPORTACAO:'XML_COMPLETO', SITUACAO:'AUTORIZADA', VALOR_TOTAL_NOTA:2500 };
const report = decorateReportNavigation(createNfeReportView({ data:{
  async loadSnapshot(){ return { rows:[
    { id:'2', fields:{ ...common, TIPO_FISCAL:'NFS-e', DATA_EMISSAO:'2026-11-08', NUMERO_NOTA:'205',
      Title:'Serviços de Engenharia e Manutenção Industrial — Fornecedor Exemplo Ltda.',
      STATUS_RETENCOES:'NAO_INFORMADA_XML' } },
    { id:'3', fields:{ ...common, TIPO_FISCAL:'NF-e', DATA_EMISSAO:'2026-11-07', NUMERO_NOTA:'14',
      Title:'Comércio de Materiais Exemplo Ltda.', CNPJ_FORNECEDOR:'00.000.000/0000-00', CHAVE_ACESSO:key,
      XML_URL:'https://example.test/nota.xml', DANFE_URL:'https://example.test/nota.pdf',
      OBSERVACOES_NOTA:'CNO 90.025.44060/72', STATUS_RETENCOES:'RETENCAO_INFORMADA_XML' } },
  ] }; },
  async downloadDocument(){
    await new Promise(resolve => setTimeout(resolve, 250));
    return new Blob([`<NFe xmlns="http://www.portalfiscal.inf.br/nfe"><infNFe Id="NFe${key}"><emit><CRT>4</CRT></emit></infNFe></NFe>`]);
  },
}, openMediaCollection:async()=>{} }), {action:'open-nfe-report'});
view.on('open-nfe-report', () => report.open());
const box = node => {
  const {x,y,right,bottom,width,height} = node.getBoundingClientRect();
  return {x,y,right,bottom,width,height};
};
const mascot = action => document.querySelector(`[data-action="open-${action}"]`);
const provisions = box(mascot('pending-provisions')), orange = box(mascot('commercial-receipts')),
  nfe = box(mascot('nfe-report')), dda = box(mascot('dda-report'));
if (!new URLSearchParams(location.search).has('home')) {
  const hydrated = new Promise(resolve => {
    const observer = new MutationObserver(() => {
      const fields = report.element.querySelectorAll('[data-invoice-id="3"] dt');
      const regime = [...fields].find(field => field.textContent === 'Tipo do fornecedor · XML')?.nextElementSibling;
      if (!regime || regime.textContent === 'Consultando…') return;
      observer.disconnect();
      resolve();
    });
    observer.observe(report.element, { subtree:true, childList:true, characterData:true });
  });
  mascot('nfe-report').click();
  await hydrated;
}
const panel = report.element.querySelector('.nfe-panel');
const reportBody = panel.querySelector('.nfe-body');
document.documentElement.dataset.layout = JSON.stringify({
  provisions, orange, nfe, dda,
  open:!report.element.hidden, cardIds:[...panel.querySelectorAll('.nfe-card')].map(card=>card.dataset.invoiceId),
  overflow:reportBody.scrollWidth > reportBody.clientWidth || document.documentElement.scrollWidth > innerWidth,
  mei:panel.textContent.includes('MEI'),
});
document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
