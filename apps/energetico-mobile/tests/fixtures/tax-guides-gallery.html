<!doctype html><html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/registration-gallery.css"><link rel="stylesheet" href="/src/ui/gallery-record-actions.css">
</head><body><main id="app"></main><script type="module">
import { createRegistrationGallery } from '/src/ui/registration-gallery-view.js';
import { createRegistrationGalleryData } from '/src/chat/registration-gallery-data.js';
import { createChatView } from '/src/ui/chat-view.js';
const mode = new URLSearchParams(location.search).get('mode');
if (mode === 'menu') {
  const chat = createChatView(document.querySelector('#app'));
  chat.render({ sessionStatus: 'authenticated', account: { name: 'Prévia fictícia' }, pendingFiles: [], draft: '', messages: [{
    id: 'hr-menu', role: 'assistant', type: 'poll', question: '👥 RECURSOS HUMANOS\nQUAL FLUXO VOCÊ DESEJA INICIAR?',
    options: [{ id: 'attendance', reply: 'action_create_supplier_attendance', label: 'CRIAR PRESENÇA' }, { id: 'contract', reply: 'action_contract', label: 'CONTRATO' }],
  }] });
  await document.fonts.ready;
  const tax = document.querySelector('[data-reply-id="action_hr_tax_guides_gallery"]');
  const payslip = document.querySelector('[data-reply-id="action_hr_gallery_holerite"]');
  tax.scrollIntoView({ block: 'center' });
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const rect = node => { const { x, y, right, width, height } = node.getBoundingClientRect(); return { x, y, right, width, height }; };
  document.documentElement.dataset.layout = JSON.stringify({ tax: rect(tax), payslip: rect(payslip),
    overflow: document.documentElement.scrollWidth > innerWidth + 1,
    taxCount: document.querySelectorAll('[data-reply-id="action_hr_tax_guides_gallery"]').length,
    payslipCount: document.querySelectorAll('[data-reply-id="action_hr_gallery_holerite"]').length });
} else {
const rows = [
  { id: '1', hasAttachments: false, eTag: '"v1"', fields: { TIPO: 'INSS', STATUS: 'PENDENTE', FILIAL: '004 - EDIFÍCIO XAVANTE', COMPETENCIA: '2026-10-20T12:00:00Z', VALOR: null, VENCIMENTO: '2026-11-20T12:00:00Z' } },
  { id: '2', hasAttachments: true, eTag: '"v1"', fields: { TIPO: 'FGTS', STATUS: 'PENDENTE', FILIAL: '004 - EDIFÍCIO XAVANTE', COMPETENCIA: '2026-10-20T12:00:00Z', VALOR: 1407.4, VENCIMENTO: '2026-11-20T12:00:00Z' } },
];
const columns = [
  { name: 'TIPO', displayName: 'Tipo', choice: { choices: ['INSS', 'FGTS'] }, required: true },
  { name: 'FILIAL', displayName: 'Filial', text: {}, required: true },
  { name: 'COMPETENCIA', displayName: 'Data competência', dateTime: { format: 'dateOnly' }, required: true },
  { name: 'VENCIMENTO', displayName: 'Data vencimento', dateTime: { format: 'dateOnly' } },
  { name: 'VALOR', displayName: 'Valor', currency: { locale: 'pt-BR' } },
  { name: 'STATUS', displayName: 'Status', text: {}, required: true },
];
const data = createRegistrationGalleryData({ kind: 'taxGuides', repository: {
  resolveList: async () => ({ status: 'resolved', id: 'guides' }),
  getItemsPage: async () => ({ items: rows, hasMore: false }), getColumns: async () => columns,
  getItem: async (_site, _list, id) => rows.find(row => row.id === id),
  listAttachments: async (_site, _list, id) => id === '2' ? [{ name: 'guia-oficial.pdf' }] : [],
  uploadAttachment: async () => {}, deleteAttachment: async () => {},
} });
const gallery = createRegistrationGallery({ document, kind: 'taxGuides', data });
await gallery.open();
await new Promise(resolve => setTimeout(resolve, 150));
if(mode === 'editor'){
  document.querySelector('[data-registration-row="1"] [data-gallery-action="edit"]').click();
  for(let i=0;i<50 && !document.querySelector('input[type="file"]');i++) await new Promise(resolve=>setTimeout(resolve,20));
}
await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const visible = node => node.getBoundingClientRect().width > 0;
const overflows = [...document.querySelectorAll('.rg-row, .gallery-record-dialog')].filter(visible).some(node => node.scrollWidth > node.clientWidth + 2);
document.documentElement.dataset.layout = JSON.stringify({ overflows, cards: document.querySelectorAll('[data-registration-row]').length,
  pendingStatuses: [...document.querySelectorAll('[data-registration-row]')].filter(node=>node.textContent.includes('PENDENTE')).length,
  pending: document.body.textContent.includes('Anexar guia INSS'), uploaded: document.body.textContent.includes('Guia anexada'),
  fields: [...document.querySelectorAll('.gallery-record-dialog input, .gallery-record-dialog select')].map(node=>({ name: node.name, value: node.value, disabled: node.disabled, readOnly: node.readOnly, type: node.type })),
  fileInput: Boolean(document.querySelector('input[type="file"]')) });
}
</script></body></html>
