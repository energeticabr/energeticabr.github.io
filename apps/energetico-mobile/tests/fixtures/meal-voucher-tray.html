<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:16px Arial,sans-serif}*{box-sizing:border-box}</style></head><body>
<script type="module">
import '../../src/ui/meal-voucher.css';
import '../../src/ui/searchable-filter-selects.css';
import { PDFDocument, StandardFonts } from 'pdf-lib';
import { createMealVoucherData } from '../../src/chat/meal-voucher-data.js';
import { createConversationStore } from '../../src/chat/conversation-store.js';
import { createMealVoucherTray } from '../../src/chat/meal-voucher-tray.js';
import { createMealVoucherView } from '../../src/ui/meal-voucher-view.js';
try {
  const names={FORNECEDORES:['CADASTRO','STATUS','EMPREITEIRO','FILIAL','PROFISSAO'],CADASTROCONTA:['CONTA'],LANCAMENTOOBRA:['ETAPA','FILIAL'],
    IDFOLHA:['MESREFERENCIA','FORNECEDOR'],FOLHAPGTO:['Title','FORNECEDOR','TIPOPGTO','VALORUNITARIO','QTD','DATA','IDFOLHA','IDLANCAMENTO'],
    NOTASPENDENTES:['Title','FILIAL','FORNECEDOR','VALORTOTAL','DATA PEDIDO','STATUS','OBS','FORMAPGTO','NOTA FISCAL','VALECONTROLE'],
    LANCAMENTOS:['__PowerAppsId__','AGRUPAR','FILIAL','TIPO TRANSAÇÃO','DATA','DATA PGTO PREVISTO','DATA PGTO EFETUADO','FORNECEDOR','PRODUTO','ETAPA','QUANTIDADE','VALOR UNITÁRIO','CONTA','FRETE','OBS','IDFOLHA']};
  const columns=Object.fromEntries(Object.entries(names).map(([list,fields])=>[list,fields.map(name=>({name,displayName:name,...(/DATA/.test(name)?{dateTime:{}}:{text:{}})}))]));
  Object.assign(columns.NOTASPENDENTES.find(c=>c.name==='VALECONTROLE'),{hidden:true,text:{allowMultipleLines:true,textType:'plain',appendChangesToExistingText:false}});
  Object.assign(columns.LANCAMENTOS.find(c=>c.name==='IDFOLHA'),{text:undefined,number:{decimalPlaces:'none'},required:false});
  const people=['ANA SILVA (TESTE)','BRUNO SOUZA (TESTE)','CARLA LIMA (TESTE)'];
  const rows={FORNECEDORES:people.map((name,i)=>({id:String(i+1),fields:{CADASTRO:name,STATUS:'ATIVO',EMPREITEIRO:'SIM',FILIAL:'004 - OBRA DE TESTE',PROFISSAO:'PEDREIRO'}})),
    CADASTROCONTA:[{id:'8',fields:{CONTA:'CAIXA DE TESTE'}}],LANCAMENTOOBRA:[{id:'7',fields:{ETAPA:'FUNDAÇÃO',FILIAL:'004 - OBRA DE TESTE'}}],
    IDFOLHA:people.map((name,i)=>({id:String(i+11),fields:{MESREFERENCIA:'10/2026',FORNECEDOR:name}})),NOTASPENDENTES:[],LANCAMENTOS:[],FOLHAPGTO:[]};
  const savedFiles=new Map(),deliveries=[];let failLaunch=true,lostOrder=true;
  const repository={resolveList:async(_site,aliases)=>({status:'resolved',id:aliases[0]}),getColumns:async(_site,list)=>columns[list],
    getItemsPage:async(_site,list)=>({items:structuredClone(rows[list]),hasMore:false}),getItem:async(_site,list,id)=>structuredClone(rows[list].find(row=>row.id===String(id))),
    createItem:async(_site,list,fields)=>{const row={id:String(rows[list].length+1),fields:structuredClone(fields),eTag:'"1"'};rows[list].push(row);return structuredClone(row);},
    updateItem:async(_site,list,id,fields,options)=>{const row=rows[list].find(row=>row.id===String(id));if(options.eTag!==row.eTag)throw new Error('ETag inválido');Object.assign(row.fields,fields);return structuredClone(row);},
    listAttachments:async(_site,list,id)=>[...savedFiles].filter(([key])=>key.startsWith(`${list}:${id}:`)).map(([key,bytes])=>({name:key.slice(`${list}:${id}:`.length),size:bytes.byteLength})),
    downloadAttachment:async(_site,list,id,name)=>savedFiles.get(`${list}:${id}:${name}`).slice().buffer,
    uploadAttachment:async(_site,list,id,file)=>{if(list==='LANCAMENTOS'&&failLaunch){failLaunch=false;throw new Error('Falha de rede simulada após salvar pedido e lançamentos');}
      savedFiles.set(`${list}:${id}:${file.name}`,new Uint8Array(await file.arrayBuffer()));deliveries.push({list,id:String(id),name:file.name});
      if(list==='NOTASPENDENTES'&&lostOrder){lostOrder=false;throw new Error('Resposta de upload perdida (simulada)');}},
  };
  const store=createConversationStore(),media=new Map();let next=0,previews=0;
  async function pdf(name,pages){const pdf=await PDFDocument.create(),font=await pdf.embedFont(StandardFonts.Helvetica);for(let i=0;i<pages;i++){const p=pdf.addPage();p.drawText(`DOCUMENTO FICTICIO - PAGINA ${i+1}`,{x:35,y:780,font,size:18});}return new File([await pdf.save()],name,{type:'application/pdf',lastModified:0});}
  async function add(file){const id=`file-${++next}`;media.set(id,file);store.syncAttachments([...store.getState().attachments,{id,fileName:file.name,size:file.size,mimeType:file.type,mediaUrl:`/fixture/${id}`}]);}
  const tray=createMealVoucherTray({store,assertSession:()=>{},pickFiles:()=>add(media.get('extra')),capture:()=>add(media.get('scan')),
    open:async id=>{if((await PDFDocument.load(await media.get(id).arrayBuffer())).getPageCount()<1)throw new Error('PDF inválido');previews++;},
    remove:async id=>store.removeAttachment(id),load:async item=>media.get(item.id),deleteAttachment:async()=>{}});
  media.set('extra',await pdf('Comprovante_teste.pdf',1));media.set('scan',await pdf('Escaneado_teste.pdf',2));
  const data=createMealVoucherData({repository});let view=createMealVoucherView({data,attachmentTray:tray,sessionKey:'tray-browser'});await view.open();
  const wait=async selector=>{for(let i=0;i<250;i++){if(document.querySelector(selector))return;await new Promise(r=>setTimeout(r,5));}throw new Error(`Não abriu ${selector}`);};
  const type=(name,value)=>{const input=document.querySelector(`[name="${name}"]`);input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));};
  for(const id of ['1','2','3']){const input=document.querySelector(`[data-meal-value="${id}"]`);input.value='45';input.dispatchEvent(new Event('input',{bubbles:true}));}
  document.querySelector('[data-meal-next]').click();await wait('[data-meal-order-new]');document.querySelector('[data-meal-order-new]').click();
  for(const [name,value] of [['meal-date','2026-10-15'],['meal-due-date','2026-10-15'],['meal-payment-date','2026-10-21'],['meal-reference-month','2026-10']])type(name,value);
  for(const [name,value] of [['meal-account','8'],['meal-stage','7']]){const input=document.querySelector(`[name="${name}"]`);input.value=value;input.dispatchEvent(new Event('change',{bubbles:true}));}
  document.querySelector('[data-meal-next]').click();await wait('[name="meal-obs"]');type('meal-obs','PAGAMENTO VALE REFEIÇÃO - TESTE SEM GRAVAÇÃO REAL');
  const clickTray=async selector=>{document.querySelector(selector).click();for(let i=0;i<100;i++){await new Promise(r=>setTimeout(r,5));if(!document.querySelector('[data-meal-tray-pick]').disabled)return;}throw new Error('Ação da bandeja não terminou');};
  await clickTray('[data-meal-tray-pick]');await clickTray('[data-meal-tray-capture]');await clickTray('[data-meal-tray-open]');
  const result={noPicker:!document.querySelector('input[type="file"]'),trayFiles:store.getState().attachments.length,previews,
    noEarlyWrites:rows.NOTASPENDENTES.length===0,noOverflow:true,recovered:false};
  document.querySelector('[data-meal-next]').click();await wait('[data-meal-confirm]');
  result.noOverflow=[...document.querySelectorAll('.meal-voucher-content,.meal-voucher-tray,.meal-voucher-footer')].every(n=>n.getBoundingClientRect().right<=innerWidth+1)
    && document.querySelector('.meal-voucher-page').scrollWidth<=innerWidth+1;
  if(new URL(location.href).searchParams.get('phase')==='review'){document.documentElement.dataset.layout=JSON.stringify(result);}
  else {
    document.querySelector('[data-meal-confirm]').click();for(let i=0;i<250;i++){await new Promise(r=>setTimeout(r,5));if(!document.querySelector('[role="alert"]').hidden)break;}
    if(!document.querySelector('[role="alert"]').textContent.includes('Falha de rede simulada'))throw new Error('Não reproduziu a falha parcial');
    if(store.getState().attachments.length!==2||rows.NOTASPENDENTES.length!==1||rows.LANCAMENTOS.length!==3)throw new Error('Perdeu arquivos ou registros parciais');
    view.destroy();view=createMealVoucherView({data:createMealVoucherData({repository}),attachmentTray:tray,sessionKey:'tray-browser'});await view.open();
    document.querySelector('[data-meal-next]').click();await wait('[data-meal-confirm]');document.querySelector('[data-meal-confirm]').click();await wait('[data-meal-done]');
    result.recovered=true;result.orders=rows.NOTASPENDENTES.length;result.launches=rows.LANCAMENTOS.length;result.payroll=rows.FOLHAPGTO.length;
    result.cleanObs=rows.NOTASPENDENTES[0].fields.OBS==='PAGAMENTO VALE REFEIÇÃO - TESTE SEM GRAVAÇÃO REAL';
    result.targets=[...new Set(deliveries.map(d=>`${d.list}:${d.id}`))];result.uploads=deliveries.length;result.remaining=store.getState().attachments.length;
    result.noOverflow&&=document.querySelector('.meal-voucher-page').scrollWidth<=innerWidth+1;document.documentElement.dataset.layout=JSON.stringify(result);
  }
}catch(error){document.documentElement.dataset.layout=JSON.stringify({error:error.stack});}
</script></body></html>
