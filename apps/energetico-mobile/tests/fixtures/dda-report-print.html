<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/ui/payment-ledger.css"><link rel="stylesheet" href="/src/ui/dda-report.css"><link rel="stylesheet" href="/src/web/attachment-preview.css"></head><body><main id="app"></main><script type="module">
import {createDdaReportView} from '/src/ui/dda-report-view.js';
import {decorateReportPrint} from '/src/ui/report-print.js';
import {getDocument,GlobalWorkerOptions,OPS} from 'pdfjs-dist/legacy/build/pdf.mjs';
import workerUrl from 'pdfjs-dist/legacy/build/pdf.worker.min.mjs?url';
import {createAttachmentPreview} from '/src/web/attachment-preview.js';
GlobalWorkerOptions.workerSrc=workerUrl;
let pdfLayout, pdfError;
async function inspectPdf(blob) {
 const bytes=new Uint8Array(await blob.arrayBuffer());
 if(new URLSearchParams(location.search).get('sample')==='true') {
  const sample=document.createElement('template');sample.id='pdf-sample';sample.innerHTML=bytes.toBase64();document.body.append(sample);
 }
 const task=getDocument({data:bytes}), pdf=await task.promise;
 try {
  const page=await pdf.getPage(1), {items}=await page.getTextContent(), operators=await page.getOperatorList();
  const measure=label=>items.find(item=>item.str.startsWith(label))?.transform.slice(4);
  return {cards:['DDAs encontrados','Valor nominal total','Vencidos no filtro','Vencem hoje','Qtd DDA vencendo','Valor DDA vencendo em','Valor DDA vencendo hoje'].map(measure),
    fonts:items.filter(item=>item.str==='23'||item.str==='R$ 1.610,00').map(item=>item.height),
    fills:[...new Set(operators.argsArray.filter((_,i)=>operators.fnArray[i]===OPS.setFillRGBColor).map(args=>args[0]))],
    actions:items.some(item=>item.str==='AÇÕES'), pages:pdf.numPages};
 } finally {await task.destroy();}
}
const preview=createAttachmentPreview({canEmbedPdf:()=>false,exportMedia:async()=>{}});
const count=Number(new URLSearchParams(location.search).get('count'))||23;
const rows=Array.from({length:count},(_,i)=>({id:String(i+1),fields:{FORNECEDOR:'FORNECEDOR FICTÍCIO '+i,VENCIMENTO:'2026-11-20',EMISSAO:'2026-11-02',DESCRITIVOPROVIS_x00c3_O:'52',VALOR:70,SITUACAO:'Em aberto',DOCUMENTO:'EX-'+i,BANCO:'BANCO EXEMPLO',CNPJ_FORNECEDOR:'00111111000122'}}));
const report=decorateReportPrint(createDdaReportView({document,now:()=>new Date('2026-11-19T15:00:00Z'),data:{loadSnapshot:async()=>({rows})}}),{action:'open-dda-report',previewMedia(pending,...args){
 pending.then(inspectPdf).then(layout=>{pdfLayout=layout;},error=>{pdfError=String(error);});
 return preview.open(pending,...args);
},closePreview:preview.close});
await report.open();document.querySelector('[data-action=print-report-pdf]').click();
const start=performance.now();
const timer=setInterval(()=>{
 const status=document.querySelector('.attachment-preview-status'),canvas=document.querySelector('.attachment-preview-content canvas');
 if((performance.now()-start>4000&&canvas&&(pdfLayout||pdfError)&&!status?.querySelector('.app-loading'))||performance.now()-start>12000){clearInterval(timer);const result={pdfLayout,pdfError,canvas:Boolean(canvas),loading:Boolean(status?.querySelector('.app-loading')),status:status?.textContent,elapsed:performance.now()-start};
  if(new URLSearchParams(location.search).has('close')){document.querySelector('.attachment-preview-close').click();result.returned=!report.element.hidden&&!document.querySelector('.attachment-preview-dialog').open&&document.querySelector('[name=status]').value==='Em aberto';}
  document.documentElement.dataset.layout=JSON.stringify(result);
 }
},100);
</script></body></html>
