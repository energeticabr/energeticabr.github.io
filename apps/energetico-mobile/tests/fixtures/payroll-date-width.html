<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data da folha de pagamento</title>
  <link rel="stylesheet" href="../../src/styles.css">
  <link rel="stylesheet" href="../../src/ui/supplier-payroll.css">
  <link rel="stylesheet" href="../../src/ui/searchable-filter-selects.css">
</head>
<body>
  <script type="module">
    import { createSupplierPayrollView } from '../../src/ui/supplier-payroll-view.js';
    if (new URLSearchParams(location.search).has('pwa')) {
      document.querySelectorAll('link[rel=stylesheet]').forEach(link => link.remove());
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/tests/payroll-date-built.css';
      await new Promise((resolve, reject) => {
        link.onload = resolve; link.onerror = reject; document.head.append(link);
      });
    }
    const calls = [];
    const view = createSupplierPayrollView({ documentRef: document, data: {
      async loadSuppliers() {
        calls.push('suppliers');
        return [{ id: '1', label: 'FORNECEDOR DE SERVIÇOS DE ESCORAMENTO E ARMAÇÕES', branch: 'OBRA DE TESTE' }];
      },
      async loadProducts() { return [{ id: '2', label: 'PRODUTO TESTE', recommended: true }]; },
      async loadAccounts() { return [{ id: '3', label: 'CONTA TESTE' }]; },
      async loadStages() { return [{ id: '4', label: 'ETAPA TESTE' }]; },
      async loadSheets() { return [{ id: '5', label: '10/2026' }]; },
      async post() { throw new Error('Esta fixture nunca deve gravar pagamentos.'); },
    } });
    await view.open();
    const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const bounds = element => {
      const {left, right, top, bottom, width, height} = element.getBoundingClientRect();
      return {left, right, top, bottom, width, height};
    };
    const measure = () => {
      const date = document.querySelector('input[name=date]');
      return {
        input: bounds(date), content: bounds(document.querySelector('.supplier-payroll-content')),
        bodyWidth: document.querySelector('.supplier-payroll-body').clientWidth,
        bodyScrollWidth: document.querySelector('.supplier-payroll-body').scrollWidth,
        viewportWidth: innerWidth, fontSize: parseFloat(getComputedStyle(date).fontSize),
        type: date.type, value: date.value,
        continueButton: bounds(document.querySelector('[data-payroll-next]')),
      };
    };
    await frame();
    const empty = measure();
    const date = document.querySelector('input[name=date]');
    date.value = '2026-10-08';
    date.dispatchEvent(new Event('input', {bubbles:true}));
    await frame();
    const filled = measure();
    if (!new URLSearchParams(location.search).has('preview')) {
      document.querySelector('[data-payroll-next]').click();
      while (!document.querySelector('[data-payroll-expand]')) await frame();
      const advanced = document.querySelector('.supplier-payroll-question').textContent;
      const card = document.querySelector('[data-payroll-supplier]');
      const checkbox = card.querySelector('[data-payroll-select]');
      const panel = document.getElementById(card.querySelector('[data-payroll-expand]').getAttribute('aria-controls'));
      const color = () => getComputedStyle(card).backgroundColor;
      const stage = document.querySelector('[name=batch-stage]');
      const period = document.querySelector('[name=batch-period]');
      while (stage.disabled || period.disabled) await frame();
      for (const [control, value] of [[stage, 'ETAPA TESTE'], [period, '2026-10']]) {
        control.value = value;
        control.dispatchEvent(new Event('change', {bubbles:true}));
      }
      const initial = color();
      checkbox.click();
      while (!panel.querySelector('[name=product]')) await frame();
      const incomplete = color();
      const defaults = ['product', 'stage', 'sheet'].map(name => panel.querySelector('[name="' + name + '"]').value);
      for (const [name, value] of [['salary-value', '101,25'], ['salary-account', '3']]) {
        const control = panel.querySelector('[name="' + name + '"]');
        control.value = value;
        control.dispatchEvent(new Event(control.tagName === 'SELECT' ? 'change' : 'input', {bubbles:true}));
      }
      await frame();
      const body = card.closest('.supplier-payroll-body');
      const batch = {
        initial, incomplete, ready: color(),
        panelVisible: !panel.hidden,
        overflow: body.scrollWidth - body.clientWidth,
        checkbox: bounds(checkbox.closest('label')),
        toggle: bounds(card.querySelector('[data-payroll-expand]')),
        defaults,
        defaultControls: [stage, period].map(control => bounds(control.nextElementSibling.querySelector('.sfs-trigger'))),
        post: bounds(document.querySelector('[data-payroll-post]')),
        amount: card.querySelector('[data-payroll-total]').textContent,
      };
      checkbox.click();
      batch.unchecked = color();
      document.querySelector('[data-payroll-header-back]').click();
      await frame();
      document.documentElement.dataset.layout = JSON.stringify({
        empty, filled, advanced, batch, restored: measure(), calls,
      });
    }
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
