<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Validação horizontal dos relatórios</title></head><body><main id="app"><button id="open">Abrir relatório</button><output id="reads">0 consultas</output></main><script type="module">
import '../../src/ui/payment-ledger.css';
import '../../src/ui/contractor-control-report.css';
import '../../src/ui/attendance-summary.css';
import '../../src/ui/stage-gantt.css';
import '../../src/ui/searchable-filter-selects.css';
import '../../src/styles.css';
import {createPaymentLedgerView} from '../../src/ui/payment-ledger-view.js';
import {createContractorControlReportView} from '../../src/ui/contractor-control-report-view.js';
import {createAttendanceSummaryReportView} from '../../src/ui/attendance-summary-view.js';
import {createStageGanttView} from '../../src/ui/stage-gantt-view.js';
import {decorateReportNavigation} from '../../src/ui/report-navigation.js';
let reads=0;
if(new URL(location.href).searchParams.has('gantt')) {
 const gantt=createStageGanttView({document,data:{async loadSnapshot(){return {complete:true,activities:[
  {id:1,branch:'004 - EDIFÍCIO XAVANTE',stage:'TERRAPLANAGEM',activity:'EXECUÇÃO PAREDES ARRIMO',property:'TODOS',supplier:'EDGAR NELSON DA SILVA',status:'ATIVIDADE FINALIZADA',executionDate:'2026-06-19',plannedDate:'2026-09-14'},
  {id:2,branch:'004 - EDIFÍCIO XAVANTE',stage:'TERRAPLANAGEM',activity:'IMPERMEABILIZAÇÃO ARRIMO',property:'TODOS',supplier:'EDGAR NELSON DA SILVA',status:'ATIVIDADE INICIADA',executionDate:'2026-08-27',plannedDate:''},
 ],
  launches:[{id:1,branch:'004 - EDIFÍCIO XAVANTE',stage:'TERRAPLANAGEM',type:'ATIVIDADE COMUM',status:'INICIADO',startDate:'2026-09-16'}]};}}});
 await gantt.open();
 gantt.element.querySelector('.gantt-toggle').click();
 const root=gantt.element,dialog=root.querySelector('[role=dialog]'),scroll=root.querySelector('.gantt-scroll');
 const portrait=root.dataset.reportPortrait==='true';
 const panel=dialog.getBoundingClientRect(),timeline=scroll.getBoundingClientRect();
 const button=root.querySelector('.report-close-control'),close=button.getBoundingClientRect();
 const closeReachable=document.elementFromPoint(close.x+close.width/2,close.y+close.height/2)?.closest('button')===button;
 const transform=getComputedStyle(root).transform;
 const clusters=[...root.querySelectorAll('.gantt-cluster')];
 const clusterColors=Object.fromEntries(['start','end','responsible'].map(kind=>[kind,getComputedStyle(root.querySelector('.gantt-cluster--'+kind)).backgroundColor]));
 const labelWidth=root.querySelector('.gantt-label').offsetWidth;
 const clustersFit=clusters.every(node=>node.scrollWidth<=node.clientWidth+1);
 const noTodos=!root.querySelector('.gantt-row--activity').textContent.includes('TODOS');
 if(!new URL(location.href).searchParams.has('visual'))button.click();
 document.documentElement.dataset.layout=JSON.stringify({
  portrait,rotated:transform==='matrix(0, 1, -1, 0, 0, 0)',height:portrait?panel.width:panel.height,
  bottomInset:portrait?timeline.left-panel.left:panel.bottom-timeline.bottom,closeReachable,closed:root.hidden,
  clusterColors,labelWidth,clustersFit,noTodos,
 });
}
const navigated=[];
const launches=Array.from({length:new URL(location.href).searchParams.has('visual')?12:440},(_,index)=>({id:String(index+1),paymentDate:'2026-10-01',supplier:'Fornecedor '+(index%3+1),branch:'004 - EDIFÍCIO XAVANTE',product:'Produto',order:String(index+1),account:'Energética - Caixa',unit:10,quantity:1,freight:0,total:10}));
const contractorMode=new URL(location.href).searchParams.has('contractor');
const attendanceMode=new URL(location.href).searchParams.has('attendance');
const attendanceBranch='004 - XAVANTE';
const stages=[
 {id:'18',stage:'ALVENARIA E ESTRUTURAS',activity:'EXECUÇÃO DE PAREDES',property:'TORRE A',branch:attendanceBranch,status:'ATIVIDADE INICIADA'},
 {id:'32',stage:'FUNDAÇÃO',activity:'ARMAÇÃO DE BLOCOS',property:'TORRE B',branch:attendanceBranch,status:'ATIVIDADE INICIADA'}
];
const attendance={complete:true,stages,
 presences:[{id:'1',date:'2026-10-14',branch:attendanceBranch,supplier:'Alfa Construções e Serviços de Alvenaria',profession:'PEDREIRO',presence:'PENDENTE'}],
 suppliers:[
  {id:'1',name:'Alfa Construções e Serviços de Alvenaria',profession:'PEDREIRO',stage:'18',activity:'ASSENTAMENTO DE BLOCOS'},
  {id:'2',name:'Beta',profession:'SERVENTE DE PEDREIRO',stage:'18',activity:'ASSENTAMENTO DE BLOCOS'},
  {id:'3',name:'Gama',profession:'SERVENTE DE PEDREIRO',stage:'32',activity:'ARMAÇÃO DE BLOCOS'}
 ].map(row=>({...row,branch:attendanceBranch,status:'ATIVO'}))
};
const attendanceData={
 async loadSnapshot(){reads++;return attendance;},
 async loadSupplierEditor(id){return {supplier:attendance.suppliers.find(row=>row.id===id),stages,
  activities:[{stage:stages[0].stage,activity:'ASSENTAMENTO DE BLOCOS'},{stage:stages[1].stage,activity:'ARMAÇÃO DE BLOCOS'}]};},
 async saveSupplierLinks(editor,links){return {...editor.supplier,...links};}
};
const view=decorateReportNavigation(attendanceMode?createAttendanceSummaryReportView({document,data:attendanceData,now:()=>new Date('2026-10-14T12:00:00Z')}):contractorMode?createContractorControlReportView({document,data:{async loadOverview(){reads++;return {rows:[],documentStatuses:{}};},async loadDetails(){return {};}}}):createPaymentLedgerView({document,data:{async loadPaymentsSnapshot(){document.querySelector('#reads').textContent=++reads+' consultas';return {launches};}}}),{action:attendanceMode?'open-attendance-summary':contractorMode?'open-contractor-control-report':'open-payment-ledger',onNavigate:target=>{navigated.push(target);return false;}});
document.querySelector('#open').addEventListener('click',()=>view.open());
if(new URL(location.href).searchParams.has('safearea')) {
 await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
 const bounds=element=>{const r=element.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom};};
 const dialog=bounds(view.element.querySelector('[role=dialog]'));
 const controls=[...view.element.querySelectorAll('input,button')].filter(element=>!element.closest('[hidden]')&&element.getBoundingClientRect().width>1&&element.getBoundingClientRect().height>1).map(bounds);
 view.element.querySelector('.sfs-trigger').click();
 await new Promise(resolve=>requestAnimationFrame(resolve));
 document.documentElement.dataset.layout=JSON.stringify({dialog,controls,popup:bounds(view.element.querySelector('.sfs-popup')),reads});
}
if(new URL(location.href).searchParams.has('controls')) {
 await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
 const root=view.element,panel=root.querySelector('[role=dialog]'),rect=panel.getBoundingClientRect(),transform=getComputedStyle(root).transform,panelSize={width:panel.offsetWidth,height:panel.offsetHeight};
 const arrows=[...root.querySelectorAll('.report-navigation-arrow')].map(button=>{const r=button.getBoundingClientRect();return {direction:button.dataset.direction,width:r.width,height:r.height,visible:getComputedStyle(button.closest('nav')).display!=='none',hit:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest('button')===button};});
 for(const button of root.querySelectorAll('.report-navigation-arrow')){button.click();await new Promise(resolve=>requestAnimationFrame(resolve));}
 const close=root.querySelector('.report-close-control');close.click();const closedByX=root.hidden;
 await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
 const outside=document.elementFromPoint(root.dataset.reportPortrait==='true'?innerWidth/2:1,root.dataset.reportPortrait==='true'?rect.top/2:innerHeight/2),outsideIsBackdrop=outside===root;outside.click();
 document.documentElement.dataset.layout=JSON.stringify({portrait:root.dataset.reportPortrait==='true',transform,panelSize,gaps:{left:rect.left,right:innerWidth-rect.right,top:rect.top,bottom:innerHeight-rect.bottom},arrows,navigated,closedByX,closedOutside:root.hidden,outsideIsBackdrop});
}
if(contractorMode) {
 await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
 const root=view.element,filters=root.querySelector('.ccr-filters'),rects=[...filters.querySelectorAll('.ccr-filter')].map(element=>element.getBoundingClientRect()),portrait=root.dataset.reportPortrait==='true';
 document.documentElement.dataset.layout=JSON.stringify({portrait,columns:getComputedStyle(filters).gridTemplateColumns.split(' ').length,sameRow:rects.every(rect=>rect.width>1&&rect.height>1&&Math.abs((portrait?rect.left:rect.bottom)-(portrait?rects[0].left:rects[0].bottom))<1),reads,closeCount:root.querySelectorAll('.report-close-control').length});
}
if(attendanceMode&&new URL(location.href).searchParams.has('edit')) {
 await view.open();
 const root=view.element,content=root.querySelector('.as-content');
 const card=id=>root.querySelector(`[data-supplier-edit="${id}"]`).closest('.as-provider');
 const color=id=>getComputedStyle(card(id)).backgroundColor;
 const sharesColor=color(1)===color(2)&&color(1)!==color(3);
 card(1).querySelector('button').click();
 await new Promise(resolve=>requestAnimationFrame(resolve));
 const editor=card(1).querySelector('form');
 const fits=content.scrollWidth<=content.clientWidth+1&&editor.scrollWidth<=editor.clientWidth+1;
 const portrait=root.dataset.reportPortrait==='true';
 const pick=(name,label,expected)=>{
  const select=editor.querySelector(`[data-attendance-link=${name}]`);
  select.nextElementSibling?.querySelector('.sfs-arrow')?.click();
  const popup=root.querySelector('.sfs-popup-layer > .sfs-popup:not([hidden])');
  if(!popup)return {custom:false};
  const option=[...popup.querySelectorAll('.sfs-option')].find(item=>item.textContent.includes(label));
  if(!option)return {custom:true,missing:label};
  const box=popup.getBoundingClientRect(),row=option.getBoundingClientRect();
  const safeArea=getComputedStyle(popup.parentElement.querySelector('.sfs-backdrop'));
  const inside=box.left>=parseFloat(safeArea.paddingLeft)&&box.top>=parseFloat(safeArea.paddingTop)
   &&box.right<=innerWidth-parseFloat(safeArea.paddingRight)&&box.bottom<=innerHeight-parseFloat(safeArea.paddingBottom);
  const aligned=Math.abs(box.width-(portrait?popup.offsetHeight:popup.offsetWidth))<1
   &&Math.abs(box.height-(portrait?popup.offsetWidth:popup.offsetHeight))<1;
  const target=document.elementFromPoint(row.x+row.width/2,row.y+row.height/2);
  const hit=target?.closest('.sfs-option')===option;
  if(hit)target.click();
  return {custom:select.hidden&&getComputedStyle(popup).position==='fixed',hit,aligned,inside,selected:select.value===expected};
 };
 const stage=pick('stage','FUNDAÇÃO','32');
 const activity=pick('activity','ARMAÇÃO DE BLOCOS','ARMAÇÃO DE BLOCOS');
 editor.requestSubmit();
 await new Promise(resolve=>requestAnimationFrame(resolve));
 document.documentElement.dataset.layout=JSON.stringify({sharesColor,fits,updated:color(1)===color(3)&&color(1)!==color(2),
  editFocus:document.activeElement?.dataset.supplierEdit,daily:root.querySelector('.as-daily').textContent.includes('Alfa'),
  stage,activity});
} else if(attendanceMode) {
 await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
 const root=view.element,panel=root.querySelector('[role=dialog]'),rect=panel.getBoundingClientRect();
 const bounds={left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom};
 const hasSummary=!!root.querySelector('[data-metric=pending]');
 let topIsBackdrop=false,bottomIsBackdrop=false,closedTop=false,closedBottom=false;
 if(root.dataset.reportPortrait==='true') {
  const topTarget=document.elementFromPoint(innerWidth/2,rect.top/2);topIsBackdrop=topTarget===root;
  topTarget.click();closedTop=root.hidden;
  await view.open();await new Promise(resolve=>requestAnimationFrame(resolve));
  const bottomTap=(rect.bottom+innerHeight)/2,bottomTarget=document.elementFromPoint(innerWidth/2,bottomTap);bottomIsBackdrop=bottomTarget===root;
  bottomTarget.click();closedBottom=root.hidden;
 }
 document.documentElement.dataset.layout=JSON.stringify({portrait:root.dataset.reportPortrait==='true',bounds,hasSummary,topIsBackdrop,bottomIsBackdrop,closedTop,closedBottom});
}
</script></body></html>
