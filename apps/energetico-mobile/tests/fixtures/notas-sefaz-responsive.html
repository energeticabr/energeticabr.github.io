<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia fictícia — NF-e SEFAZ</title></head><body><main id="app"></main><script type="module">
import '../../src/styles.css';
import '../../src/ui/registration-gallery.css';
import '../../src/ui/searchable-filter-selects.css';
import { createRegistrationGallery } from '../../src/ui/registration-gallery-view.js';
import { renderChatMarkup } from '../../src/ui/chat-view.js';
const mode = new URLSearchParams(location.search).get('mode');
if (mode === 'menu') {
  document.querySelector('#app').innerHTML = renderChatMarkup({ sessionStatus: 'authenticated', account: { name: 'PRÉVIA FICTÍCIA' }, messages: [{
    id: 'supplies', role: 'assistant', type: 'poll', question: 'SUPRIMENTOS\nQUAL FLUXO VOCÊ DESEJA INICIAR?',
    options: [{ id: 'new_document', reply: 'new_document', label: 'LANÇAMENTOS' }, { id: 'payment', label: 'PROVISÃO' },

  const fields = { Title: 'FORNECEDOR FICTÍCIO DE MATERIAIS PARA CONSTRUÇÃO LTDA', CHAVE_ACESSO: '12345678901234567890123456789012345678901234',

    INFORMACOES_FISCO: 'Informação fiscal fictícia, conforme o XML.\nSegunda linha preservada.',

    VALOR_PRODUTOS: 1200, FRETE: 50.5, SEGURO: 0, OUTRAS_DESPESAS: 0, ICMS: 100, IPI: 0, PROTOCOLO: '000000000000000', MODELO: '55', STATUS_DANFE: 'Disponível',
    XML_URL: 'https://energeticaltda.sharepoint.com/sites/energetica/Documentos/nota-ficticia.xml',
    ULTIMO_DOCUMENTO_URL: 'https://energeticaltda.sharepoint.com/sites/energetica/Documentos/nota-ficticia.xml',
    DANFE_URL: 'https://energeticaltda.sharepoint.com/sites/energetica/Documentos/danfe-ficticio.pdf' };
  if (new URLSearchParams(location.search).has('withholding')) Object.assign(fields, {STATUS_IMPORTACAO:'XML_COMPLETO', STATUS_RETENCOES:'RETENCAO_INFORMADA_XML', PIS_RETIDO:6.5, COFINS_RETIDA:30, CSLL_RETIDA:10, IRRF_RETIDO:15, INSS_RETIDO:110, ISS_RETIDO:25});

  await createRegistrationGallery({ document, kind: 'notas_fiscais_sefaz', onHome() {}, data: { async loadSnapshot() { return { rows: [
    { id: '4', fields },
    { id: '5', fields: { Title: 'RESUMO FICTÍCIO — DOCUMENTOS PENDENTES', NUMERO_NOTA: '555', DATA_EMISSAO: '2026-10-28',
      VALOR_TOTAL_NOTA: 340, STATUS_IMPORTACAO: 'Resumo; XML pendente', CHAVE_ACESSO: '9'.repeat(44) } },
  ] }; } } }).open();
}
if (new URLSearchParams(location.search).has('pwa')) {
  document.querySelectorAll('style,link[rel=stylesheet]').forEach(node => node.remove());
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/__notas-built.css';
  await new Promise((resolve, reject) => { css.onload = resolve; css.onerror = reject; document.head.append(css); });
}
await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

const initiallyHiddenFields = fiscalSections.every(section => [...section.querySelectorAll('dd')].every(field => rect(field).height === 0));
for (const section of fiscalSections) section.querySelector('summary').click();
const expandedByClick = fiscalSections.every(section => section.open);
const firstPair = document.querySelector('.chat-supplies-pair');
const blue = firstPair?.querySelector('.chat-supplies-pair__primary button'), stack = firstPair?.querySelector('.chat-gallery-actions');
document.documentElement.dataset.layout = JSON.stringify({ mode,
  withholding: withholdingRow ? {background:getComputedStyle(withholdingRow).backgroundColor, border:getComputedStyle(withholdingRow).borderTopColor, text:withholdingRow.querySelector('.rg-sefaz-withholding').textContent} : null,
  disclosures: { count: fiscalSections.length, initiallyCollapsed, initiallyHiddenFields, expandedByClick,
    summaries: fiscalSections.map(section => ({ width: rect(section.querySelector('summary')).width, height: rect(section.querySelector('summary')).height })) },
  overflow: document.documentElement.scrollWidth > innerWidth + 1,
  overflowingCards: [...document.querySelectorAll('.rg-row,.rg-row *')].filter(node => node.clientWidth && node.scrollWidth > node.clientWidth + 1).map(node => node.className),
  cards: document.querySelectorAll('[data-registration-row]').length,
  pdfRails: [...document.querySelectorAll('.rg-sefaz-layout')].map(layout => ({ railRight: rect(layout.querySelector('.rg-sefaz-pdf-rail')).right, mainLeft: rect(layout.querySelector('.rg-row-title')).left })),
  emissionLines: [...document.querySelectorAll('[data-field="DATA_EMISSAO"] dd')].map(field => Math.round(rect(field).height / parseFloat(getComputedStyle(field).lineHeight))),
  clusterColors: mode === 'menu' ? {} : Object.fromEntries(['total','net','discount','notes','fisco','tax-blue','tax-purple','tax-yellow','tax-rose'].map(tone => [tone, getComputedStyle(document.querySelector(`.rg-sefaz-field--${tone}`)).backgroundColor])),
  links: [...document.querySelectorAll('.rg-document-link')].map(link => ({ width: rect(link).width, height: rect(link).height })),
  notes: [...document.querySelectorAll('[data-registration-row="4"] [data-field="OBSERVACOES_NOTA"], [data-registration-row="4"] [data-field="INFORMACOES_FISCO"]')].map(note => ({
    field: note.dataset.field, whiteSpace: getComputedStyle(note.querySelector('dd')).whiteSpace,
    width: rect(note).width, containerWidth: rect(note.parentElement).width - parseFloat(getComputedStyle(note.parentElement).paddingLeft) - parseFloat(getComputedStyle(note.parentElement).paddingRight), text: note.querySelector('dd').textContent,
  })),
  menu: firstPair ? { blueHeight: rect(blue).height, galleriesHeight: rect(stack).height,
    actions: [...stack.querySelectorAll('button')].map(button => ({ id: button.dataset.replyId, top: rect(button).top, bottom: rect(button).bottom, color: getComputedStyle(button).backgroundColor })) } : null,
});
if (!new URLSearchParams(location.search).has('expanded')) for (const section of fiscalSections) section.querySelector('summary').click();
</script></body></html>
