    { id: '5', fields: { Title: 'RESUMO FICTÍCIO — DOCUMENTOS PENDENTES', NUMERO_NOTA: '555', DATA_EMISSAO: '2026-10-28',

  document.querySelectorAll('style,link[rel=stylesheet]').forEach(node => node.remove());
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/__notas-built.css';
  await new Promise((resolve, reject) => { css.onload = resolve; css.onerror = reject; document.head.append(css); });

await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

const firstPair = document.querySelector('.chat-supplies-pair');

  overflow: document.documentElement.scrollWidth > innerWidth + 1,

  cards: document.querySelectorAll('[data-registration-row]').length,
  links: [...document.querySelectorAll('.rg-document-link')].map(link => ({ width: rect(link).width, height: rect(link).height })),
  menu: firstPair ? { blueHeight: rect(blue).height, galleriesHeight: rect(stack).height,
    actions: [...stack.querySelectorAll('button')].map(button => ({ id: button.dataset.replyId, top: rect(button).top, bottom: rect(button).bottom, color: getComputedStyle(button).backgroundColor })) } : null,
});
